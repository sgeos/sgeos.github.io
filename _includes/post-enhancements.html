<script>
  (function () {
    // Automatic table of contents. Builds a TOC from post h2 and h3
    // headings when the article is long enough to benefit. Opt-out per
    // post via toc: false in front matter (passed through via
    // data-toc-suppress on the article element by the layout).
    //
    // Suppressed if the post already contains a kramdown-generated TOC
    // (id="markdown-toc") so authors who inserted { :toc } manually
    // retain full control over placement and depth.
    var article = document.querySelector('.post-content');
    var articleTag = document.querySelector('article.post');
    var suppressed = articleTag && articleTag.getAttribute('data-toc-suppress') === 'true';
    var manualToc = document.getElementById('markdown-toc');
    if (article && !suppressed && !manualToc) {
      var headings = article.querySelectorAll('h2[id], h3[id]');
      var wordCount = article.innerText.split(/\s+/).length;
      if (headings.length >= 4 && wordCount >= 800) {
        var toc = document.createElement('nav');
        toc.id = 'markdown-toc';
        toc.setAttribute('aria-label', 'Table of contents');
        var heading = document.createElement('h2');
        heading.textContent = 'Contents';
        heading.className = 'toc-heading';
        toc.appendChild(heading);
        var currentList = document.createElement('ul');
        var currentLevel = 2;
        var listStack = [currentList];
        headings.forEach(function (h) {
          var level = parseInt(h.tagName.substring(1), 10);
          while (level > currentLevel) {
            var sublist = document.createElement('ul');
            var lastItem = listStack[listStack.length - 1].lastElementChild;
            if (lastItem) {
              lastItem.appendChild(sublist);
              listStack.push(sublist);
              currentLevel++;
            } else {
              break;
            }
          }
          while (level < currentLevel && listStack.length > 1) {
            listStack.pop();
            currentLevel--;
          }
          var item = document.createElement('li');
          var link = document.createElement('a');
          link.href = '#' + h.id;
          // Use textContent to avoid inheriting the injected heading
          // anchor from the anchor-links enhancement below.
          link.textContent = h.firstChild ? h.firstChild.textContent : h.textContent;
          item.appendChild(link);
          listStack[listStack.length - 1].appendChild(item);
        });
        toc.appendChild(currentList);
        article.insertBefore(toc, article.firstChild);
      }
    }

    // Heading anchor links. Every heading with an id gets a "#" link
    // appended that permalinks to the heading. Idle by default; appears
    // on hover via CSS.
    document.querySelectorAll(
      '.post-content h2[id], .post-content h3[id], .post-content h4[id], .post-content h5[id], .post-content h6[id]'
    ).forEach(function (heading) {
      var anchor = document.createElement('a');
      anchor.href = '#' + heading.id;
      anchor.className = 'heading-anchor';
      anchor.setAttribute('aria-label', 'Direct link to section');
      anchor.textContent = '#';
      heading.appendChild(anchor);
    });

    // Copy-to-clipboard on code blocks. Appends a button that copies
    // the block's plain-text content when clicked. Falls back
    // gracefully if the Clipboard API is unavailable.
    if (navigator.clipboard) {
      document.querySelectorAll('.post-content pre').forEach(function (pre) {
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'copy-code';
        button.setAttribute('aria-label', 'Copy code to clipboard');
        button.textContent = 'Copy';
        pre.appendChild(button);
        button.addEventListener('click', function () {
          var target = pre.querySelector('code') || pre;
          var text = target.innerText;
          navigator.clipboard.writeText(text).then(function () {
            button.textContent = 'Copied';
            setTimeout(function () { button.textContent = 'Copy'; }, 2000);
          }).catch(function () {
            button.textContent = 'Error';
            setTimeout(function () { button.textContent = 'Copy'; }, 2000);
          });
        });
      });
    }

    // Reading progress indicator. A thin bar at the top of the viewport
    // that tracks how far the reader has scrolled through the article.
    // Only shows if there is enough article to scroll through.
    var article = document.querySelector('.post-content');
    if (article && article.offsetHeight > window.innerHeight * 1.5) {
      var bar = document.createElement('div');
      bar.className = 'reading-progress';
      bar.setAttribute('role', 'progressbar');
      bar.setAttribute('aria-label', 'Reading progress');
      document.body.appendChild(bar);
      var update = function () {
        var rect = article.getBoundingClientRect();
        var articleTop = window.scrollY + rect.top;
        var articleBottom = articleTop + rect.height - window.innerHeight;
        var progress = 0;
        if (articleBottom > articleTop) {
          progress = (window.scrollY - articleTop) / (articleBottom - articleTop);
        }
        progress = Math.max(0, Math.min(1, progress));
        bar.style.width = (progress * 100) + '%';
      };
      window.addEventListener('scroll', update, { passive: true });
      window.addEventListener('resize', update, { passive: true });
      update();
    }
  })();
</script>
