<header class="site-header">

  <div class="wrapper">

    <a class="site-title" href="{{ site.baseurl }}/">{{ site.title }}</a>

    <nav class="site-nav" aria-label="Main navigation">
      <button type="button" class="menu-icon" aria-label="Toggle navigation menu">
        <svg viewBox="0 0 18 15" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484l0,0C0,0.665,0.665,0,1.484,0 h15.031C17.335,0,18,0.665,18,1.484L18,1.484z"/>
          <path fill="currentColor" d="M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516l0,0c0-0.82,0.665-1.484,1.484-1.484 h15.031C17.335,6.031,18,6.696,18,7.516L18,7.516z"/>
          <path fill="currentColor" d="M18,13.516C18,14.335,17.335,15,16.516,15H1.484C0.665,15,0,14.335,0,13.516l0,0 c0-0.82,0.665-1.484,1.484-1.484h15.031C17.335,12.031,18,12.696,18,13.516L18,13.516z"/>
        </svg>
      </button>

      <div class="trigger">
        {% for my_page in site.pages %}
          {% if my_page.title and my_page.hide_from_nav != true and my_page.layout != 'archive' %}
          <a class="page-link" href="{{ my_page.url | prepend: site.baseurl }}">{{ my_page.title }}</a>
          {% endif %}
        {% endfor %}
      </div>
    </nav>

  </div>

</header>

<script>
  (function () {
    var button = document.querySelector('.site-nav .menu-icon');
    if (button) {
      button.addEventListener('click', function () {
        var nav = button.closest('.site-nav');
        var isOpen = nav.classList.toggle('open');
        button.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      });
    }

    // Global keyboard shortcut: press "/" from any page to jump to the
    // search page. Skipped when the user is typing in an input or when
    // the site-wide search page itself is already open.
    document.addEventListener('keydown', function (e) {
      if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
      var t = document.activeElement && document.activeElement.tagName;
      if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
      if (window.location.pathname.replace(/\/$/, '') === '/search') return;
      e.preventDefault();
      window.location.href = '{{ "/search/" | prepend: site.baseurl }}';
    });
  })();
</script>
