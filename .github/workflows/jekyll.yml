name: Build and deploy Jekyll site to GitHub Pages

# This workflow replaces the stock GitHub Pages branch build. Unlike the
# branch build, an Actions build does not run Jekyll in safe mode, so the
# custom Rouge lexer in `_plugins/` is honored and Keleusma code fences are
# highlighted on the deployed site.
#
# Supply chain. Actions are pinned to full commit hashes with the release tag in a
# comment, so a moved or compromised tag cannot change what runs. Dependabot proposes
# newer pins weekly after a cooldown, as `.github/dependabot.yml` sets.
#
# One-time setup: in the repository settings, set Pages -> Build and
# deployment -> Source to "GitHub Actions". Until that switch is made this
# workflow builds and (if Pages source is Actions) deploys; the legacy
# branch build continues to serve the site in the meantime.

on:
  push:
    branches: [master]
    # A push that touches only process documentation changes nothing a reader
    # sees, since `_docs/` is excluded from the build in `_config.yml`. The
    # filter applies to the whole push, so a push that also touches a post
    # still builds. The pre-push hook still runs `_verify.py` locally.
    paths-ignore:
      - "_docs/**"
  workflow_dispatch:
  # GitHub Pages builds on push, not on a timer, and the site sets
  # future: false. Without a scheduled run a forward-dated post stays a 404
  # past its own date until something else triggers a build, which defeats the
  # dated-series cadence the blog relies on. Runs shortly after midnight UTC
  # because post dates are UTC.
  #
  # Two caveats. GitHub disables scheduled workflows after 60 days with no
  # repository activity, and cron firing is best effort rather than punctual.
  schedule:
    - cron: "17 0 * * *"

# No permissions by default. Each job grants only what it needs, so the Pages write
# and the OpenID Connect token reach only the deploy job, which runs no repository
# code. zizmor flagged the earlier workflow-level grant.
permissions: {}

# Allow one concurrent deployment, do not cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A SCHEDULED RUN ONLY MATTERS WHEN A FORWARD-DATED POST HAS JUST COME DUE. The
  # schedule exists for future: false, and while no post is dated today or
  # yesterday in UTC it rebuilds an unchanged site, which cost 45 to 80
  # runner-minutes a day in late October 2026. Yesterday is included because
  # cron firing is best effort and has run as late as 06:00 UTC. Every other
  # trigger builds unconditionally.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Checkout post filenames
        if: github.event_name == 'schedule'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: _posts
          persist-credentials: false
      - name: Decide whether to build
        id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(date -u +%F)
          yesterday=$(date -u -d yesterday +%F)
          if compgen -G "_posts/${today}-*" > /dev/null || compgen -G "_posts/${yesterday}-*" > /dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No post dated $today or $yesterday, so the scheduled build is skipped."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    # GitHub's default is 360 minutes, which let one regression hold a shared runner
    # for 90 minutes a build unnoticed. A warm build measured 7m45s on 2026-10-30.
    # A cold one regenerates every download, which happens whenever
    # `_downloads.rb`, its CACHE_VERSION or the toolchain changes. Run serially,
    # that exceeded 52 minutes once the 94 failing PDFs were fixed, and this limit,
    # then 60, cancelled it before the downloads cache was saved, so the next run
    # started cold again. Four workers then ran past 45. `_downloads.rb` now stops
    # starting conversions after an 18-minute budget and defers the rest to the
    # next run, which starts from the cache this one saves. So a cold build fills
    # the cache over two or three deploys, and no build needs more than about 35
    # minutes. 45 leaves margin for one long conversion still running when the
    # budget runs out.
    timeout-minutes: 45
    # configure-pages reads the site's Pages settings, and nothing in this job writes.
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # About a minute of work, placed before the multi-minute toolchain install so
      # a corpus defect fails fast instead of after a long build. The step limit is
      # the regression guard. This step drifted from 0.2 to about 50 minutes in
      # October 2026 without anything noticing, because nothing bounded it.
      - name: Verify corpus invariants
        timeout-minutes: 5
        run: python3 _verify.py
      # The library's regression tests, one per shipped defect. Under a second,
      # no network, and every fixture is committed, so they run on a bare runner.
      - name: Library regression tests
        run: python3 _lib/test_lib.py && python3 _lib/test_sources.py
      - name: Setup Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The toolchain install measured 7m31s on every run. Caching the
      # downloaded .deb archives removes the download half; the package list is
      # the cache key so a change to it invalidates the cache.
      - name: Cache apt archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-tex-v1-${{ hashFiles('.github/workflows/jekyll.yml') }}

      - name: Install pandoc and LaTeX toolchain for downloads
        run: |
          # Seed apt from the cache, if any, so install skips re-downloading.
          if compgen -G "$HOME/apt-archives/*.deb" > /dev/null; then
            sudo cp "$HOME"/apt-archives/*.deb /var/cache/apt/archives/ || true
          fi
          sudo apt-get update
          # Two packages beyond the obvious TeX set are load-bearing, and both
          # were found the hard way, one CI run at a time.
          #
          # lmodern: pandoc's default LaTeX template loads lmodern.sty. Without
          # it xelatex aborted for every post, and because _downloads.rb only
          # warned, the step still reported success while ~293 dead PDF links
          # shipped. _downloads.rb now exits nonzero on systemic failure, which
          # is what surfaced the second package below.
          #
          # texlive-lang-chinese: supplies xeCJK.sty, which the template loads
          # whenever CJKmainfont is set. _downloads.rb now sets that option only
          # for the 2 posts that actually contain CJK, so a gap here can no
          # longer fail the other 292.
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-latex-recommended \
            texlive-latex-extra \
            lmodern \
            texlive-lang-chinese \
            fonts-dejavu \
            fonts-noto-cjk
          # Stage the archives somewhere the cache action can actually read.
          mkdir -p "$HOME/apt-archives"
          sudo cp /var/cache/apt/archives/*.deb "$HOME/apt-archives/" 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives" || true
      # The base path reaches the shell through the environment rather than by
      # expansion into the script, so no value can become shell code.
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "$BASE_PATH"
        env:
          JEKYLL_ENV: production
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      # The only check that sees what a reader sees. `_verify.py` and `_lib/lint.py` both
      # read markdown source, so both can only predict what kramdown and MathJax will do.
      # On 2026-08-11 lint reported 1,596 defect-severity findings across the corpus and the
      # rendered pages carried none of them. Placed after the build because it needs the
      # build, and it is seconds of work on an artefact that already exists.
      - name: Audit rendered output
        run: python3 _lib/render.py _site
      # Content-addressed cache of generated downloads, restored here and saved
      # after the generation step. Regenerating every post took 13m22s in 2026
      # when most PDFs failed fast, and about 45 minutes on four workers once they
      # rendered. Restore and save are separate so that a run which converts only
      # part of the corpus, as a cold cache forces, still saves what it made. The
      # saved key carries the run id, because a key that already exists is never
      # overwritten, and the save is skipped when the run added nothing, so an
      # unchanged corpus does not churn the repository's cache budget.
      - name: Restore generated downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/downloads
          key: downloads-v2-${{ hashFiles('_posts/**', '_downloads.rb', '_lib/pandoc_input.rb') }}
          restore-keys: |
            downloads-v2-${{ hashFiles('_posts/**', '_downloads.rb', '_lib/pandoc_input.rb') }}-
            downloads-v2-

      # The budget, 18 minutes, keeps the job inside its limit with the setup
      # before it, about 11 minutes, and the steps after. A post not converted in
      # time is deferred to the next run, which the log lists. The step limit is
      # the guard if one conversion runs far past the budget.
      - name: Generate PDF and EPUB downloads
        id: downloads
        timeout-minutes: 30
        run: ruby _downloads.rb
        env:
          DOWNLOADS_BUDGET_SECONDS: "1080"
      - name: Save generated downloads
        if: steps.downloads.outputs.generated != '0'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/downloads
          key: downloads-v2-${{ hashFiles('_posts/**', '_downloads.rb', '_lib/pandoc_input.rb') }}-${{ github.run_id }}
      - name: Build Pagefind search index
        run: npx -y pagefind --site _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
