name: Build and deploy Jekyll site to GitHub Pages

# This workflow replaces the stock GitHub Pages branch build. Unlike the
# branch build, an Actions build does not run Jekyll in safe mode, so the
# custom Rouge lexer in `_plugins/` is honored and Keleusma code fences are
# highlighted on the deployed site.
#
# One-time setup: in the repository settings, set Pages -> Build and
# deployment -> Source to "GitHub Actions". Until that switch is made this
# workflow builds and (if Pages source is Actions) deploys; the legacy
# branch build continues to serve the site in the meantime.

on:
  push:
    branches: [master]
  workflow_dispatch:
  # GitHub Pages builds on push, not on a timer, and the site sets
  # future: false. Without a scheduled run a forward-dated post stays a 404
  # past its own date until something else triggers a build, which defeats the
  # dated-series cadence the blog relies on. Runs shortly after midnight UTC
  # because post dates are UTC.
  #
  # Two caveats. GitHub disables scheduled workflows after 60 days with no
  # repository activity, and cron firing is best effort rather than punctual.
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, do not cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Seconds of work, placed before the multi-minute toolchain install so a
      # corpus defect fails fast instead of after a long build.
      - name: Verify corpus invariants
        run: python3 _verify.py
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      # The toolchain install measured 7m31s on every run. Caching the
      # downloaded .deb archives removes the download half; the package list is
      # the cache key so a change to it invalidates the cache.
      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-tex-v1-${{ hashFiles('.github/workflows/jekyll.yml') }}

      - name: Install pandoc and LaTeX toolchain for downloads
        run: |
          # Seed apt from the cache, if any, so install skips re-downloading.
          if compgen -G "$HOME/apt-archives/*.deb" > /dev/null; then
            sudo cp "$HOME"/apt-archives/*.deb /var/cache/apt/archives/ || true
          fi
          sudo apt-get update
          # Two packages beyond the obvious TeX set are load-bearing, and both
          # were found the hard way, one CI run at a time.
          #
          # lmodern: pandoc's default LaTeX template loads lmodern.sty. Without
          # it xelatex aborted for every post, and because _downloads.rb only
          # warned, the step still reported success while ~293 dead PDF links
          # shipped. _downloads.rb now exits nonzero on systemic failure, which
          # is what surfaced the second package below.
          #
          # texlive-lang-chinese: supplies xeCJK.sty, which the template loads
          # whenever CJKmainfont is set. _downloads.rb now sets that option only
          # for the 2 posts that actually contain CJK, so a gap here can no
          # longer fail the other 292.
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-latex-recommended \
            texlive-latex-extra \
            lmodern \
            texlive-lang-chinese \
            fonts-dejavu \
            fonts-noto-cjk
          # Stage the archives somewhere the cache action can actually read.
          mkdir -p "$HOME/apt-archives"
          sudo cp /var/cache/apt/archives/*.deb "$HOME/apt-archives/" 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives" || true
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      # The only check that sees what a reader sees. `_verify.py` and `_lib/lint.py` both
      # read markdown source, so both can only predict what kramdown and MathJax will do.
      # On 2026-08-11 lint reported 1,596 defect-severity findings across the corpus and the
      # rendered pages carried none of them. Placed after the build because it needs the
      # build, and it is seconds of work on an artefact that already exists.
      - name: Audit rendered output
        run: python3 _lib/render.py _site
      # Content-addressed cache of generated downloads. Regenerating all 293
      # posts measured 13m22s on every deploy, even for a docs-only push.
      # restore-keys lets a new run start from the most recent prior cache and
      # regenerate only what actually changed.
      - name: Cache generated downloads
        uses: actions/cache@v4
        with:
          path: .cache/downloads
          # Keyed on the post sources and the generator, not the commit SHA.
          # Keying on the SHA saved a fresh copy of the whole cache on every
          # deploy, churning the repository cache budget for no benefit; an
          # unchanged corpus now hits the existing entry and re-saves nothing.
          key: downloads-v1-${{ hashFiles('_posts/**', '_downloads.rb') }}
          restore-keys: |
            downloads-v1-

      - name: Generate PDF and EPUB downloads
        run: ruby _downloads.rb
      - name: Build Pagefind search index
        run: npx -y pagefind --site _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
