# Documented exemptions for _verify.py.
#
# A warning nobody ever acts on becomes noise, and noise is how the original
# `specific` problem stayed invisible for months. So every warning should either
# be fixed or recorded here with a reason. An entry is a claim that the flag is
# a false positive for a stated cause, and it is auditable precisely because the
# cause is written down.
#
# `post` is matched as a substring of the filename, so a series can be exempted
# with one entry. `check` is the check name reported by _verify.py.

word-frequency:
  - post: machines_that_learn_from_experience
    word: framework
    reason: >
      A twelve-article survey OF learning frameworks. Measured 2026-08-05: 1379
      modified phrases naming distinct technical frameworks, such as
      "reinforcement learning framework" and "predictive coding framework",
      against 149 bare uses. Pushing the count lower means substituting
      synonyms into technical terms.

  - post: ethnoreligion_and_american_political_economy
    word: framework
    reason: >
      The series argues from an explicit analytical framework and names it
      repeatedly by design. Remediated on 2026-08-05 for the formulaic uses;
      what remains is the load-bearing term.

  - post: storing-elixir-release-configuration
    word: configuration
    reason: Release configuration is the subject of the article, and its title.

  - post: virtual_reputation_manipulation
    word: framework
    reason: >
      The series builds and names a detection framework. Reduced on 2026-08-05
      from the formulaic openers; the residue is the subject matter.

  - post: rocket_propellant_chemistry
    word: specific
    reason: >
      `specific impulse` is the articles' core measure. 201 of roughly 222 uses
      are that term. Verified 2026-08-05.

  - post: side_scrolling_with_parallax_layers
    word: factor
    reason: >
      `scroll factor` is a term the article defines and then uses throughout.
      Recorded in the 2026-08-05 word-pass exclusion table.

  - post: structures_and_the_flight_envelope
    word: factor
    reason: >
      `load factor` is a defined aerodynamic term and the article's subject.

  - post: operator_training_and_certification
    word: typically
    reason: >
      The article makes hedged claims about typical practice, so the hedge is
      load-bearing rather than filler.

  - post: axonometric_projection
    word: factor
    reason: Projection factors are the article's subject.

  - post: sprite_scaling
    word: factor
    reason: Scaling factor is a defined term.

  - post: context_engineering
    word: configuration
    reason: >
      Context-window configuration is the article's subject; `context` itself
      was already excluded on the same grounds.

  # ---------------------------------------------------------------------------
  # Added 2026-08-11. Each reason states a MEASURED modifier split, because the
  # discriminator between a term of art and a tic is whether the word appears in
  # named compounds or bare. A bare count is what makes a warning worth acting
  # on, and a rate alone cannot see it.
  # ---------------------------------------------------------------------------

  - post: spacex_history
    word: configuration
    reason: >
      The series analyses vehicle, service and institutional configurations and
      names each one. Measured 2026-08-11 across the four flagged articles, the
      modified share is 98 percent in value_capture, 99 percent in
      decomposability, 79 percent in generality_forcing and 62 percent in
      governance, with "capability configuration" at 39 uses and
      "decomposability configuration" at 25 the largest compounds. The
      determiner-led residue is ordinary anaphora with a named antecedent.

  - post: camera_as_linear_operator
    word: framework
    reason: >
      Measured 2026-08-11 at 95 percent modified, led by "projective framework"
      at 12 uses. The projective framework is the article's subject and the
      term is standard in projective geometry.

  - post: picking_and_hit_testing
    word: framework
    reason: >
      Measured 2026-08-11 at 90 percent modified, led by "picking framework" at
      10 uses and "map framework" at 4. Each names a distinct construct the
      article defines.

  - post: contemporary_snapshot_and_extrapolation
    word: framework
    reason: >
      Measured 2026-08-11 at 70 percent modified, led by "order framework" at
      11 uses, which is the analytical frame the industrialization_waves series
      names by design. Companion to the non_industrializers entry below.

  - post: non_industrializers_and_edge_cases
    word: framework
    reason: >
      Measured 2026-08-11 at 88 percent modified, led by "order framework" at 8
      uses. Same series and same named frame as
      contemporary_snapshot_and_extrapolation.

  - post: llm_knowledge_graphs
    word: configuration
    reason: >
      Measured 2026-08-11 at 67 percent modified, led by "agent configuration".
      Fifteen uses in a short article, and the residue has a named antecedent.

  - post: fixup_tables_forward_jump_problem
    word: mechanism
    reason: >
      The fixup table mechanism is the article's subject and its title.
      Measured 2026-08-11 at 13 uses in 2,058 words, of which the bare ones are
      anaphora referring to that mechanism. Ordinary English, not filler.

  - post: claude_code_getting_started_over_ssh
    word: configuration
    reason: >
      Measured 2026-08-11 at 56 percent modified, being "client configuration",
      "host configuration", "timeout configuration" and "configuration file".
      Secure Shell configuration is what the article is about.

  - post: x_planes_martin_marietta_x24
    word: factor
    reason: >
      Measured 2026-08-11 as "load factor" at 13 uses, "a factor of" as the
      ordinary multiplicative idiom at 10, and "efficiency factor" at 4. Load
      factor is a defined aerodynamic term, matching the existing
      structures_and_the_flight_envelope entry.

style-contraction:
  - post: virtual_reputation_manipulation_competitor_attack
    reason: >
      "You Can't Stay Here" is the title of the Chandrasekharan et al 2017
      paper, cited in prose rather than inside quotation marks.
