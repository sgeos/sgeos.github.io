[[publisher]]
name = "ACM SIGPLAN"
venue_pattern = '\bSIGPLAN\b|^Proceedings of the ACM on Programming Languages$'
journals = true
proceedings = true
reviewers = "reviewers with sufficient relevant expertise, bound by SIGPLAN's conflict of interest policy"
basis = "SIGPLAN's conference submission review policy, which governs its conferences and the papers they publish in Proceedings of the ACM on Programming Languages. ACM's own policy pages refused automated reading."
[[publisher.evidence]]
url = "https://www.sigplan.org/Resources/Policies/Review/"
quote = "SIGPLAN conferences should strive to ensure that every submission is reviewed by people with sufficient relevant expertise."
read = "2026-10-24"
method = "fetched"
[[publisher.evidence]]
url = "https://www.sigplan.org/Resources/Policies/Review/"
quote = "If a conflict of interest exists, then the reviewer should decline to review a paper."
read = "2026-10-24"
method = "fetched"
