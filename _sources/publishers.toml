[[publisher]]
name = "Springer computer-science proceedings series"
venue_pattern = '^(Lecture Notes in Computer Science|Lecture Notes in Artificial Intelligence|Lecture Notes in Bioinformatics|Communications in Computer and Information Science|IFIP Advances in Information and Communication Technology|Lecture Notes in Business Information Processing|Lecture Notes of the Institute for Computer Sciences, Social Informatics and Telecommunications Engineering)$'
journals = false
proceedings = true
