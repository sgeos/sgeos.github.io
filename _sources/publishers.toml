# Publisher-wide and society-wide peer review policies, each read from a source that speaks for the
# venues it covers, and applied by `python3 _lib/sources_import.py credit-venues` to every uncredited
# venue whose recorded publisher, or whose name, it matches. A venue with its own evidence keeps it.
# Read 2026-10-24. Quotes from web pages come through a summarising fetch tool and may be fragments;
# quotes from PDFs were extracted with pdftotext and are verbatim.

[[publisher]]
name = "IEEE"
aliases = ["Institute of Electrical and Electronics Engineers (IEEE)", "IEEE Computer Society", "Institute of Electrical and Electronics Engineers", "IEEE Press"]
journals = true
proceedings = true
reviewers = "at least two independent experts invited by the editor for journals; a Technical Program Committee of experts appointed by the program chair for conferences"
basis = "IEEE's author centres state IEEE policy for its journals and require peer review of all its conference papers. The journals page names no exceptions and gives no list of titles."
[[publisher.evidence]]
url = "https://journals.ieeeauthorcenter.ieee.org/submit-your-article-for-peer-review/about-the-peer-review-process/"
quote = "Reviewers are experts in the field who are independent of the authors and the editorial office."
read = "2026-10-24"
method = "fetched"
[[publisher.evidence]]
url = "https://journals.ieeeauthorcenter.ieee.org/submit-your-article-for-peer-review/about-the-peer-review-process/"
quote = "The journal editor invites reviewers who are experts in your article's subject matter"
read = "2026-10-24"
method = "fetched"
[[publisher.evidence]]
url = "https://conferences.ieeeauthorcenter.ieee.org/understand-peer-review/"
quote = "IEEE requires all conference papers go through the peer review process before publication."
read = "2026-10-24"
method = "fetched"
[[publisher.evidence]]
url = "https://conferences.ieeeauthorcenter.ieee.org/understand-peer-review/"
quote = "Each IEEE Conference’s Technical Program Chair will appoint a Technical Program Committee."
read = "2026-10-24"
method = "fetched"

