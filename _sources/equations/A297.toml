# Equation classification for A297. Read by `python3 _lib/equations.py`.

caution = "Each equation uses the units of the International System stated in its section, with information measured in nats unless converted to bits, and several letters are reused across sections, so $\\mu$, $\\lambda$, $e$, $b$, $S$, $R$ and $T$ each change meaning between sections and are read from the nearest prose."

[[equation]]
tag = 1
class = "standard"
title = "Linear Gaussian Observation Model"
gloss = "Each flight returns a measurement that is a linear function of the unknown parameter vector plus zero-mean Gaussian noise with a known covariance."
cite = ["ref_bayesian_experimental_design", "research_lindley_1956", "research_chaloner_verdinelli_1995"]
digest = "385029d7d5377145"

[[equation]]
tag = 2
class = "standard"
title = "Information-Form Posterior Covariance Update"
gloss = "Under the linear Gaussian model the inverse posterior covariance is the inverse prior covariance plus one information increment from each flight."
cite = []
digest = "d53fc42e513ed8c4"

[[equation]]
tag = 3
class = "standard"
title = "Information-Weighted Posterior Mean"
gloss = "The posterior mean combines the prior mean and every measurement, each weighted by the information it carries."
cite = []
digest = "67529e811665ef60"

[[equation]]
tag = 4
class = "standard"
title = "D-Optimal and A-Optimal Design Criteria"
gloss = "D-optimality maximises the determinant of the information matrix and A-optimality minimises the trace of the posterior covariance."
cite = ["book_atkinson_donev_1992"]
digest = "065ffc9ac0849d5c"

[[equation]]
tag = 5
class = "standard"
title = "Differential Entropy of a Gaussian Posterior"
gloss = "The differential entropy of a multivariate Gaussian depends only on its dimension and the determinant of its covariance."
cite = []
digest = "a45454f2f581522e"

[[equation]]
tag = 6
class = "standard"
title = "Expected Information Gain of an Experiment"
gloss = "The expected information gain of a planned flight is the expected Kullback-Leibler divergence of the posterior from the prior."
cite = []
digest = "f2d5271363493aae"

[[equation]]
tag = 7
class = "standard"
title = "Scalar Posterior Variance after Repeated Measurements"
gloss = "For a single quantity measured repeatedly with equal noise, the posterior precision is the prior precision plus one measurement precision per flight."
cite = []
digest = "87ca0c0a7bf54db9"

[[equation]]
tag = 8
class = "standard"
title = "Flight Count Required to Reach a Target Uncertainty"
gloss = "Inverting the scalar update and rounding up gives the smallest number of flights that brings the posterior standard deviation to the target."
cite = []
digest = "cdce9374ae19df6b"

[[equation]]
tag = 9
class = "bespoke"
title = "Bespoke Flight Count for the Transonic Drag Problem"
gloss = "The required flight count per Mach band follows from assumed relative uncertainties of $1.0$ before the programme, $0.25$ per flight and a target of $0.05$, values the article chose to illustrate the X-1."
cite = []
digest = "e6f010b6eb68e7ba"

[[equation]]
tag = 10
class = "standard"
title = "Information Gain as Entropy Reduction"
