title = "Reduced Frequency"
gloss = "The reduced frequency is the angular frequency times the semichord divided by the flow speed."
cite = ["research_theodorsen_1935"]
digest = "1f5b836e1798c53f"

[[equation]]
tag = 93
class = "standard"
title = "Flutter Speed Index and Mass Ratio"
gloss = "The flutter speed is normalised by the semichord, the torsional natural frequency and the square root of the ratio of wing mass to the mass of surrounding air."
cite = []
digest = "a8aa7a12bf158c8b"

[[equation]]
tag = 94
class = "standard"
title = "Adiabatic Stagnation Temperature"
gloss = "Decelerating the free stream adiabatically to rest raises its temperature by a factor that grows with the square of the Mach number."
cite = []
digest = "8682e993b1e115b5"

[[equation]]
tag = 95
class = "standard"
title = "Laminar and Turbulent Recovery Factors"
gloss = "The recovery factor is approximately the square root of the Prandtl number for a laminar boundary layer and its cube root for a turbulent one."
cite = []
digest = "c34249222295a2e4"

[[equation]]
tag = 96
class = "standard"
title = "Recovery Temperature"
gloss = "The recovery temperature is the free-stream temperature raised by the recovery factor times the stagnation rise."
cite = []
digest = "2fed13399a2638f4"

[[equation]]
tag = 97
class = "standard"
title = "Convective Heat Flux"
gloss = "The convective heat flux is the heat transfer coefficient times the difference between the recovery and wall temperatures."
cite = []
digest = "352d13aef7f62c70"

[[equation]]
tag = 98
class = "standard"
title = "Stanton Number and the Reynolds Analogy"
gloss = "The Stanton number normalises the heat transfer coefficient, and the Reynolds analogy relates it to half the skin friction coefficient corrected by the Prandtl number."
cite = ["research_eckert_1956"]
digest = "3a594c06d14b81d8"

[[equation]]
tag = 99
class = "standard"
title = "Fay-Riddell Stagnation-Point Heat Flux"
gloss = "The stagnation-point heat flux depends on edge and wall density-viscosity products, the stagnation velocity gradient and the enthalpy difference across the boundary layer."
cite = ["research_fay_riddell_1958"]
digest = "4b2e2813ec0f7fac"

[[equation]]
tag = 100
class = "standard"
title = "Newtonian Stagnation Velocity Gradient"
gloss = "The velocity gradient at a blunt stagnation point follows from the Newtonian pressure difference and the nose radius."
cite = []
digest = "e90efba6de31ca15"

[[equation]]
tag = 101
class = "standard"
title = "Sutton-Graves Stagnation-Point Heating Correlation"
gloss = "The stagnation-point heat flux scales with the square root of density over nose radius and the cube of velocity."
cite = ["research_sutton_graves_1971"]
digest = "3e3a0802bf852e25"

[[equation]]
tag = 102
class = "bespoke"
title = "Bespoke Stagnation Heat Flux of the X-15A-2"
gloss = "The Sutton-Graves correlation is evaluated at the record speed and density with an effective nose radius of 0.10 metres that the article assumes."
cite = []
digest = "e01fb52d0d81c808"

[[equation]]
tag = 103
class = "standard"
title = "Biot Number"
gloss = "The Biot number compares conduction resistance through the wall with convection resistance at its surface."
cite = []
digest = "6429a82feca2c655"

[[equation]]
tag = 104
class = "standard"
title = "Lumped Transient Wall Heat Balance"
gloss = "A thin wall with small Biot number stores heat at the rate convection delivers it less the rate it radiates."
cite = []
digest = "2db2ca533c6d7f51"

[[equation]]
tag = 105
class = "standard"
title = "Radiation Equilibrium Wall Temperature"
gloss = "A wall that conducts no heat away settles at the temperature at which it radiates what it absorbs."
cite = ["ref_stefan_boltzmann"]
digest = "ae97f9880faa8553"

[[equation]]
tag = 106
class = "standard"
title = "Ballistic Coefficient"
gloss = "The ballistic coefficient is the mass divided by the product of drag coefficient and reference area."
cite = ["ref_ballistic_coefficient"]
digest = "befa8c5ed3ff1bd7"

[[equation]]
tag = 107
class = "standard"
title = "Exponential Atmosphere"
gloss = "Density falls exponentially with altitude over a constant scale height."
cite = []
digest = "24a866fa48214dd6"

[[equation]]
tag = 108
class = "standard"
title = "Allen-Eggers Ballistic Entry Velocity"
gloss = "Ballistic entry at constant flight path angle through an exponential atmosphere gives velocity as a double exponential in altitude."
cite = ["research_allen_eggers_1958"]
digest = "be81561085fc0bb2"

[[equation]]
tag = 109
class = "standard"
title = "Allen-Eggers Peak Deceleration"
gloss = "The peak deceleration of ballistic entry depends on entry speed, flight path angle and scale height but not on the ballistic coefficient."
cite = ["research_allen_eggers_1958"]
digest = "ec2c00d688384565"

[[equation]]
tag = 110
class = "standard"
title = "Altitude of Peak Deceleration"
gloss = "The ballistic coefficient fixes only the altitude at which the peak deceleration occurs."
cite = []
digest = "7f10fe48c96e0528"

[[equation]]
tag = 111
class = "standard"
title = "Integrated Heat Load"
gloss = "The heat load is the time integral of the stagnation-point heat flux over the entry."
cite = []
digest = "e9ea111adb4c2dfe"

[[equation]]
tag = 112
class = "standard"
title = "Longitudinal Static Stability Criterion"
gloss = "Static stability requires a negative pitching moment slope, which holds when the centre of gravity lies ahead of the aerodynamic centre."
cite = []
digest = "9e8ac3a5de5dc1d4"

[[equation]]
tag = 113
class = "standard"
title = "Neutral Point"
gloss = "The neutral point is the centre of gravity position at which the pitching moment no longer varies with lift coefficient."
cite = []
digest = "9593e05dcc5eca10"

[[equation]]
tag = 114
class = "standard"
title = "Static Margin"
gloss = "The static margin is the distance from the centre of gravity to the aerodynamic centre in units of the mean aerodynamic chord."
cite = ["ref_longitudinal_static_stability"]
digest = "86545ba2d940b533"

[[equation]]
tag = 115
class = "standard"
title = "Short-Period Natural Frequency"
gloss = "The short-period frequency is approximated from the dimensional pitch and heave stability derivatives."
cite = []
digest = "536af749f60dab4f"

[[equation]]
tag = 116
class = "standard"
title = "Short-Period Damping Ratio"
gloss = "The short-period damping ratio is approximated from the pitch damping, the angle of attack rate derivative and the heave derivative."
cite = []
digest = "23d9006c7919da50"

[[equation]]
tag = 117
class = "standard"
title = "Lanchester Phugoid Frequency"
gloss = "To first order the phugoid frequency is the square root of two times gravity divided by speed, independent of the aerodynamics."
cite = ["ref_phugoid"]
digest = "a3a786f3ffba8ce4"

[[equation]]
tag = 118
class = "standard"
title = "Phugoid Damping Ratio"
gloss = "To first order the phugoid damping ratio is inversely proportional to the lift-to-drag ratio."
cite = []
digest = "c20a932a917d5163"

[[equation]]
tag = 119
class = "standard"
title = "Dutch Roll Frequency and Roll Subsidence Time Constant"
gloss = "The Dutch roll frequency follows from the directional stiffness and yaw inertia, and the roll time constant from the roll inertia and roll damping."
cite = ["ref_dutch_roll"]
digest = "5323b9f830abe78b"

[[equation]]
tag = 120
class = "standard"
title = "Spiral Stability Condition"
gloss = "The spiral mode is stable when the product of the dihedral effect and yaw damping exceeds the product of roll due to yaw rate and directional stiffness."
cite = []
digest = "09e420299cc428b8"

[[equation]]
tag = 121
class = "standard"
title = "Gyroscopic Terms of the Euler Moment Equations"
gloss = "The pitch and yaw moment equations contain products of body rates and inertia differences that couple roll into pitch and yaw."
cite = ["ref_inertia_coupling"]
digest = "4bdfee91fd384169"

[[equation]]
tag = 122
class = "standard"
title = "Critical Roll Rate for Inertia Coupling"
gloss = "Divergence follows when the roll rate approaches the lower of the pitch and yaw natural frequencies."
cite = ["research_phillips_1948"]
digest = "212e6297984f8768"

[[equation]]
tag = 123
class = "standard"
title = "Minimum-Time Bang-Bang Manoeuvre"
gloss = "A rest-to-rest rotation through $\\Delta \\phi$ with full thrust for half the time and full reverse thrust for the other half takes a time set by inertia, angle and control moment."
cite = []
digest = "1ffdcc40418a388e"

[[equation]]
tag = 124
class = "standard"
title = "Reaction Control Propellant Mass"
gloss = "The propellant required is the total thruster impulse divided by the specific impulse of the thrusters times standard gravity."
cite = []
digest = "5ca4e65e2e25a4e3"

[[equation]]
tag = 125
class = "bespoke"
title = "Bespoke Aerodynamic to Reaction Control Handover Pressure"
gloss = "The article places the handover at the dynamic pressure at which the thruster moment equals the aerodynamic rolling moment at full control deflection."
cite = []
digest = "231a73076c691487"

[[equation]]
tag = 126
class = "standard"
title = "Combined Standard Uncertainty"
gloss = "For uncorrelated inputs the variance of a derived quantity is the sum of squared sensitivities times the input variances."
cite = ["ref_propagation_of_uncertainty", "ref_measurement_uncertainty"]
digest = "e6610b06de572862"

[[equation]]
tag = 127
class = "standard"
title = "Covariance Term of Uncertainty Propagation"
gloss = "Correlated inputs add twice the sum over pairs of sensitivity products times the input covariances."
cite = []
digest = "b800995148e3bc96"

[[equation]]
tag = 128
class = "standard"
title = "Drag from Accelerating Flight"
gloss = "Drag is thrust less the product of instantaneous mass and measured axial acceleration."
cite = ["research_beeler_1956"]
digest = "2677b734dc45e497"

[[equation]]
tag = 129
class = "bespoke"
title = "Bespoke Drag Uncertainty of the X-1 Example"
gloss = "The combined uncertainty is evaluated for supposed uncertainties of three percent in thrust, half a percent in mass and one and a half percent in acceleration, values the article chose for illustration."
cite = []
digest = "73601766a1e793af"

[[equation]]
tag = 130
class = "standard"
title = "Relative Uncertainty of a Difference"
gloss = "Differencing two measured quantities amplifies the relative uncertainty by approximately the ratio of the larger quantity to the difference."
cite = []
digest = "60eb5f7eb8a84baf"

[[equation]]
tag = 131
class = "standard"
title = "Nyquist Sampling Criterion"
gloss = "A signal containing frequencies up to $f_{\\max}$ must be sampled at more than twice that frequency."
cite = ["ref_nyquist_shannon", "research_nyquist_1928"]
digest = "c3bb6d31e44d2087"

[[equation]]
tag = 132
class = "standard"
title = "Quantisation Step and Quantisation Noise"
gloss = "A converter with $b$ bits over a full-scale range has a step of that range divided by $2^b$ and a noise standard deviation of the step divided by the square root of twelve."
cite = []
digest = "619547d21e86705b"

[[equation]]
tag = 133
class = "standard"
title = "Signal-to-Noise Ratio of an Ideal Converter"
gloss = "Each bit of word length adds about six decibels to the signal-to-noise ratio of a full-scale sine wave."
cite = []
digest = "41a38dfe27f4e6e7"

[[equation]]
tag = 134
class = "standard"
title = "Telemetry Bit Rate"
gloss = "The telemetry bit rate is the number of channels times the sample rate times the bits per word."
cite = ["ref_telemetry"]
digest = "52a04774b450740d"

[[equation]]
tag = 135
class = "standard"
title = "Shannon Channel Capacity"
gloss = "The capacity of a noisy channel is the bandwidth times the base-two logarithm of one plus the signal-to-noise ratio."
cite = ["research_shannon_1948"]
digest = "6978fc0f6921a1ca"

[[equation]]
tag = 136
class = "bespoke"
title = "Bespoke Programme Cost Decomposition"
gloss = "The article decomposes programme cost into a development term, a per-flight term and a per-airframe term."
cite = []
digest = "2cd804f5e9cdb794"

[[equation]]
tag = 137
class = "standard"
title = "Wright Learning Curve"
gloss = "Unit cost falls by a fixed fraction $b$ for every doubling of cumulative output."
cite = ["research_wright_1936"]
digest = "cf67f572e2add6c2"

[[equation]]
tag = 138
class = "bespoke"
title = "Bespoke Airframe Count from Binomial Attrition"
gloss = "The article models losses as independent with a constant probability per flight and requires that the programme completes with fewer losses than airframes at a chosen confidence."
cite = ["ref_binomial_distribution"]
digest = "4b41cece686e99a5"

[[equation]]
tag = 139
class = "bespoke"
title = "Bespoke Expected Losses of the X-1 Example"
gloss = "The expected number of losses is evaluated for 25 flights at a per-flight loss probability of $0.02$ that the article assumes."
cite = []
digest = "4c787493dacd11df"

[[equation]]
tag = 140
class = "bespoke"
title = "Bespoke Required Airframe Count"
gloss = "Three airframes is the smallest number that satisfies the attrition condition at the assumed loss probability and a required confidence of 95 percent."
cite = []
digest = "1729160a713cf859"

[[equation]]
tag = 141
class = "bespoke"
title = "Bespoke Programme Justification Condition"
gloss = "The article justifies a programme when the gain in value of the downstream decision from reducing the keystone uncertainty exceeds the total programme cost."
cite = []
digest = "ac776bb6e4f7355d"

[[equation]]
tag = 142
class = "standard"
title = "Expected Value of Sample Information"
gloss = "The expected value of sample information is the expected best utility after observing the data less the best expected utility without it."
cite = []
digest = "4a64f140f4c586c4"

[[equation]]
tag = 143
class = "standard"
title = "Marginal Information per Flight"
gloss = "Differentiating the scalar information gain with respect to the flight count shows that each further flight adds less, in proportion to $1/n$ for large $n$."
cite = []
digest = "f192c1509325b20d"

[[equation]]
tag = 144
class = "bespoke"
title = "Bespoke Designation Assignment as a Relation"
gloss = "The article writes the assignment of numbers to programmes as a relation between designations and programmes, with no assumption that it is a function."
cite = []
digest = "1c15224915e2af73"

[[equation]]
tag = 145
class = "bespoke"
title = "Bespoke Assignment Density of the Designation Range"
gloss = "The article defines assignment density as the fraction of the 76 designations in scope that correspond to a programme, with eleven counted as unassigned."
cite = []
digest = "224c468c403cb195"

[[equation]]
tag = 146
class = "bespoke"
title = "Bespoke Mean Assignment Rate"
gloss = "The article divides the 65 assigned designations by the 80 years from the X-1 to the X-76 to give a mean rate."
cite = []
digest = "05c5489303c3633a"

[[equation]]
tag = 147
class = "standard"
title = "Index of Dispersion"
gloss = "The index of dispersion is the sample variance of the counts per interval divided by their mean, near one for a Poisson process."
cite = []
digest = "82ae6304f395873b"

