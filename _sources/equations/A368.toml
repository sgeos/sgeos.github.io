# Equation classification for A368. Read by `python3 _lib/equations.py`.

caution = "Every quantity here is a count, a share, a probability, a number of bits or an interval in days, the entry year of an early number is a proxy dated two ways that the article calls P1 and P2, and several classifications, among them the keystone class and the comparison verdict, are one reader's readings of each article rather than measurements."

[[equation]]
tag = 1
class = "bespoke"
title = "Bespoke Assignment Relation Between Numbers and Programmes"
gloss = "Following the first article, the synthesis writes the designation system as a relation between the design numbers 1 to 76 and the set of programmes, with no assumption that it is a function."
cite = ["related_post_a297_framing"]
digest = "4d7a53760683bbaa"

[[equation]]
tag = 2
class = "standard"
title = "Condition for the Relation to Be a Function"
gloss = "The relation is a function on its domain only if no design number is applied to two different programmes."
cite = []
digest = "12a10d194ffcb515"

[[equation]]
tag = 3
class = "standard"
title = "Condition for the Relation to Be Injective"
gloss = "The relation is injective only if no programme holds two different design numbers."
cite = []
digest = "1913ded251c93ad5"

[[equation]]
tag = 4
class = "bespoke"
title = "Bespoke Share of Numbers Assigned to a Programme"
gloss = "Counting the X-23 as assigned because a vehicle flew under it, although no allocation request for it is recorded, 65 of the 76 design numbers went to a programme, a share of 0.855."
cite = ["ref_missing_mds"]
digest = "90bd77e25e67c53e"

[[equation]]
tag = 5
class = "bespoke"
title = "Bespoke Decomposition of the Unassigned Numbers"
gloss = "The series divides the eleven unassigned numbers into one reserved, one refused, two taken into the drone pool and seven passed over in the block."
cite = ["related_post_a336_x39_reserved_never_assigned", "related_post_a349_x52_designation_refused", "related_post_a366_x69_through_x75_leapfrogged_block"]
digest = "1ba754ce35b18f9a"

[[equation]]
tag = 6
class = "bespoke"
title = "Bespoke Share With the X-23 Counted as Unassigned"
gloss = "Counting the X-23 as unassigned instead, because no allocation request for it is recorded, lowers the share to 64 of 76."
cite = ["related_post_a320_martin_marietta_x23"]
digest = "64976f9a08584aad"

[[equation]]
tag = 7
class = "standard"
title = "Monotonicity of Allocation"
gloss = "The assignment is monotone if a higher design number is never allocated before a lower one."
cite = []
digest = "5842b53b1b17ac00"

[[equation]]
tag = 8
class = "standard"
title = "Kendall Rank Correlation"
gloss = "Kendall's rank correlation is the count of concordant pairs less the count of discordant pairs, divided by the number of pairs."
cite = ["ref_kendall_1938"]
digest = "23597a0e2eb25e27"

[[equation]]
tag = 9
class = "standard"
title = "Rank Correlation of Number and Allocation Date"
gloss = "Over the 23 research numbers whose first allocation the register records, 250 of the 253 pairs are concordant and one is discordant, which gives a rank correlation of 0.984."
cite = ["ref_kendall_1938", "ref_mds_addendum"]
digest = "cc9f988b9acb7981"

[[equation]]
tag = 10
class = "standard"
title = "Accounting Identity for the Pairs"
gloss = "Every pair is concordant, discordant or tied on date, so the three counts sum to the 253 pairs."
cite = []
digest = "182637a17664c8e3"

[[equation]]
tag = 11
class = "bespoke"
title = "Bespoke Advance Over the High-Water Mark"
gloss = "The article defines the advance of an allocation as its design number less the highest number allocated before it, so a counter would give an advance of one every time."
cite = ["related_post_a364_x67_slot_taken_by_xq67"]
digest = "8183a913d249d9f8"

[[equation]]
tag = 12
class = "bespoke"
title = "Bespoke Share of Advances Equal to One"
gloss = "Sixteen of the register's 22 research advances equal one, a share of 0.727, the figure the X-67 article measured."
cite = ["related_post_a364_x67_slot_taken_by_xq67"]
digest = "e65cbbcf75e2cf48"

[[equation]]
tag = 13
class = "bespoke"
title = "Bespoke Telescoping of the Positive Advances"
gloss = "Because the high-water mark moves only on a positive advance, the positive parts of the advances sum to the span of the walk from 44 to 76."
cite = []
digest = "bb4b7d0ec4b73050"

[[equation]]
tag = 14
class = "bespoke"
title = "Bespoke Count of Permanently Skipped Numbers"
gloss = "The numbers passed over by advances greater than one, less the one later backfilled, give ten permanently skipped numbers, which agrees with a direct count of the gaps between 44 and 76."
cite = ["ref_mds_addendum"]
digest = "57bbbcefeda7eb58"

[[equation]]
tag = 15
class = "standard"
title = "Index of Dispersion"
gloss = "The index of dispersion is the sample variance of the counts per decade divided by their mean, which is one in expectation for a Poisson process."
cite = ["ref_fisher_1950", "ref_cochran_1954"]
digest = "9869f0bac8303671"

[[equation]]
tag = 16
class = "standard"
title = "Dispersion Test Statistic"
gloss = "Under the null hypothesis of a constant rate, the number of decades less one times the index of dispersion follows a chi-square distribution with that many degrees of freedom."
cite = ["ref_fisher_1950", "ref_cochran_1954"]
digest = "224cad2418e06b12"

[[equation]]
tag = 17
class = "bespoke"
title = "Bespoke Dispersion of Entries Under the P2 Dating"
gloss = "Under the P2 dating, which prefers the register's allocation date and then the article's designation date, the decade counts give an index of 3.60 and a statistic of 28.8 on eight degrees of freedom."
cite = []
digest = "ae58228e05d205bf"

[[equation]]
tag = 18
class = "bespoke"
title = "Bespoke Dispersion of Entries Under the P1 Dating"
gloss = "Under the P1 dating, which takes the earliest recorded event, the decade counts give an index of 2.90 and a statistic of 23.2."
cite = []
digest = "25c99472e7e0dedc"

[[equation]]
tag = 19
class = "standard"
title = "Chi-Square Tail for Eight Degrees of Freedom"
gloss = "For an even number of degrees of freedom the chi-square upper tail has a closed form as an exponential times a finite Poisson sum."
cite = []
digest = "2f16eeaddff92954"

[[equation]]
tag = 20
class = "standard"
title = "Shannon Entropy of the Sponsor Mentions"
gloss = "The diversity of sponsorship in a decade is the Shannon entropy of the shares of its sponsor mentions across the sponsor classes."
cite = ["ref_shannon_1948"]
digest = "3310c21939c9815f"

[[equation]]
tag = 21
class = "standard"
title = "Sponsor Entropy of the 1950s"
gloss = "The 1950s' 26 sponsor mentions, 16 Air Force, 6 for the National Advisory Committee for Aeronautics and 4 Navy, have an entropy of 1.33 bits."
cite = []
digest = "cec723454e93c64d"

[[equation]]
tag = 22
class = "standard"
title = "Pielou Evenness"
gloss = "The evenness is the entropy divided by its maximum for the number of classes present, which separates balance from the number of classes."
cite = ["ref_pielou_1966"]
digest = "75f2a6e8e7950fed"

[[equation]]
tag = 23
class = "standard"
title = "Wilson Score Interval"
gloss = "The Wilson interval for an observed proportion, which behaves well at small samples and near zero or one, is centred on an adjusted proportion with a half-width from the normal quantile."
cite = ["ref_wilson_1927"]
digest = "33e79a4117642487"

[[equation]]
tag = 24
class = "standard"
title = "Hypergeometric Probability of a Two-by-Two Table"
gloss = "With the margins fixed, the probability of exactly $a$ crewed vehicles in the early group is hypergeometric."
cite = ["ref_fisher_1935"]
digest = "31517daacf8d01c5"

[[equation]]
tag = 25
class = "standard"
title = "Two-Sided Fisher Exact Probability"
gloss = "Summing the probabilities of every table no more probable than the observed one gives Fisher's two-sided probability, 0.00138 for the crewed shares."
cite = ["ref_fisher_1935"]
digest = "c91ff2a0cdceb481"

[[equation]]
tag = 26
class = "standard"
title = "Difference in Crewed Shares"
