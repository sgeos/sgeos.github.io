class = "standard"
title = "First Bending Mode of a Free-Free Beam"
gloss = "A uniform free-free beam has its first elastic mode at $(4.730/L)^{2}$ times the square root of the bending stiffness over the mass per unit length."
cite = []
digest = "1adc431bb9027126"

[[equation]]
tag = 94
class = "standard"
title = "Second Moment of Area of a Thin-Walled Tube"
gloss = "A thin-walled circular tube of radius $r$ and wall thickness $t$ has a second moment of area $\\pi r^{3} t$."
cite = []
digest = "cd4b079ee07018c4"

[[equation]]
tag = 95
class = "bespoke"
title = "Bespoke First Bending Frequency of the X-9"
gloss = "The free-free beam is evaluated for an assumed three millimetre aluminium wall and the launch mass spread uniformly along the length."
cite = []
digest = "ade714f483a24924"

[[equation]]
tag = 96
class = "bespoke"
title = "Bespoke Missile Flight Time"
gloss = "The flight time assumes that the whole 80 kilometres is flown at Mach 2."
cite = []
digest = "3795a8be11d4a048"

[[equation]]
tag = 97
class = "bespoke"
title = "Bespoke Launch Aircraft Travel"
gloss = "The launch aircraft is assumed to continue at Mach 0.8 for the missile's flight time."
cite = []
digest = "99a7956efe7ab80f"

[[equation]]
tag = 98
class = "standard"
title = "Level Turn Radius"
gloss = "The radius of a level banked turn is the square of speed over gravity times the square root of $n^{2} - 1$."
cite = []
digest = "8b78316c6b5ae35e"

[[equation]]
tag = 99
class = "bespoke"
title = "Bespoke Bomber Turn Radius"
gloss = "The turn radius is evaluated for a bomber assumed limited to 1.5 g at the assumed release speed."
cite = []
digest = "9ab65402e02bba79"

[[equation]]
tag = 100
class = "bespoke"
title = "Bespoke Time for a Reversal"
gloss = "A half circle at the assumed turn radius and speed takes 68 seconds."
cite = []
digest = "cc8f3a86ecabe5fb"

[[equation]]
tag = 101
class = "standard"
title = "Recovery Temperature"
gloss = "The recovery temperature at Mach 2 uses a turbulent recovery factor of 0.89 and the standard atmosphere temperature of 217 kelvin."
cite = []
digest = "9920dc4f7adaa050"

[[equation]]
tag = 102
class = "standard"
title = "Lumped Thin-Skin Heating"
gloss = "A thin skin of density $\\rho_m$, specific heat $c_p$ and thickness $t$ heats at a rate set by convection from the recovery temperature."
cite = ["book_incropera_heat_transfer"]
digest = "a2507519f102e300"

[[equation]]
tag = 103
class = "standard"
title = "Thermal Time Constant of a Thin Skin"
gloss = "The skin's thermal time constant is its heat capacity per unit area divided by the convective coefficient."
cite = ["book_incropera_heat_transfer"]
digest = "3962d9add156db29"

[[equation]]
tag = 104
class = "bespoke"
title = "Bespoke Skin Time Constant"
gloss = "The time constant is evaluated for an assumed two millimetre aluminium skin and a convective coefficient of 150 watts per square metre kelvin."
cite = []
digest = "4017d5135b82ee73"

[[equation]]
tag = 105
class = "bespoke"
title = "Bespoke Wing Root Bending Moment"
gloss = "The article estimates the root bending moment as the load at four g acting at a quarter of the span $b$."
cite = []
digest = "2610333b631eb270"

[[equation]]
tag = 106
class = "standard"
title = "Terminal Velocity Under a Canopy"
gloss = "A body descends at the speed where drag on area $A$ with coefficient $C_D$ balances its weight."
cite = ["book_knacke_1992"]
digest = "97decf9d5556cede"

[[equation]]
tag = 107
class = "bespoke"
title = "Bespoke Canopy Area"
gloss = "The canopy area is evaluated for an assumed 300 kilogramme package, an assumed descent rate of eight metres per second and a drag coefficient of 1.4."
cite = []
digest = "a9cf3778e575e28a"

[[equation]]
tag = 108
class = "standard"
title = "Likelihood of Four Failures Then a Success"
gloss = "For independent flights of success probability $p$, the likelihood of four failures followed by a success is maximised at $p = 0.2$."
cite = []
digest = "73d7023098406d73"

[[equation]]
tag = 109
class = "standard"
title = "Zero-Failure Demonstration Test"
gloss = "Demonstrating reliability $p$ at confidence $1 - \\alpha$ with no failures needs $\\ln \\alpha / \\ln p$ consecutive successes."
cite = []
digest = "2c2c40a7041e979c"

[[equation]]
tag = 110
class = "standard"
title = "Successes Needed for 90 Percent at 95 Percent"
gloss = "Demonstrating 90 percent reliability at 95 percent confidence needs 29 consecutive successes."
cite = []
digest = "471ca721e66363e5"

[[equation]]
tag = 111
class = "standard"
title = "Single-Shot Kill Probability"
gloss = "For a definite lethal radius $R_L$ and a circular normal miss, the kill probability is one minus one half raised to the squared ratio of lethal radius to circular error probable."
cite = []
digest = "6c399a12bd0b56ef"

[[equation]]
tag = 112
class = "standard"
title = "Circular Error Probable for a Kill Probability"
gloss = "Inverting the kill probability gives the circular error probable that a lethal radius and a required kill probability permit."
cite = []
digest = "3d215b90ac39dc64"

[[equation]]
tag = 113
class = "standard"
title = "Cube-Root Blast Scaling"
gloss = "The radius at which a given overpressure is reached scales as the cube root of yield $W$ from the one-kilotonne radius $R_1$."
cite = ["book_glasstone_dolan_1977"]
digest = "547e908c777292a4"

[[equation]]
tag = 114
class = "bespoke"
title = "Bespoke Lethal Radius at Twenty Kilotonnes"
gloss = "Cube-root scaling from the 690 metre one-kilotonne radius for five pounds per square inch is evaluated for a yield of twenty kilotonnes that the article takes as representative."
cite = ["book_glasstone_1962"]
digest = "90f7f7af87960349"

[[equation]]
tag = 115
class = "bespoke"
title = "Bespoke Accuracy Needed for 90 Percent Kill"
gloss = "The circular error probable is evaluated for an assumed lethal radius of 1,500 metres against a soft target and a 90 percent kill probability."
cite = []
digest = "d269aa0fb59a0676"

