# Equation classification for A306. Read by `python3 _lib/equations.py`.

caution = "Quantities are in International System units, with the specification of 500 feet and 100 miles converted to metres, speeds at altitude taken from a speed of sound of 295 metres per second, and several symbols reused, so that $R$ is a radius, a range or a turn radius by section, $m$ is a mass except in Equations 59 to 61, where it is a miss distance, and $\\tau$ is a delay in the guidance sections and a thermal time constant in Equations 103 and 104."

[[equation]]
tag = 1
class = "standard"
title = "Rayleigh Distribution of Radial Miss"
gloss = "With independent normal errors of equal standard deviation $\\sigma$ in range and deflection, the probability of landing within a radius $R$ follows the Rayleigh cumulative distribution."
cite = ["ref_rayleigh", "book_papoulis_2002"]
digest = "0601322bd68167d7"

[[equation]]
tag = 2
class = "standard"
title = "Axis Standard Deviation Required by the Specification"
gloss = "Inverting the Rayleigh distribution for the 1945 requirement of 500 feet at 75 percent gives an axis standard deviation of 91.5 metres."
cite = ["ref_rascal"]
digest = "49e58597734c5d8f"

[[equation]]
tag = 3
class = "standard"
title = "Circular Error Probable"
gloss = "The circular error probable, the radius containing half the impacts, is $\\sqrt{2 \\ln 2}$ times the axis standard deviation, which gives 108 metres for the specification."
cite = ["ref_cep"]
digest = "a828a44a072092ec"

[[equation]]
tag = 4
class = "standard"
title = "Relative Standard Error of a Sample Standard Deviation"
gloss = "For $n$ samples from a normal population the standard error of the sample standard deviation, relative to the estimate, is approximately one over the square root of twice the degrees of freedom."
cite = []
digest = "9b7e1e8a00606d3a"

[[equation]]
tag = 5
class = "standard"
title = "Maximum-Likelihood Axis Standard Deviation"
gloss = "Under the circular normal assumption the maximum-likelihood estimate of the axis standard deviation is the root of the summed squared radial misses divided by twice the number of impacts."
cite = []
digest = "31e23f8b76725adf"

[[equation]]
tag = 6
class = "standard"
title = "Root-Mean-Square Miss with a Bias"
gloss = "A systematic offset $b$ adds in quadrature to the random radial miss, whose mean square is twice the axis variance."
cite = []
digest = "5554524f4fbb80d5"

[[equation]]
tag = 7
class = "standard"
title = "Quadrature Sum of Independent Errors"
gloss = "The variances of independent error sources add, so the total variance is the sum of the contributors' variances."
cite = []
digest = "d48d285ce9729835"

[[equation]]
