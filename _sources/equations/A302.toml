gloss = "Temperature falls linearly with altitude, pressure follows the corresponding power law, and the speed of sound follows from the temperature."
cite = []
digest = "a649a94958635920"

[[equation]]
tag = 93
class = "standard"
title = "Thrust-Limited Maximum Mach Number"
gloss = "Equating thrust to drag with the dynamic pressure written in Mach number form and solving gives the square of the maximum Mach number."
cite = []
digest = "e617410b33fb8cf3"

[[equation]]
tag = 94
class = "standard"
title = "Specific Excess Power and Energy Height"
gloss = "Specific excess power is the speed times the excess of thrust over drag divided by the weight, and energy height adds the kinetic energy per unit weight to the altitude."
cite = []
digest = "9538dc9b9d287421"

[[equation]]
tag = 95
class = "standard"
title = "Drag Polar with Sweep-Dependent Terms"
gloss = "The parabolic drag polar is written with zero-lift drag, aspect ratio and span efficiency each a function of sweep."
cite = []
digest = "5494b698c9d6738e"

[[equation]]
tag = 96
class = "standard"
title = "Optimum Sweep Condition"
gloss = "The drag-minimising sweep at a given condition is where the derivative of drag with respect to sweep vanishes."
cite = []
digest = "eec7e94cb61e4229"

[[equation]]
tag = 97
class = "bespoke"
title = "Bespoke Expanded Optimum Sweep Condition"
gloss = "Differentiating the polar with the span efficiency held constant balances the fall of zero-lift drag against the rise of induced drag with sweep."
cite = []
digest = "e7191b3280d21db8"

[[equation]]
tag = 98
class = "bespoke"
title = "Bespoke Test Matrix of a Variable-Sweep Programme"
gloss = "The article multiplies the conditions a fixed-wing programme needs by the number of sweep settings."
cite = []
digest = "e94413f4bc41a340"

[[equation]]
tag = 99
class = "standard"
title = "Load Recovery from a Strain Gauge Calibration"
gloss = "Loads are recovered by applying the inverse of the calibration matrix to the measured strains."
cite = []
digest = "5dd7a64ffcbb37ae"

[[equation]]
tag = 100
class = "standard"
title = "Condition Number Bound on Recovered Load Error"
gloss = "The relative error in the recovered loads is bounded by the condition number of the calibration matrix times the relative strain error."
cite = []
digest = "b134337a00cf2610"

[[equation]]
tag = 101
class = "bespoke"
title = "Bespoke Lift-Curve Slope Sensitivity to Sweep"
gloss = "A finite difference of the bespoke slopes at 20 and 60 degrees gives a sensitivity of 3.31 per radian squared."
cite = []
digest = "3765148bccfcfeaf"

[[equation]]
tag = 102
class = "standard"
title = "Law of Propagation of Uncertainty"
gloss = "The combined variance of a derived quantity is the sum of the input variances weighted by the squared sensitivity coefficients."
cite = []
digest = "c4cd5d76a8ed80ce"

[[equation]]
tag = 103
class = "bespoke"
title = "Bespoke Pivot Placement Optimisation"
gloss = "The article poses pivot placement as minimising the travel subject to a floor on the movable panel area."
cite = []
digest = "90d91d297aa3c774"

[[equation]]
tag = 104
class = "bespoke"
title = "Bespoke Maximum Lift with Slats and Flaps"
gloss = "The article adds slat and flap increments to the cosine-scaled clean maximum lift coefficient."
cite = []
digest = "9aeb7ba01be4c71d"

[[equation]]
tag = 105
class = "standard"
title = "Field Length Scaling"
gloss = "Field length scales with wing loading over the product of density ratio, maximum lift coefficient and thrust-to-weight ratio."
cite = []
digest = "7852d606e0df659a"

[[equation]]
tag = 106
class = "bespoke"
title = "Bespoke Break-Even Condition After Halving the Gain"
gloss = "Halving the aerodynamic gain while the mass penalty is unchanged makes the break-even condition fail."
cite = []
digest = "f3d9cd7bc2873cb9"

[[equation]]
tag = 107
class = "standard"
title = "Rate of Change of Angular Momentum with a Varying Inertia"
gloss = "With an inertia tensor that depends on sweep, the rate of change of angular momentum gains a term in the sweep rate that vanishes when the wing is still."
cite = []
digest = "dd972ec0a1386e2b"

[[equation]]
tag = 108
class = "standard"
title = "Actuator Power and Energy"
gloss = "Actuator power is hinge moment times sweep rate, and the energy is the integral of the hinge moment over the sweep travel."
cite = []
digest = "8dc975070a2d1c34"

[[equation]]
tag = 109
class = "bespoke"
title = "Bespoke Sweep Control Derivative"
gloss = "The article treats sweep as a pitch effector and differentiates the trim moment of the panel aerodynamic centre model with respect to sweep."
cite = []
digest = "d2b60c133c3f3646"

[[equation]]
tag = 110
class = "bespoke"
title = "Bespoke Sweep Control Derivative at 40 Degrees"
gloss = "At a lift coefficient of 0.3 the sweep control derivative is about minus 0.26 per radian."
cite = []
digest = "dcc828536cedc827"

[[equation]]
tag = 111
class = "bespoke"
title = "Bespoke Sweep Equivalent of a Five Degree Elevator Deflection"
gloss = "Against an assumed elevator control power of 0.7 per radian, matching a five degree deflection needs 0.24 radians of sweep."
cite = []
digest = "39192bb2e8c13f4f"

[[equation]]
tag = 112
class = "bespoke"
title = "Bespoke Sweep Rate for Control Within One Short Period Time Constant"
gloss = "Delivering 13.7 degrees of sweep within an assumed 0.33 second time constant needs about 42 degrees per second."
cite = []
digest = "a3f4b2d111c50fdd"

