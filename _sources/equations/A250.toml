[[symbol]]
tex = 'G_t'
meaning = "the discounted return from step $t$"

[[symbol]]
tex = 'd^{\pi}(s)'
meaning = "the marginal state distribution induced by policy $\\pi$"

[[symbol]]
tex = 'V^{\pi}(s)'
meaning = "the state value function under policy $\\pi$"

[[symbol]]
tex = 'Q^{\pi}(s, a)'
meaning = "the action value function under policy $\\pi$"

[[symbol]]
tex = 'A^{\pi}(s, a)'
meaning = "the advantage function under policy $\\pi$"

[[symbol]]
tex = 'T^{\pi}'
meaning = "the Bellman expectation operator for policy $\\pi$"

[[symbol]]
tex = '\delta_t'
meaning = "the temporal-difference error at step $t$"

[[symbol]]
tex = '\alpha'
meaning = "the step size in an update rule, the conditioned stimulus salience in the Rescorla-Wagner model and the tail level in the conditional value at risk"

[[symbol]]
tex = '\rho_t'
meaning = "the per-step importance sampling ratio"

[[symbol]]
tex = 'V_j'
meaning = "the associative strength of conditioned stimulus $j$"

[[symbol]]
tex = '\lambda'
meaning = "the maximum associative strength the reinforcer supports"

[[symbol]]
tex = 'q_\alpha(G)'
meaning = "the lower $\\alpha$-quantile of the return distribution"

[[symbol]]
tex = 'R_T'
meaning = "the cumulative regret over horizon $T$"

[[symbol]]
tex = 'N_t(a)'
meaning = "the number of prior pulls of arm $a$"

[[symbol]]
tex = '\mathfrak{E}(s)'
meaning = "the empowerment of state $s$"

[[symbol]]
tex = 'q(s)'
meaning = "the approximate posterior, or recognition distribution, over hidden states"

[[symbol]]
tex = 'p(o, s)'
meaning = "the generative model of observations and hidden states"

[[symbol]]
tex = '\phi'
meaning = "the learned state representation in which curiosity is measured"
