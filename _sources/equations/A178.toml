[[symbol]]
tex = 'P_z'
meaning = "the two-by-three orthogonal projection that drops depth"

[[symbol]]
tex = 'w_y^{\text{ground}}'
meaning = "the vertical world coordinate of the ground plane"

[[symbol]]
tex = 'h'
meaning = "the height of an airborne character above the ground"

[[symbol]]
tex = 'w_z^{\text{known}}'
meaning = "the known depth of an object being picked"

[[symbol]]
