meaning = "the depth-mixing slope, the screen $y$ shift per unit of depth offset from the camera"

[[symbol]]
tex = 'W'
meaning = "the screen width in pixels"

[[symbol]]
tex = 'H'
meaning = "the screen height in pixels"

[[symbol]]
tex = 'K_z(-\beta)'
