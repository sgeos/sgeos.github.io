[[equation]]
tag = 25
class = "standard"
title = "Coupled Bending-Torsion Constitutive Law"
gloss = "The bending moment and torque are related to curvature and rate of twist by a symmetric stiffness matrix whose off-diagonal term is the bend-twist coupling."
cite = []
digest = "c7d3fb1fa88541fa"

[[equation]]
tag = 26
class = "bespoke"
title = "Bespoke Two-Mode Divergence Eigenproblem"
gloss = "Assuming a quadratic bending mode and a linear twist mode with strip theory, the article writes divergence as the vanishing determinant of a structural minus aerodynamic matrix."
