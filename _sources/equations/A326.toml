digest = "b1e761ec6d975894"

[[equation]]
tag = 27
class = "bespoke"
title = "Bespoke Structural and Aerodynamic Matrices of the Two-Mode Model"
gloss = "The matrix entries follow from the assumed quadratic bending and linear twist modes with strip-theory lift acting a distance $e$ ahead of the elastic axis."
cite = []
digest = "001c3555d6ed6a48"

[[equation]]
tag = 28
class = "standard"
title = "Strain Energy of a Coupled Composite Beam"
gloss = "The strain energy of the beam is half the integral of the bending, torsion and coupling energy densities along the span."
cite = []
digest = "59686c42ac4a7cbd"

[[equation]]
tag = 29
class = "bespoke"
