digest = "93dc4422c28fe523"

[[equation]]
tag = 24
class = "standard"
title = "Streamwise Angle-of-Attack Change of a Swept Elastic Wing"
gloss = "Resolving the elastic twist and the bending slope onto the streamwise direction shows that bending adds washin on a forward-swept wing and washout on an aft-swept one."
