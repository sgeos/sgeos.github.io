# Equation classification for A326. Read by `python3 _lib/equations.py`.

caution = "Weights are in pounds, dynamic pressures in pounds per square foot and stiffnesses in foot-pounds, while times are in seconds and sample rates in hertz, and several letters change meaning between sections, so $e$ is a moment arm in the divergence relations and the span efficiency in the drag relations, $\\lambda$ is the unstable pitch root in the doubling-time relations and the taper ratio in the planform relations, and $\\eta$ is the fractional span station, the section efficiency in the lift-curve slope and, as $\\eta_{cp}$, the centre of pressure station."

[[equation]]
tag = 1
class = "standard"
title = "Wing Loading at the Maximum Gross Weight"
gloss = "The wing loading is the maximum takeoff gross weight divided by the reference area, evaluated from the published figures."
cite = ["book_raymer"]
digest = "aa92c780fce44a06"

[[equation]]
tag = 2
class = "bespoke"
title = "Bespoke Thrust-to-Weight Ratio at the Maximum Gross Weight"
gloss = "The thrust-to-weight ratio takes the engine class rating of 16,000 pounds as the thrust, a substitute the article chooses because the record gives no installed thrust."
cite = []
digest = "4ae1db1fd0e31b43"

[[equation]]
tag = 3
class = "bespoke"
title = "Bespoke Thrust-to-Weight Ratio at the Manoeuvre Design Weight"
gloss = "The same class rating divided by the manoeuvre design gross weight gives a ratio above one, again taking the uninstalled rating as the thrust."
cite = []
digest = "f05d1724f409d82d"

[[equation]]
tag = 4
class = "standard"
title = "Canard Area From the Quoted Percentage"
gloss = "The canard area is the quoted twenty percent of the wing reference area, which matches the figure in the later lift and drag report."
cite = ["research_saltzmanedwinj_hicksjohnw_1994"]
digest = "b17adee58286990c"

[[equation]]
tag = 5
class = "standard"
title = "Canard Mean Chord From the Quoted Percentage"
gloss = "The canard mean aerodynamic chord is the quoted seventy-six percent of the wing mean aerodynamic chord."
cite = []
digest = "ae16d45df88e51f1"

[[equation]]
tag = 6
class = "standard"
title = "Wing Load at the Subsonic Design Limit"
gloss = "The limit load is the subsonic design load factor of eight multiplied by the manoeuvre design gross weight."
cite = ["research_simsrobert_mccrossonpaul_1989"]
digest = "c020794ce0c1a16f"

[[equation]]
tag = 7
class = "standard"
title = "Fuel Fraction at the Maximum Gross Weight"
gloss = "The fuel fraction is the published fuel load divided by the maximum takeoff gross weight."
cite = []
digest = "39391d9ce2c9b646"

[[equation]]
tag = 8
class = "standard"
title = "Excess of the Heaviest Weight Flown Over the Design Weight"
gloss = "The heaviest gross weight flown exceeds the manoeuvre design gross weight by eighteen percent, as the record states."
cite = ["research_simsrobert_mccrossonpaul_1989"]
digest = "1f9e85a9e4533ae1"

[[equation]]
tag = 9
class = "standard"
title = "Span From Aspect Ratio and Reference Area"
gloss = "The span is the square root of aspect ratio times reference area, which reproduces the published reference span to better than one hundredth of a percent."
cite = ["research_hicksjohnw_huckabinethomas_1989", "research_simsrobert_mccrossonpaul_1989"]
digest = "c5eecf998ed95f30"

[[equation]]
tag = 10
class = "standard"
title = "Elastic Amplification of the Lift-Curve Slope"
gloss = "For a single torsional degree of freedom the ratio of elastic to rigid lift-curve slope is one over one minus the ratio of dynamic pressure to divergence dynamic pressure."
cite = []
digest = "da3ee3699fe5b195"

[[equation]]
tag = 11
class = "standard"
title = "Torsional Moment Equilibrium of an Elastic Wing Section"
gloss = "The elastic restoring moment of the twisted section balances the aerodynamic moment of its lift acting a distance $e$ ahead of the elastic axis."
cite = []
digest = "4a20db5632f2a3f9"

[[equation]]
tag = 12
class = "standard"
title = "Elastic Twist Under Aerodynamic Load"
gloss = "Solving the equilibrium for the twist exposes a denominator that vanishes when the aerodynamic moment slope equals the torsional stiffness."
cite = []
digest = "86778225ec66f824"

[[equation]]
tag = 13
class = "standard"
title = "Divergence Dynamic Pressure of a Torsional Section"
gloss = "The divergence dynamic pressure is the torsional stiffness divided by the product of area, moment arm and lift-curve slope."
cite = []
digest = "efb032bce0816f9d"

[[equation]]
tag = 14
class = "standard"
title = "Total Angle of Attack as an Amplified Rigid Value"
gloss = "Substituting the divergence dynamic pressure shows that the total angle of attack, and with it the lift, is the rigid value times the amplification factor."
cite = []
digest = "bfba81527472b6c5"

[[equation]]
tag = 15
class = "standard"
title = "Design Dynamic Pressure From Mach Number at Sea Level"
gloss = "The design point quoted as Mach 1.07 at sea level gives a dynamic pressure that agrees with the quoted 1,700 pounds per square foot to a quarter of a percent."
cite = ["research_simsrobert_mccrossonpaul_1989"]
digest = "2a22b4381a93d940"

[[equation]]
tag = 16
class = "standard"
title = "Divergence Boundary From the Amplification Ratio"
