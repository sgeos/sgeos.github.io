# Equation classification for A308. Read by `python3 _lib/equations.py`.

caution = "Quantities are in International System units on a spherical Earth of radius 6,371 kilometres with $g = 9.80665$ metres per second squared, pounds per square inch are converted at 6,894.76 pascals each, the masses are Atlas D figures and the skin gauges and tank pressures those of a later Atlas, all applied to the Atlas A, and symbols are reused, so that $t$ is the skin thickness except in Equations 52, 53 and 57, where it is time, $p$ is a pressure except in Equations 95 to 98, where it is a probability of success, $n$ is a load factor except in Equations 97 and 98, where it is a number of flights, $R$ is the range except in Equation 29, where it is the gas constant of nitrogen, $T$ is the thrust except in Equation 29, where it is the gas temperature, $V$ is a volume except in Equations 42 and 43, where it is the wind speed, $I$ is a second moment of area except in Equations 73 and 75, where it is the acoustic intensity, $c$ is a speed of sound except in Equation 70, where it is a specific heat, $h$ is a height or an altitude except in Equations 70 and 88, where it is a convective coefficient, and $v_{e}$ is the exhaust velocity except in Equation 85, where it is the entry speed."

