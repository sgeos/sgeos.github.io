[[equation]]
tag = 10
class = "standard"
title = "Budget Shortfall, Growth and Total"
gloss = "Fiscal year 2024 was executed 9.639 million dollars below its request, fiscal year 2025 rose 27.5 percent from request to actual, fiscal year 2026 fell 13.9 percent from its request to the latest book, and the latest figures for fiscal years 2024 to 2027 sum to 169.661 million dollars."
cite = ["ref_darpa_pb2024", "ref_darpa_pb2025", "ref_darpa_pb2026", "ref_darpa_pb2027"]
