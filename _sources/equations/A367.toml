# Equation classification for A367. Read by `python3 _lib/equations.py`.

caution = "The relations are evaluated in the International System while weights are quoted in pounds, disk loadings in pounds per square foot and speeds in knots as the solicitation states them, and the hover results rest on an assumed figure of merit of 0.75, drive efficiency of 0.90 and download of 10 percent, while the cruise results rest on a thrust lapse factor swept from 0.5 to 0.7."

[[equation]]
tag = 1
class = "standard"
title = "Ideal Induced Power in Hover"
gloss = "Momentum theory gives the induced power of an ideal rotor system as the weight to the three-halves power over the square root of twice the density times the disk area."
cite = []
digest = "a7ad12962d6a204c"

[[equation]]
tag = 2
class = "standard"
title = "Effect of Doubling the Disk Area on Ideal Power"
gloss = "At fixed weight and density, doubling the disk area multiplies the ideal induced power by the reciprocal of the square root of two, a saving of 29 percent."
cite = []
digest = "bf2c97ac8d6dcb3b"

[[equation]]
tag = 3
class = "standard"
title = "Publication and Announcement Lags of the Register Row"
gloss = "The archived copies of the register place the row's first public appearance 31 to 48 days after the article's date and 87 to 104 days after the allocation, and the announcement came 84 days after the article's date."
cite = ["ref_mds_addendum_wb_2025_12", "ref_mds_addendum"]
digest = "6fcccb3e1e5cde9d"

[[equation]]
tag = 4
class = "standard"
title = "Phase 1 Funding of the Solicitation"
