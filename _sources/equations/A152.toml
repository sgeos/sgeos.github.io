# Equation classification for A152. Read by `python3 _lib/equations.py`.

caution = "The closure ratio and the density ratio are dimensionless, the light-time delay takes distance in metres and the speed of light in metres per second, and the synodic period takes both sidereal periods in days."

[[equation]]
tag = 1
class = "bespoke"
title = "Bespoke Closure Ratio"
gloss = "The article defines closure as one less the mass crossing the analogue envelope from outside as a fraction of the total mass demand, so that a fully closed analogue scores one and a fully supplied analogue scores zero."
cite = []
digest = "3df259e14a20c697"

[[equation]]
tag = 2
class = "standard"
title = "Density Ratio of Breathable Air in a Carbon Dioxide Atmosphere"
gloss = "At equal temperature and pressure the density of an ideal gas scales with its mean molecular mass, so air at about twenty-nine grams per mole has about two thirds the density of carbon dioxide at about forty-four."
cite = []
digest = "8d0a62f3f5a61c7d"

[[equation]]
tag = 3
class = "standard"
title = "One-Way Light-Time Delay"
gloss = "The one-way delay of a signal between two points is their separation divided by the speed of light."
cite = []
digest = "4fd2c4603b83f3c9"

[[equation]]
tag = 4
class = "standard"
title = "Synodic Period of Mars"
gloss = "The synodic period follows from the difference of the reciprocal sidereal periods of the Earth and Mars and sets the interval between resupply windows at about seven hundred and eighty days."
cite = []
digest = "8f5da971232e6520"

