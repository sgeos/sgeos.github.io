# Equation classification for A317. Read by `python3 _lib/equations.py`.

caution = "The article works in feet, pounds, seconds, British thermal units and degrees Fahrenheit, with nautical miles for range and crossrange, and $\\alpha$ is the angle of attack in the aerodynamic relations but the coefficient of thermal expansion in the structural ones, while $\\gamma$ is the flight path angle and $H$ the scale height, distinct from the effective heat of ablation $H_{\\text{eff}}$."

[[equation]]
tag = 1
class = "standard"
title = "Share of the Budget Spent at Cancellation"
gloss = "The 410 million dollars spent and the 373 million still scheduled sum to the programme total, of which 52.4 percent had been spent."
cite = ["ref_heppenheimer_2007"]
digest = "b4caafc5217279fb"

[[equation]]
tag = 2
class = "standard"
title = "Aspect Ratio From Published Dimensions"
gloss = "The aspect ratio is the square of the published span over the published area."
cite = ["ref_x20"]
digest = "fcefbe007294b9da"

[[equation]]
tag = 3
class = "standard"
title = "Wing Loading at Maximum Weight"
gloss = "The published maximum weight over the published area gives a wing loading of 33.0 pounds per square foot."
cite = ["ref_x20"]
digest = "37f38984db94b1cc"

[[equation]]
tag = 4
class = "standard"
title = "Wing Loading at the Programme Re-Entry Weight"
gloss = "The programme office's re-entry weight of 12,000 pounds over the same area gives 34.8 pounds per square foot."
cite = ["research_hargis_1964"]
digest = "86970a49b20dd429"

[[equation]]
tag = 5
class = "standard"
title = "Sensitivity of Heating and Temperature to the Heavier Weight"
gloss = "Peak heating varies as the square root of wing loading and equilibrium temperature as its eighth root, so the heavier documented weight raises them by 2.7 and 0.7 percent."
cite = []
digest = "ca250c70ce6ab381"

[[equation]]
tag = 6
class = "standard"
title = "Circular Orbital Speed at the Surface"
gloss = "Circular orbital speed at the surface is the square root of gravity times the Earth's radius."
cite = []
digest = "03e8a243436065d0"

[[equation]]
tag = 7
class = "standard"
title = "Specific Kinetic Energy at Circular Speed"
gloss = "The kinetic energy per unit weight at circular speed is the square of that speed over twice gravity."
cite = []
digest = "27576baacfba6c33"

[[equation]]
tag = 8
class = "standard"
title = "Total Energy to Dispose of on Re-Entry"
gloss = "Multiplying the specific kinetic energy by the maximum weight and converting at 778.169 foot-pounds per British thermal unit gives the energy the thermal protection must reject."
cite = []
digest = "f2504d4a123d689c"

[[equation]]
tag = 9
class = "standard"
title = "Lift Required With Centrifugal Relief"
gloss = "At orbital speeds the lift needed is the weight reduced by the ratio of the square of speed to the square of circular speed."
cite = []
digest = "c553796f632c3ae3"

[[equation]]
tag = 10
class = "standard"
title = "Equilibrium Glide Lift Balance"
gloss = "The equilibrium glide sets the aerodynamic lift equal to the centrifugally relieved weight."
cite = []
digest = "60c1128de968d960"

[[equation]]
tag = 11
class = "standard"
title = "Density Required on the Equilibrium Glide"
gloss = "Solving the glide balance for density shows that wing loading and lift coefficient set the altitude at each speed and lift to drag ratio does not."
