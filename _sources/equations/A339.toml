# Equation classification for A339. Read by `python3 _lib/equations.py`.

caution = "The engine and propellant relations are evaluated in pounds, inches, pounds per square inch and seconds while the tank mass, thermochemistry and pressurant relations are evaluated in the International System, and several letters are reused, so $m_{f}$ is the fuel mass in the propellant split and the burnout mass in the rocket equation, $R$ is a cylinder radius in the membrane loads and the gas constant of nitrogen in the cold gas relation, $\\varepsilon$ is the nozzle area ratio except in the final strain ratios, and $\\gamma$ is the ratio of specific heats of the decomposition products in the chamber and nozzle relations and of nitrogen in the cold gas relation."

[[equation]]
tag = 1
class = "standard"
title = "Hoop Stress Wall Thickness of a Thin Cylinder"
gloss = "A thin cylindrical wall under internal pressure carries the hoop stress, so the thickness required is the pressure times the radius over the allowable stress."
cite = ["research_huzel_1967", "book_sutton_biblarz"]
digest = "0e427db78a569d24"

[[equation]]
tag = 2
class = "standard"
title = "Wall Mass of a Thin Cylindrical Tank"
gloss = "The wall mass is the wall volume times the material density, and substituting the hoop thickness leaves the pressure over the specific strength times the enclosed volume."
cite = []
digest = "0f6dc572984b015f"

[[equation]]
tag = 3
class = "standard"
title = "Cylindrical Tank Mass in Pressure and Volume"
gloss = "Writing the enclosed volume for $\\pi r^{2} L$ shows that the wall mass of a cylinder is twice the product of pressure and volume over the specific strength."
cite = []
digest = "d245ee2ee3c0f9ba"

[[equation]]
tag = 4
class = "standard"
title = "Spherical Tank Mass in Pressure and Volume"
gloss = "The same exercise for a sphere, with half the wall thickness, gives a constant of three halves in place of two."
cite = []
digest = "885a3546be8a50ef"

[[equation]]
tag = 5
class = "standard"
title = "General Pressure Vessel Mass Relation"
gloss = "The mass of a thin pressure vessel is a shape constant between three halves and two times the product of pressure and volume over the specific strength, so the radius cancels and size brings no economy."
cite = []
digest = "1bd0a3a9cf79a612"

[[equation]]
