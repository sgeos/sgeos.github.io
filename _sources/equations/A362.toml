caution = "The aerodynamic and engine relations are evaluated in the International System, with thirty thousand feet taken as a geopotential altitude of 9,144 metres and the aircraft weight quoted in pounds, the wing area of 16 square metres is a reference value the article takes because none is published, and a few letters need care, so $\\delta$ is a compressor-face pressure ratio while $\\delta F$ is a thrust decrement, $\\mu$ is the dynamic viscosity while the subscript in $C_\\mu$ marks the momentum coefficient, $B$ is the bypass ratio while the bold $\\mathbf{B}$ is the control effectiveness matrix, and $\\mathcal{A}$ is the amplification while $A^{*}$ and $A$ are areas."

