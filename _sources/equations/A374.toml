cite = ["research_cancian_2023_first_battle"]
digest = "330864da14045fe5"

[[equation]]
tag = 20
class = "standard"
title = "Reconciliation of Iterations by Outcome"
gloss = "Decisive defeats, stalemates and the single victory sum to the 24 runs, and the three kinds of stalemate sum to fourteen."
cite = ["research_cancian_2023_first_battle"]
digest = "39c88302f62f64e1"

[[equation]]
tag = 21
class = "standard"
title = "Relative Frequency of an Outcome"
