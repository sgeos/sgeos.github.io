[[equation]]
tag = 25
class = "standard"
title = "Composition of Chinese Ship Losses and Implied Amphibious Fleet"
gloss = "Amphibious and other ships lost sum to the total, and dividing the amphibious losses by the stated share of ninety percent recovers the size of the fleet."
cite = ["research_cancian_2023_first_battle"]
digest = "a0b6a7227d386cb7"

[[equation]]
tag = 26
class = "standard"
title = "Amphibious Share of Chinese Ship Losses"
