digest = "1ecfff4cf98dda55"

[[equation]]
tag = 23
class = "standard"
title = "Share of Decisive Defeats in the Pessimistic Family"
gloss = "Four decisive defeats among eighteen pessimistic iterations give a share a little over one fifth."
cite = ["research_cancian_2023_first_battle"]
digest = "cc83b426ac702fd8"

[[equation]]
tag = 24
class = "standard"
