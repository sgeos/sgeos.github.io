# Equation classification for A374, The Published Wargames of a War with China.
# Read by `python3 _lib/equations.py`.

caution = "Populations, births, deaths and marriage registrations are in millions and crude rates are per thousand people, while losses, casualties and missile counts are the totals or averages of the game or study in which they appear. Economic losses are proportions of a year of gross domestic product, so a ratio of two losses compares shares of output rather than sums of money."

[[equation]]
tag = 1
class = "standard"
title = "Demographic Balancing Equation"
gloss = "The population at the end of a year equals the population at its start plus births, less deaths, plus net migration."
cite = ["data_nbs_2024_communique", "data_nbs_2025_communique"]
digest = "df572cdf65a29fbb"

[[equation]]
tag = 2
class = "standard"
title = "Population Balance for China in 2025"
gloss = "Substituting the published year-end populations, births and deaths into the balancing equation leaves a net migration term of zero to the precision published."
cite = ["data_nbs_2024_communique", "data_nbs_2025_communique"]
digest = "4f40e0401e2f2c92"

[[equation]]
tag = 3
class = "standard"
title = "Natural Decrease for China in 2024"
gloss = "Births less deaths in 2024 reproduce the whole of the reported decrease of 1.39 million."
cite = ["data_nbs_2024_communique"]
digest = "d7655467cc4d9b50"

[[equation]]
tag = 4
class = "standard"
title = "Ratio of Successive Annual Decreases"
gloss = "The decrease in 2025 divided by the decrease in 2024 shows that the decline steepened by a factor of about two and a half."
cite = ["data_nbs_2024_communique", "data_nbs_2025_communique"]
digest = "29e3054db2e37dd9"

[[equation]]
tag = 5
class = "standard"
title = "Mean Population and Crude Birth and Death Rates"
gloss = "A crude rate is the count of events in a year per thousand of the mean population, which is approximated here by the average of the two year-end figures."
cite = ["data_nbs_2025_communique"]
digest = "61e8af5539a6056f"

[[equation]]
tag = 6
class = "standard"
title = "Crude Birth and Death Rates for China in 2025"
gloss = "Dividing the published births and deaths by the mean population reproduces the published rates of 5.63 and 8.04 per thousand."
cite = ["data_nbs_2025_communique"]
digest = "5cd93d42ad7f1ee3"

[[equation]]
tag = 7
class = "standard"
title = "Rate of Natural Increase"
gloss = "The natural growth rate is the crude birth rate less the crude death rate, which is negative for China in 2025."
cite = ["data_nbs_2025_communique"]
digest = "6f7daf642fd00de4"

[[equation]]
tag = 8
class = "standard"
title = "Annual Decline as a Share of Population"
gloss = "The decrease in 2025 divided by the population at the end of 2024 is about a quarter of one percent."
cite = ["data_nbs_2024_communique", "data_nbs_2025_communique"]
digest = "686aca1f296b12ab"

[[equation]]
tag = 9
class = "standard"
title = "Proportional Fall in Marriage Registrations"
gloss = "The change in registrations between 2023 and 2024 divided by the 2023 figure gives a fall of about a fifth."
cite = ["news_reuters_marriages_2024"]
digest = "5586d294be69838a"

[[equation]]
tag = 10
class = "standard"
title = "Crude Marriage Rate"
gloss = "Registrations per thousand of the year-end population reproduce the published marriage rate of 4.3 per thousand."
cite = ["data_scio_2025_marriage_registrations"]
digest = "8fba3524bf3a2f2e"

[[equation]]
tag = 11
class = "standard"
title = "Ratio of Divorces to Marriages"
gloss = "Divorces concluded divided by marriages registered in the same year gives a ratio of a little over one half."
cite = ["data_scio_2025_marriage_registrations"]
digest = "504d8094a36f3b08"

[[equation]]
tag = 12
class = "standard"
title = "Decline of the Marrying-Age Cohort"
gloss = "The fall in the population aged 20 to 39 between 2013 and 2023 is about a seventh of its earlier size."
cite = ["data_scio_2025_marriage_registrations"]
digest = "1184c5460c106f83"

[[equation]]
tag = 13
class = "standard"
title = "Old Age Dependency Ratio"
gloss = "The old age dependency ratio is the number of people aged 65 and older divided by the number aged 15 to 64."
cite = ["research_pollard_2025_fertility_decline"]
digest = "0360c294221c4b41"

[[equation]]
tag = 14
class = "standard"
title = "Growth of the Projected Dependency Ratio"
gloss = "The projected ratio for 2050 divided by the ratio for 2024 shows the dependency ratio more than doubling."
cite = ["research_pollard_2025_fertility_decline"]
digest = "f4d07673d1f63659"

[[equation]]
tag = 15
class = "standard"
title = "Compound Annual Growth Rate of the Dependency Ratio"
gloss = "The twenty-sixth root of the growth factor less one gives the constant yearly rate that produces the same change over the period."
cite = ["research_pollard_2025_fertility_decline"]
digest = "7c6fbd5f0b8752d6"

[[equation]]
tag = 16
class = "standard"
title = "Potential Support Ratio"
gloss = "The reciprocal of the old age dependency ratio counts working-age adults for each person aged 65 and older."
cite = ["research_pollard_2025_fertility_decline"]
digest = "b55c6cd44e3a3034"

[[equation]]
tag = 17
class = "standard"
title = "Implied Working-Age Population in 2020"
gloss = "Adding the stated loss of 200 million to the projected working-age population of 2050 recovers the base from which the loss is counted."
cite = ["commentary_brands_beckley_2021_declining_power", "research_pollard_2025_fertility_decline"]
digest = "c5fc945194b0869a"

[[equation]]
tag = 18
class = "standard"
title = "End of the Six-Year Window in Testimony"
gloss = "Six years counted from the year of the 2021 testimony give the year 2027 to which the published scenarios return."
cite = ["government_sasc_2021_indopacom"]
digest = "dec092ab4c3a452a"

[[equation]]
tag = 19
class = "standard"
title = "Reconciliation of Iterations by Scenario Family"
