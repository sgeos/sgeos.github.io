tex = 'M_{\text{avail}}'
meaning = "the pitch moment available, with $h^{*}$ the inlet height at which it equals the momentum drag moment"

[[symbol]]
tex = '\Delta T_0'
meaning = "the total temperature rise across the fan, with $\\Delta T$ an inlet temperature rise"

[[symbol]]
tex = 'T_{\text{amb}}'
meaning = "the ambient temperature"

[[symbol]]
tex = '\delta'
meaning = "the deflection of the duct axis"

[[symbol]]
tex = '\beta'
meaning = "the cant angle of a joint"

[[symbol]]
tex = '\phi'
meaning = "the relative roll angle of the two sides of a joint"

[[symbol]]
tex = '\dot{p}'
meaning = "the roll angular acceleration"

[[symbol]]
tex = 'W_{\text{TO}}'
meaning = "the takeoff weight, with $W_{\\text{land}}$ the landing weight and $W_{\\text{empty}}$ the empty weight"

[[symbol]]
tex = 'W_{\text{fuel}}'
meaning = "the fuel weight"

[[symbol]]
tex = '\theta'
meaning = "the deflection of the rear nozzle below the horizontal"

[[symbol]]
tex = '\mu'
meaning = "the rolling friction coefficient"

[[symbol]]
tex = 'C_{D_0}'
meaning = "the zero-lift drag coefficient, with $C_{D_w}$ the wave-drag increment and $C_{D_i}$ the induced drag coefficient"

[[symbol]]
tex = '\mathrm{AR}'
meaning = "the wing aspect ratio"

[[symbol]]
tex = '\sigma'
meaning = "the density ratio against sea level"

[[symbol]]
tex = 'T_{\text{SL}}'
meaning = "a sea-level value, the sea-level temperature in the atmosphere relation and the sea-level thrust in the thrust lapse"
