digest = "5c7874b9057095c3"

[[equation]]
tag = 3
class = "standard"
title = "Thrust per Unit Power"
gloss = "Dividing the thrust by the kinetic power shows that the thrust obtained from each unit of power is inversely proportional to the jet velocity."
cite = []
digest = "719291df50111391"

[[equation]]
