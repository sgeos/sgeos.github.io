# Equation classification for A332. Read by `python3 _lib/equations.py`.

caution = "Thrusts and weights are quoted in pounds force and pounds while the relations are evaluated in newtons, kilograms and metres per second, and several letters are reused, so $T$ is a thrust except where a subscript or the standard atmosphere relation makes it a temperature, the thrust is written $F$ in the inlet temperature relations, $L$ is the separation of the fan and the rear nozzle and then the temperature lapse rate, $\\ell$ is a roll-post arm and then a bay length, $V$ is the true airspeed except in the fan bay relation, where it is a volume, $A$ is the disc area except in the ground roll, where it is the constant part of the acceleration, $c_p$ is the specific heat of air except in the clutch heating relation, and $r$ in the core flow inversion is the thrust multiplication ratio."

[[equation]]
tag = 1
class = "standard"
title = "Thrust and Kinetic Power of a Jet"
gloss = "A jet accelerating a mass flow from rest produces a thrust equal to the mass flow times the jet velocity and carries away half the mass flow times the velocity squared as kinetic power."
cite = []
digest = "293e152ceb3f9905"

[[equation]]
tag = 2
class = "standard"
title = "Thrust at Fixed Power"
gloss = "Eliminating the jet velocity shows that at a fixed power the thrust rises as the square root of the mass flow."
