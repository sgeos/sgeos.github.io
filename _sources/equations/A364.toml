[[symbol]]
tex = '\kappa'
meaning = "the fleet-average unit cost factor against bespoke designs, with $\\kappa_{\\mathrm{eff}}$ the factor after the sharing penalty"

[[symbol]]
tex = '\eta'
meaning = "the sharing penalty coefficient on delivered capability, with $\\eta_{\\ast}$ the value above which an interior optimum exists"

[[symbol]]
tex = '\Theta'
meaning = "the discriminant of the first-order condition for the optimum"

[[symbol]]
tex = '\phi^{\ast}'
meaning = "the shared fraction minimising effective cost"

[[symbol]]
tex = '\mathcal{C}_g'
meaning = "the non-recurring cost of developing the genus"

[[symbol]]
tex = 'c_s'
meaning = "the non-recurring cost of one species on the genus"

[[symbol]]
tex = 'c_b'
meaning = "the non-recurring cost of one wholly bespoke aircraft type"

[[symbol]]
tex = 'S^{\ast}'
meaning = "the species at which the genus repays its own development cost"

[[symbol]]
tex = 'g'
meaning = "the exponential growth rate of available capability, per year"

[[symbol]]
tex = 'T'
meaning = "the interval a design is held frozen between refreshes, in years"

[[symbol]]
tex = 'F_0'
meaning = "the capability available when a design is frozen"

[[symbol]]
tex = 'T_2'
meaning = "the doubling time of available capability"

[[symbol]]
tex = '\bar{\varrho}'
meaning = "the time-average ratio of delivered to available capability"

[[symbol]]
tex = '\sigma'
meaning = "the time-average capability shortfall, one less the ratio above"

[[symbol]]
tex = '\bar{m}'
meaning = "the mean clusters whose phrases an admitted title carries"

[[symbol]]
tex = '\mathcal{K}_c'
meaning = "the records whose titles carry one cluster's characteristic phrases"

[[symbol]]
tex = '\mathcal{B}'
meaning = "the article's reference definitions, partitioned by provenance"

[[symbol]]
tex = 'K'
meaning = "the research records the survey admits"

[[symbol]]
tex = '\varpi'
meaning = "report primaries as a share of the admitted records"
