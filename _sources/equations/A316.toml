# Equation classification for A316. Read by `python3 _lib/equations.py`.

caution = "Lengths are in feet, forces in pounds and powers in horsepower at sea-level density unless a line states 15,000 or 20,000 feet, and several symbols are reused, so $S_f$ is the effective propeller fin area in the keystone derivation but the forward wing area in the lift and trim relations, $f$ is both the equivalent flat-plate area and a differential fraction of thrust, and $\\bar{c}$ is a wing mean chord in the geometry check but the blade mean chord in the blade relations."

