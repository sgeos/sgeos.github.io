# Equation classification for A299. Read by `python3 _lib/equations.py`.

caution = "Each equation uses the units of the International System stated in its section, with the final flight at Mach 3.196 and 19,992 metres as the reference condition, inertias converted from slug square feet to kilogram square metres, and several letters changing meaning between sections, so $b$, $e$, $k$, $p$, $\\beta$, $\\lambda$ and $\\mu_m$ are read from the nearest prose."

[[equation]]
tag = 1
class = "standard"
title = "Adiabatic Stagnation Temperature"
gloss = "Decelerating the free stream adiabatically to rest raises its temperature by a factor that grows with the square of the Mach number."
cite = ["ref_stagnation_temperature"]
digest = "8682e993b1e115b5"

[[equation]]
tag = 2
class = "standard"
title = "Isentropic Stagnation Pressure and Density Ratios"
gloss = "The stagnation pressure and density ratios of isentropic flow are powers of the stagnation temperature ratio fixed by the ratio of specific heats."
cite = ["research_naca_1135"]
digest = "9e666507b10bd538"

[[equation]]
tag = 3
class = "standard"
title = "Mach Angle"
gloss = "A weak disturbance in supersonic flow propagates along a cone whose half-angle is the inverse sine of the reciprocal Mach number."
cite = []
digest = "5ed0f33e160e1d08"

[[equation]]
tag = 4
class = "standard"
title = "Normal Shock Pressure and Temperature Ratios"
gloss = "The Rankine-Hugoniot relations give the static pressure and temperature ratios across a normal shock as functions of the upstream Mach number."
cite = ["ref_shock_wave"]
digest = "31a89c652cadeb45"

[[equation]]
tag = 5
class = "standard"
title = "Recovery Temperature and Recovery Factors"
gloss = "The recovery temperature is the free-stream temperature raised by the recovery factor times the stagnation rise, with the factor near the square root of the Prandtl number for laminar flow and its cube root for turbulent flow."
cite = ["ref_prandtl_number"]
digest = "1015f1cb28998b37"

[[equation]]
tag = 6
class = "standard"
title = "Ratio of Specific Heats with Vibrational Excitation"
gloss = "Treating each diatomic molecule as a harmonic oscillator adds a vibrational term to the specific heat at constant volume, which lowers the ratio of specific heats once the temperature approaches the characteristic vibrational temperature."
cite = []
digest = "742e053bc05b4833"

[[equation]]
tag = 7
class = "standard"
title = "Convective Heat Flux"
gloss = "The convective heat flux is the heat transfer coefficient times the difference between the recovery and wall temperatures."
cite = ["ref_heat_flux"]
digest = "352d13aef7f62c70"

[[equation]]
tag = 8
class = "standard"
title = "Stanton Number and the Reynolds Analogy"
gloss = "The Stanton number normalises the heat transfer coefficient, and the Reynolds analogy relates it to half the skin friction coefficient corrected by the Prandtl number."
cite = ["research_eckert_1956"]
digest = "18c632026da1d125"

[[equation]]
tag = 9
class = "standard"
title = "Prandtl and Nusselt Numbers"
gloss = "The Prandtl number is the ratio of momentum to thermal diffusivity, and the Nusselt number is the ratio of convective to conductive heat transfer across a length."
cite = ["ref_prandtl_number"]
digest = "05c262290c3a7a19"

[[equation]]
tag = 10
class = "standard"
title = "Fourier Law of Conduction"
gloss = "The conductive heat flux vector in a solid is the negative thermal conductivity times the temperature gradient."
cite = []
digest = "764981e8c1bce8ee"

[[equation]]
tag = 11
class = "standard"
title = "Local Turbulent Flat-Plate Skin Friction"
gloss = "The local skin friction coefficient of a turbulent flat plate falls as the inverse fifth root of the Reynolds number based on distance from the leading edge."
cite = []
digest = "0ade44135a6ed0bc"

[[equation]]
tag = 12
class = "standard"
title = "Sutherland Viscosity Law"
gloss = "The dynamic viscosity of a gas varies with temperature through a reference pair and the Sutherland constant."
