digest = "c1d1abae0e375b41"

[[equation]]
tag = 13
class = "standard"
title = "Unit Reynolds Number at the Mach 3.196 Condition"
gloss = "The unit Reynolds number is evaluated with the standard atmosphere density at 19,992 metres, the Sutherland viscosity and the true airspeed of the final flight."
