class = "bespoke"
title = "Bespoke Divergence Growth Rate"
gloss = "Past the pitch threshold the unstable root of the undamped, uncoupled pitch equation grows at the square root of the excess of the squared roll rate over the squared frequency."
cite = []
digest = "711559a6d8536965"

[[equation]]
tag = 92
class = "bespoke"
title = "Bespoke Growth Rate at a Thirty Percent Exceedance"
gloss = "The growth rate is evaluated for a roll rate of 5.8 radians per second, about thirty percent above the representative pitch frequency."
cite = []
digest = "452e5a43d5cc006f"

[[equation]]
tag = 93
class = "bespoke"
title = "Bespoke Divergence E-Folding Time"
gloss = "The e-folding time is the reciprocal of the growth rate obtained at the chosen roll rate."
cite = []
digest = "de99c8f65d9e45b2"

[[equation]]
tag = 94
class = "bespoke"
title = "Bespoke Time to Reach Thirty Degrees"
gloss = "The time to grow from an initial one-degree disturbance to thirty degrees of angle of attack follows from pure exponential growth at the chosen rate."
cite = []
digest = "d3c429d5fee7a8d5"

[[equation]]
tag = 95
class = "standard"
title = "Load Factor Increment from an Angle of Attack Excursion"
gloss = "An angle of attack excursion at a given dynamic pressure produces a normal load factor increment proportional to the lift-curve slope."
cite = []
digest = "87555ab5edbebd8a"

[[equation]]
tag = 96
class = "bespoke"
title = "Bespoke Load Factor for a Thirty Degree Excursion"
gloss = "The increment is evaluated for a thirty degree excursion with the linear supersonic lift-curve slope, which assumes the lift stays linear to that angle."
cite = []
digest = "5d7249b0709fb30d"

[[equation]]
tag = 97
class = "standard"
title = "Thermocouple Time Constant"
gloss = "A thermocouple junction responds with a first-order lag set by its thermal mass per unit surface area and the convective coefficient, which for a sphere reduces through the volume-to-area ratio of a sixth of the diameter."
cite = ["ref_thermocouple"]
digest = "ec5f773b7e0f0fe5"

[[equation]]
tag = 98
class = "bespoke"
title = "Bespoke Thermocouple Lag Error"
gloss = "The lag error is the time constant times the heating rate, evaluated for a half-millimetre steel bead and the initial skin heating rate of thirty kelvin per second."
cite = []
digest = "0e260d393252ab37"

[[equation]]
tag = 99
class = "standard"
title = "Probe Recovery Temperature"
gloss = "A probe measuring gas temperature recovers only a fraction of the stagnation rise, given by its probe recovery factor."
cite = []
digest = "28f40d9d69d971ec"

[[equation]]
tag = 100
class = "standard"
title = "Rayleigh Supersonic Pitot Formula"
gloss = "Above Mach one the pitot tube senses the total pressure behind a normal shock, and the Rayleigh formula relates it to the free-stream static pressure and Mach number."
cite = ["research_pitot_supersonic_1948"]
digest = "4f3e080784cbf761"

[[equation]]
tag = 101
class = "standard"
title = "Mach Number Sensitivity to the Measured Pressure Ratio"
gloss = "The relative error in inferred Mach number is a Mach-dependent factor times the relative error in the measured pressure ratio."
cite = []
digest = "f8ed357069be955a"

[[equation]]
tag = 102
class = "standard"
title = "Combined Standard Uncertainty"
gloss = "For uncorrelated inputs the variance of a derived quantity is the sum of squared sensitivities times the input variances."
cite = ["book_taylor_1997_error_analysis", "book_bevington_robinson_2002"]
digest = "c4cd5d76a8ed80ce"

[[equation]]
tag = 103
class = "standard"
title = "Inverse Heat Balance for Convective Flux"
gloss = "The convective flux is recovered from a measured skin temperature history as the stored heat rate plus the radiated flux."
cite = []
digest = "7c6b5fa238957b6c"

[[equation]]
tag = 104
class = "standard"
title = "Windblast Dynamic Pressure"
gloss = "The dynamic pressure an occupant meets on leaving the aircraft is half the density times the square of the speed."
cite = []
digest = "b95e8fa6a6a171e7"

[[equation]]
tag = 105
class = "standard"
title = "Reliability of a Series Chain"
gloss = "A chain of events that must all succeed has a probability of success equal to the product of the probabilities of its links."
cite = []
digest = "e4ee096ee56a50e0"

[[equation]]
tag = 106
class = "standard"
title = "Ballistic Coefficient of the Capsule"
gloss = "The ballistic coefficient is the capsule mass divided by its drag coefficient times its reference area."
cite = []
digest = "90fe0a6ef2f1c985"

[[equation]]
tag = 107
class = "standard"
title = "Terminal Descent Speed from the Ballistic Coefficient"
gloss = "At terminal speed drag balances weight, which fixes the speed by the ballistic coefficient and the density."
cite = []
digest = "52118e8372d3c2de"

[[equation]]
tag = 108
class = "standard"
title = "Allen-Eggers Peak Deceleration"
gloss = "The peak deceleration of ballistic entry depends on entry speed, flight path angle and scale height but not on the ballistic coefficient."
cite = []
digest = "3dd50c1e12064b65"

[[equation]]
tag = 109
class = "standard"
title = "Terminal Speed under a Parachute"
gloss = "A capsule under a canopy descends at the speed at which the drag of the canopy balances its weight."
cite = []
digest = "8926a37c8af2294a"

[[equation]]
tag = 110
class = "standard"
title = "Parachute Opening Load"
gloss = "The opening load is the opening shock factor times the dynamic pressure times the canopy drag area."
cite = []
digest = "15e7afc94859fcde"

[[equation]]
tag = 111
class = "standard"
title = "Flight Count Required to Reach a Target Uncertainty"
gloss = "Inverting the scalar update and rounding up gives the smallest number of flights that brings the posterior standard deviation to the target."
cite = ["related_post_a297_xplanes_framing"]
digest = "cdce9374ae19df6b"

[[equation]]
tag = 112
class = "standard"
title = "Information Gain as Entropy Reduction"
gloss = "For a scalar Gaussian the information gained is half the logarithm of the ratio of prior to posterior variance."
cite = ["research_lindley_1956"]
digest = "af6e3d17743a11e1"

[[equation]]
tag = 113
class = "bespoke"
title = "Bespoke Airframe Count from Binomial Attrition"
gloss = "The article models losses as independent with a constant probability per flight and requires that the programme completes with fewer losses than airframes at a chosen confidence."
cite = []
digest = "4b41cece686e99a5"

[[equation]]
tag = 114
class = "standard"
title = "Glide Angle and Sink Rate"
gloss = "In an unpowered glide the tangent of the glide angle is the reciprocal of the lift-to-drag ratio, and the sink rate is the speed divided by that ratio."
cite = []
digest = "f985d8768cd11c2c"

[[equation]]
tag = 115
class = "standard"
title = "Maximum Lift-to-Drag Ratio"
gloss = "Differentiating the parabolic polar gives the maximum lift-to-drag ratio in terms of aspect ratio, Oswald efficiency and zero-lift drag."
cite = []
digest = "99d392c84b4612eb"

[[equation]]
tag = 116
class = "standard"
title = "Aspect Ratio of the X-2 Wing"
gloss = "The aspect ratio is the square of the span divided by the wing area."
cite = []
digest = "a3fba8f46dcadccc"

[[equation]]
tag = 117
class = "bespoke"
title = "Bespoke Landing Stall Speed of the X-2"
gloss = "The stall speed is evaluated for the landing weight, a lake-bed density of 1.10 kilograms per cubic metre and a maximum lift coefficient of 0.9 that the article reduces by the cosine of the sweep angle."
cite = []
digest = "e0b5f5c32ac9b774"

[[equation]]
tag = 118
class = "bespoke"
title = "Bespoke Approach Sink Rate of the X-2"
gloss = "The sink rate divides an approach speed of 1.3 times the stall speed by the best glide ratio, which assumes that ratio holds on the approach."
cite = []
digest = "59ccdb2558a93da3"

[[equation]]
tag = 119
class = "standard"
title = "Buckingham Pi Theorem Group Count"
gloss = "A relation among $n$ physical quantities involving $k$ independent dimensions reduces to a relation among $n - k$ dimensionless groups."
cite = ["research_buckingham_1914"]
digest = "52c15309756454ad"

[[equation]]
tag = 120
class = "standard"
title = "Relative Density and Nondimensional Inertias"
gloss = "A dynamically similar model must match the mass ratio and the principal moments of inertia nondimensionalised by density, wing area and span or chord."
cite = []
digest = "3f994537c671bd16"

[[equation]]
tag = 121
class = "standard"
title = "Lateral Reduced Frequency"
gloss = "The reduced frequency of the motion is the angular frequency times the semispan divided by the flow speed."
cite = []
digest = "6ff7b32f61928006"

[[equation]]
tag = 122
class = "standard"
title = "Dynamic Scaling of Model Mass and Inertia"
gloss = "A model at geometric scale $1/k$ must have its mass reduced by the cube and its inertias by the fifth power of the scale, corrected by the ratio of ambient densities."
cite = []
digest = "a5aae27f7a836ea3"

[[equation]]
tag = 123
class = "bespoke"
title = "Bespoke Vertical Tail Growth to Hold Directional Stiffness"
gloss = "Holding directional stiffness from Mach 1.5 to Mach 3.196 by tail area alone, with the tail arm and efficiency fixed, requires the area to grow with the supersonic compressibility factor."
cite = []
digest = "9a15ddba645602a0"

[[equation]]
tag = 124
class = "standard"
title = "Yaw Rate Damper Law"
gloss = "A yaw damper commands rudder deflection in proportion to the negative yaw rate."
cite = []
digest = "c7b41178e7ef282f"

[[equation]]
tag = 125
class = "standard"
title = "Augmented Yaw Damping Derivative"
gloss = "The rate feedback adds to the natural yaw damping derivative a term proportional to the gain and the rudder effectiveness."
cite = []
digest = "a392ee0421c8b4ab"

[[equation]]
tag = 126
class = "standard"
title = "Augmented Dutch Roll Damping Ratio"
gloss = "The Dutch roll damping ratio is approximated from the augmented yaw damping derivative, the dynamic pressure, the geometry and the Dutch roll frequency."
cite = []
digest = "6ec9dc45aecc3adf"

