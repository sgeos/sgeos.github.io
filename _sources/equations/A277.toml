# Equation classification for A277. Read by `python3 _lib/equations.py`.

caution = "Reputation, manipulation intensity, detection intensity and the axis measures are abstract quantities without fixed units, so an equation fixes only relations among them, and several letters are reused, with $\\alpha$ both a cost convexity and a power-law exponent, $c_0$ both a cost scale and a top-position click-through rate, $\\delta$ both a discount factor and a manipulation perturbation, and $\\phi$ both a rank-attention function and a population fraction."

[[equation]]
tag = 1
class = "bespoke"
title = "Bespoke Reputation Mapping Function"
gloss = "The article frames the mapping problem as an unknown function that takes quality, manipulation intensity, platform architecture, detection regime and audience to observed reputation, plus an unexplained residual."
cite = []
digest = "5416615561308980"

[[equation]]
tag = 2
class = "bespoke"
title = "Bespoke Counterfactual Manipulation Contribution"
gloss = "The article defines the manipulation contribution as the difference between observed reputation and the reputation the same actor would hold with manipulation set to zero and everything else fixed."
cite = []
digest = "ad3cd31dc0f61931"

[[equation]]
tag = 3
class = "bespoke"
title = "Bespoke Additive Reputation Decomposition"
gloss = "Assuming that the contributions combine approximately additively, the article splits observed reputation into quality, manipulation, platform and residual terms."
cite = []
digest = "1fd6824bc116e447"

[[equation]]
tag = 4
class = "standard"
title = "Aggregate and Mean Manipulation Intensity"
gloss = "The aggregate intensity is the sum over actors and the mean is that sum divided by the number of actors."
cite = []
digest = "030094a9b60c3d9a"

[[equation]]
tag = 5
class = "standard"
title = "Sample Prevalence Estimator and Its Variance"
gloss = "The prevalence of manipulation in a random sample is the proportion of items classified as manipulated, with the binomial variance of a sample proportion."
cite = []
digest = "6661d290e4eb48f8"

[[equation]]
tag = 6
class = "standard"
title = "Inverse-Variance Weighted Meta-Analytic Estimate"
gloss = "Study estimates are combined with weights equal to the reciprocals of their reported variances, the fixed-effect meta-analytic mean."
cite = []
digest = "3725e8d822b640d1"

[[equation]]
tag = 7
class = "bespoke"
title = "Bespoke Additive Reputation Signal Model"
gloss = "The article models the reputation signal as a deterministic function of type and effort plus additive observation noise."
cite = []
digest = "87011807e853fee2"

[[equation]]
tag = 8
class = "standard"
title = "Bayesian Posterior Over Types"
gloss = "Bayes rule updates the prior over actor types to a posterior conditional on the observed reputation signal."
cite = []
digest = "6f6af8e58a101e77"

[[equation]]
tag = 9
class = "standard"
title = "Willingness to Pay Under the Posterior"
gloss = "The willingness to pay is the posterior expected utility of transacting less the utility of the outside option."
cite = []
digest = "437811f1bd162fd2"

[[equation]]
tag = 10
class = "bespoke"
title = "Bespoke Power-Law Manipulation Cost"
gloss = "The article assumes that the cost of manipulation rises as a power of intensity with an exponent greater than one, so that cost is convex."
cite = []
digest = "062daf6f8939f3aa"

[[equation]]
tag = 11
class = "bespoke"
title = "Bespoke Reputation Premium as an Expected Quality Differential"
gloss = "In the article's reputation-tier variant of the lemons market, the price premium of high-reputation sellers is the difference in expected quality between the two tiers."
cite = []
digest = "787ec5449a376459"

[[equation]]
tag = 12
class = "standard"
title = "Spence Single-Crossing Condition"
gloss = "The separating equilibrium requires that the marginal cost of producing the signal be lower for the high type than for the low type."
cite = ["research_spence_1973"]
digest = "61fdadb84f7d4d3b"

[[equation]]
tag = 13
class = "standard"
title = "Klein and Leffler Reputation Bond"
gloss = "The value of the reputation bond is the discounted sum of the future price premium the reputation earns."
cite = ["research_klein_leffler_1981"]
digest = "395c6b8594ea53ad"

[[equation]]
tag = 14
class = "bespoke"
title = "Bespoke Law of Motion of the Reputation Stock"
gloss = "The article treats reputation as a capital stock that decays at a constant rate, gains from authentic and manipulated inflows and loses through detection."
cite = []
digest = "6d184429dc193491"

[[equation]]
tag = 15
class = "standard"
title = "Present Value of the Reputation Stream"
gloss = "The asset value is the continuously discounted integral of the flow return the reputation stock produces."
cite = []
digest = "3c38e35d49a238c4"

[[equation]]
tag = 16
class = "bespoke"
title = "Bespoke Steady-State Reputation Stock"
gloss = "Setting the article's law of motion to zero under constant inflows and constant detection gives the stock as the net inflow divided by the decay rate."
cite = []
digest = "188eac3691c06749"

[[equation]]
tag = 17
class = "standard"
title = "Total Platform Attention"
gloss = "Total attention is the number of active users times the average attention each allocates."
cite = []
digest = "3915874481b0bf9b"

[[equation]]
tag = 18
class = "standard"
title = "Power-Law Rank-Size Distribution of Attention"
gloss = "Attention received falls as a power of rank, the Zipf rank-size regularity, with the exponent range the empirical literature reports."
cite = ["book_zipf_1949", "research_adamic_huberman_2000"]
digest = "1bab3a81cfb568cc"

[[equation]]
tag = 19
class = "standard"
title = "Herfindahl-Hirschman Index of Attention"
gloss = "The Herfindahl-Hirschman Index is the sum of squared attention shares, ranging from the reciprocal of the number of entities under uniform allocation to one under complete concentration."
cite = []
digest = "a0fcb8ed9bd265f2"

[[equation]]
tag = 20
class = "standard"
title = "Shannon Entropy of Attention"
gloss = "The Shannon entropy of the attention shares ranges from zero under complete concentration to the logarithm of the number of entities under uniform allocation."
cite = []
digest = "2df2dd1f91e218dc"

[[equation]]
tag = 21
class = "bespoke"
title = "Bespoke Ranking Function"
gloss = "The article abstracts the platform ranking as an unspecified function of reputation, engagement history, content features and personalisation features."
cite = []
digest = "c118341d367b2afc"

[[equation]]
tag = 22
class = "bespoke"
title = "Bespoke Attention as a Function of Rank"
gloss = "The article assumes that the attention an entity receives depends on its ranking score only through its rank position."
cite = []
digest = "0f41f8472e59cb2b"

[[equation]]
tag = 23
class = "bespoke"
title = "Bespoke Power-Law Click-Through Decay"
gloss = "The article approximates click-through rate as a power of rank position with an exponent taken to lie between one and two."
cite = []
digest = "1af861af9db08550"

[[equation]]
tag = 24
class = "standard"
title = "Chain Rule for the Reputation-to-Attention Conversion"
gloss = "The chain rule expands the derivative of attention with respect to reputation through rank position and ranking score."
cite = []
digest = "3b08dabd058f7470"

[[equation]]
tag = 25
class = "bespoke"
title = "Bespoke Platform Objective"
gloss = "The article writes the platform objective as a weighted sum of consumer surplus, producer surplus and revenue less the cost of detection."
cite = []
digest = "b5f8924231eb78ce"

[[equation]]
tag = 26
class = "bespoke"
title = "Bespoke Producer Manipulation Payoff"
gloss = "The article's producer earns the value of observed reputation less the direct cost of manipulation and the expected loss from detection."
cite = []
digest = "004dc298a8d5b3e8"

[[equation]]
tag = 27
class = "bespoke"
title = "Bespoke Producer First-Order Condition"
gloss = "The interior optimum of the article's producer payoff sets the marginal reputation benefit equal to the marginal direct cost plus the marginal expected detection loss."
cite = []
digest = "fbd4c0d7e52936ee"

[[equation]]
tag = 28
class = "standard"
title = "Nash Equilibrium as Mutual Best Response"
gloss = "Each actor's equilibrium intensity maximises that actor's payoff given the equilibrium intensities of all others."
cite = []
digest = "032ab39ea849d2ed"

[[equation]]
tag = 29
class = "standard"
title = "Prisoner's Dilemma Payoff Matrix"
gloss = "With the ordering of payoffs the article states, the two-actor binary manipulation game is a prisoner's dilemma whose dominant strategy equilibrium is mutual manipulation."
cite = []
digest = "321c2e66b20fe38e"

[[equation]]
tag = 30
class = "bespoke"
title = "Bespoke Aggregate Equilibrium Manipulation"
gloss = "Under the article's symmetric best response, aggregate equilibrium manipulation grows as the number of actors times the per-actor equilibrium intensity."
cite = []
digest = "fe4d46f607538c06"

[[equation]]
tag = 31
class = "bespoke"
title = "Bespoke Negative Elasticity of Manipulation to Detection"
gloss = "The elasticity of equilibrium manipulation with respect to detection intensity is the logarithmic derivative, which the article asserts is negative."
cite = []
digest = "b9d49d1111343c36"

[[equation]]
tag = 32
class = "bespoke"
title = "Bespoke Platform First-Order Condition for Detection"
gloss = "The article's platform chooses detection intensity where the weighted marginal gain in consumer trust less the weighted marginal loss in producer participation equals the marginal cost of detection."
cite = []
digest = "da5f52955f49d8ee"

[[equation]]
tag = 33
class = "standard"
title = "Bayesian Posterior of Manipulation Given a Signal"
gloss = "Bayes rule for a binary hypothesis gives the posterior probability that an item is manipulated given the detection signal."
cite = []
digest = "28ea9c16f4a8fc31"

[[equation]]
tag = 34
class = "standard"
title = "True and False Positive Rates at a Threshold"
gloss = "The true and false positive rates at a threshold are the upper tails of the score distributions of manipulated and authentic items, which trace the receiver operating characteristic."
cite = []
digest = "b6fe590725d10ac0"

[[equation]]
tag = 35
class = "bespoke"
title = "Bespoke Deterrence Condition"
gloss = "The article's actor abstains when the expected penalty plus the direct cost exceeds a linear approximation to the reputation gain from manipulation."
cite = []
digest = "d3ab4a9e08eecb79"

[[equation]]
tag = 36
class = "bespoke"
title = "Bespoke Signal-to-Noise Ratio Under Manipulation"
gloss = "The article defines informativeness as the variance of the authentic signal component over the sum of noise variance and manipulation-induced variance."
cite = []
digest = "4dc8a99488af290a"

[[equation]]
tag = 37
class = "bespoke"
title = "Bespoke Exponential Trust Recovery After Exposure"
gloss = "The article assumes that trust drops to a floor at exposure and recovers exponentially toward its pre-exposure level at a constant rate."
cite = []
digest = "6ef3541bfdc6bc44"

[[equation]]
tag = 38
class = "bespoke"
title = "Bespoke Divergent Single-Crossing Condition"
gloss = "The article modifies the single-crossing condition by requiring the marginal cost gap between low and high types to diverge as the signal grows, which defines an uncounterfeitable signal."
cite = []
digest = "93eb3d9c8206426d"

[[equation]]
tag = 39
class = "bespoke"
title = "Bespoke Collective Deviation Cost"
gloss = "The article sums the reputation losses of the members of a collective, valued at each member's reputation value, and adds the cost of expulsion."
cite = []
digest = "c1cb3261d3bfc5e4"

[[equation]]
tag = 40
class = "bespoke"
title = "Bespoke Legacy Reputation Value"
gloss = "The article values legacy reputation as the discounted integral of reputation, its value and signal informativeness up to the transition to the manipulation equilibrium."
cite = []
digest = "5aa6d9e1ea61e30a"

[[equation]]
tag = 41
class = "bespoke"
title = "Bespoke Expected External Penalty"
gloss = "The article sums over enforcement channels the probability of detection in each channel times the penalty it imposes."
cite = []
digest = "0923e087a8721bdb"

[[equation]]
tag = 42
class = "bespoke"
title = "Bespoke Two-Subpopulation Posterior Mixture"
gloss = "The article assumes that producers fall into a separating and a manipulating subpopulation, so the consumer posterior is their mixture weighted by the separating fraction."
cite = []
digest = "0a349bee070026cf"

[[equation]]
tag = 43
class = "standard"
title = "Two-Strategy Replicator Equation"
gloss = "The separating fraction grows at a rate proportional to its product with its complement and to the payoff difference between the strategies."
cite = []
digest = "f699c1074ab0ef8e"

[[equation]]
tag = 44
class = "standard"
title = "Local Stability of a Fixed Point"
gloss = "An interior fixed point of a one-dimensional flow is asymptotically stable when the derivative of the flow is negative there."
cite = []
digest = "869867c2410128fa"

[[equation]]
tag = 45
class = "bespoke"
title = "Bespoke Injection-Rate Flux"
gloss = "The article operationalises the signal axis as the sum over injection kinds of event counts weighted by ranking weight and evasion fidelity."
