[[equation]]
tag = 47
class = "standard"
title = "Shannon Entropy of Injection Channels"
gloss = "The diversity of an actor's injection channels is the Shannon entropy of the fractions of events allocated to each channel."
cite = []
digest = "beb7e191c6f2537f"

[[equation]]
tag = 48
class = "bespoke"
title = "Bespoke Linear Actor Utility"
gloss = "The article writes the objective axis as a weighted sum of goal functions with non-negative weights."
