[[symbol]]
tex = '\oplus'
meaning = "exclusive-or, bitwise addition over the binary field"

[[symbol]]
tex = 'n'
meaning = "the code length in bits, except in Equations 29 to 32, where it is the payload of a region in bytes"

[[symbol]]
tex = 'k'
meaning = "the number of data bits in a codeword"

[[symbol]]
tex = 'r'
meaning = "the number of check bits in a codeword"

[[symbol]]
tex = 'H'
meaning = "the parity-check matrix of the code"

[[symbol]]
tex = 'h_i'
meaning = "the column of the parity-check matrix for bit position $i$"

[[symbol]]
tex = '\mathcal{H}'
meaning = "the set of columns of the parity-check matrix"

[[symbol]]
tex = 's(c)'
meaning = "the syndrome of a received word $c$, with $s(e)$ the syndrome of an error pattern $e$"

[[symbol]]
tex = '\mathrm{wt}'
meaning = "the Hamming weight of a vector, its number of ones"

[[symbol]]
tex = '\mathrm{supp}(e)'
meaning = "the set of bit positions at which the error pattern $e$ is one"

[[symbol]]
tex = 'd = 4'
meaning = "the minimum distance of the code"

[[symbol]]
tex = 't = 1'
meaning = "the number of errors the code corrects, with $s = 2$ the number it detects"

[[symbol]]
tex = 'w = 3'
meaning = "the weight of a fault, the number of bits it flips"

[[symbol]]
tex = 'M'
meaning = "the honest artefact as the publisher produced it"

[[symbol]]
tex = '\mathrm{Ver}'
meaning = "the predicate that the signature verifies against a candidate artefact"

[[symbol]]
tex = '\mathcal{S}'
meaning = "the scrub, which applies every repair the code offers"

[[symbol]]
tex = '\mathrm{Inst}'
meaning = "the bytes the loader installs and executes"

[[symbol]]
tex = 'X_{t_0}'
meaning = "the artefact's contents at the time of verification, with $X_{t_1}$ its contents at the later time of the scrub"

[[symbol]]
tex = 'F_3'
meaning = "a fault of weight three in the window between verification and scrub"

[[symbol]]
tex = 'p(n)'
meaning = "the size in bytes of the padded parity plane for a region of $n$ payload bytes"

[[symbol]]
tex = '\rho'
meaning = "the plane overhead of an artefact, the ratio of plane bytes to payload bytes over its $m$ regions"
