[[equation]]
tag = 4
class = "bespoke"
title = "Bespoke Institutional-Collapse Ratio"
gloss = "The article defines the collapse ratio as one minus output at the 1998 trough divided by output at the pre-collapse peak, a counterpart of the war-loss ratio of the fifth article that is about two fifths for Russia."
cite = ["related_post_meiji_japan"]
digest = "95a1bc43f3fba8dd"

[[symbol]]
