# Equation classification for A170. Read by `python3 _lib/equations.py`.

caution = "Cash is in dollars, burn rate in dollars per month and cycle time in months, so runway is in months and the attempt count is dimensionless, while every probability is a fraction between zero and one."

[[equation]]
tag = 1
class = "standard"
title = "Runway"
gloss = "The runway of a venture is its cash divided by its burn rate."
cite = ["ref_burn_rate"]
digest = "4f3b6aa936e8fa5b"

[[equation]]
tag = 2
class = "bespoke"
title = "Bespoke Number of Attempts Within the Runway"
gloss = "The article divides the runway by the time of one turn of the build loop, which equals the cash divided by an attempt cost it defines as the burn rate times the cycle time."
cite = []
digest = "f6bd4e311c394506"

[[equation]]
tag = 3
class = "bespoke"
title = "Bespoke Probability of Finding Fit"
gloss = "Treating each attempt as an independent trial with the same probability of discovering a fitting product, the chance of at least one success is the complement of failing every time."
cite = ["ref_bernoulli", "ref_geometric"]
digest = "a4301aedc7470731"

[[equation]]
tag = 4
class = "bespoke"
title = "Bespoke Probability of Fit in the Example"
gloss = "The probability of fit is evaluated for eight attempts from an illustrative twelve-month runway and six-week cycle at an assumed per-attempt success rate of 0.15."
cite = []
digest = "305de5665708555b"

[[equation]]
tag = 5
class = "bespoke"
title = "Bespoke Mean Attempts to First Fit"
gloss = "The mean of the geometric process gives the expected number of attempts to first fit at the assumed success rate of 0.15."
cite = ["ref_geometric"]
digest = "b45b6cbebca7707e"

[[equation]]
tag = 6
class = "bespoke"
title = "Bespoke Attempts and Cash for a Target Confidence"
gloss = "Inverting the independent-trial model gives the attempts needed to reach a chosen confidence of finding fit and the cash to fund them at the article's attempt cost."
cite = []
digest = "6dde0179757627c1"

[[equation]]
tag = 7
class = "bespoke"
title = "Bespoke Marginal Value of One More Attempt"
gloss = "Under the independent-trial model the value of one more attempt is the probability that fit first arrives on exactly that attempt, which shrinks geometrically."
cite = []
digest = "425cc5e49360a8b1"

[[symbol]]
tex = 'C'
meaning = "the cash the venture holds"

[[symbol]]
tex = 'b'
meaning = "the burn rate"

[[symbol]]
tex = 'T'
meaning = "the runway"

[[symbol]]
tex = '\tau'
meaning = "the time one turn of the build loop takes"

[[symbol]]
tex = 'N'
meaning = "the number of attempts before the runway ends"

[[symbol]]
tex = 'e'
meaning = "the cost of a single attempt, the burn multiplied by the cycle time"

[[symbol]]
tex = 'P_{\text{fit}}'
meaning = "the probability of finding product-market fit"

[[symbol]]
tex = 'p'
meaning = "the probability that one attempt discovers a fitting product"

[[symbol]]
tex = 'P^\ast'
meaning = "the chosen confidence of finding fit"

[[symbol]]
tex = 'N^\ast'
meaning = "the attempts needed to reach that confidence"

[[symbol]]
tex = 'C^\ast'
meaning = "the cash needed to fund those attempts"
