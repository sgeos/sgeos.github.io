digest = "e68b5f43483d9d5b"

[[equation]]
tag = 32
class = "standard"
title = "Classical Rise Time Against Measurement"
gloss = "At sea level and the low-boom overpressure the classical rise time is 5.2 microseconds, about 192 times shorter than the measured millisecond."
cite = ["research_cleveland_blackstock_1994", "research_maglieridomenicj_sothcottvictore_1990"]
digest = "50edbac6bb6f6340"

[[equation]]
tag = 33
class = "standard"
title = "Classical Absorption Coefficient"
gloss = "Classical absorption from viscosity and conduction rises as the square of frequency and gives 0.159 decibels a kilometre at 1,000 hertz."
