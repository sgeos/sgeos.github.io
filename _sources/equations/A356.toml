# Equation classification for A356. Read by `python3 _lib/equations.py`.

caution = "Pressures, densities and speeds are in units of the International System at standard atmosphere conditions, while weights and thrusts are quoted from the builder in pounds and speeds from the National Aeronautics and Space Administration in miles per hour, levels are in decibels referred to 20 micropascals, and perceived level in decibels on the Mark VII scale is a psychophysical quantity whose differences are not pressure ratios, so a percentage reduction depends on whether it is stated in pressure, energy or loudness."

[[equation]]
tag = 1
class = "standard"
title = "Mach Angle and Prandtl-Glauert Parameter"
gloss = "The Mach cone has a half-angle whose sine is the reciprocal of the Mach number, and its cotangent is the Prandtl-Glauert parameter."
cite = ["book_liepmann"]
digest = "91b2a1cd9c7bcbce"

[[equation]]
tag = 2
class = "standard"
title = "Far-Field Overpressure From the F-Function"
gloss = "Linearised supersonic theory gives the far-field overpressure ratio as proportional to Whitham's F-function and inversely to the square root of distance."
cite = ["research_whitham_1952", "book_whitham"]
digest = "753eef7d629a4e55"

[[equation]]
tag = 3
class = "standard"
title = "Whitham F-Function"
gloss = "The F-function is an Abel transform of the second derivative of the equivalent area distribution."
cite = ["research_whitham_1952", "book_whitham"]
digest = "fc890979891672fe"

[[equation]]
tag = 4
class = "standard"
title = "Equivalent Area Including Lift"
gloss = "The equivalent area is the volume cross-section plus a term proportional to the lift carried ahead of each station."
cite = ["book_ashley_landahl", "book_jones"]
digest = "d2297ff1c576af1d"

[[equation]]
tag = 5
class = "standard"
title = "Lift-Induced Equivalent Area at the Tail"
gloss = "Integrated over the whole aircraft in level flight, the lift term collapses to the weight over twice the dynamic pressure times the Prandtl-Glauert parameter, independent of shape."
cite = []
digest = "c4f7b201a7513f76"

[[equation]]
tag = 6
class = "bespoke"
title = "Bespoke Lift-Induced Equivalent Area at the Design Point"
gloss = "The equivalent area is evaluated with the published maximum design gross weight standing for the cruise lift, a choice the article makes, and the standard atmosphere dynamic pressure at Mach 1.4 and 55,000 feet."
cite = ["ref_lm_card"]
digest = "149fa3dec6fe9891"

[[equation]]
tag = 7
class = "bespoke"
title = "Bespoke Diameter of the Lift-Induced Equivalent Body"
gloss = "A body of revolution carrying that equivalent area, taken at the maximum design gross weight, would be 2.32 metres across."
cite = []
digest = "0b72410d9740c4de"

[[equation]]
tag = 8
class = "standard"
title = "Altitude Ratio of the Lift-Induced Equivalent Area"
gloss = "At fixed weight and Mach number the lift-induced area scales inversely with dynamic pressure, so it is 2.06 times larger at 55,000 feet than at 40,000."
cite = []
digest = "4579622a57006a66"

[[equation]]
tag = 9
class = "standard"
title = "Von Karman Slender-Body Wave Drag"
gloss = "The wave drag is a double integral of the second derivative of the same equivalent area with a logarithmic kernel."
cite = ["book_kuchemann", "ref_area_rule"]
digest = "90d5c427bc5bf51b"

[[equation]]
tag = 10
class = "standard"
title = "Cylindrical Spreading of a Weak Disturbance"
gloss = "A weak disturbance from a line source falls with the square root of distance because its energy spreads over a cylinder."
cite = ["book_pierce"]
digest = "379a8439cbe30fc7"

[[equation]]
tag = 11
class = "standard"
title = "Far-Field Decay of Sonic Boom Amplitude and Duration"
gloss = "Whitham's far-field result makes the overpressure fall as the minus three-quarters power of distance and the signature lengthen as the one-quarter power."
cite = ["book_whitham", "book_maglieri"]
digest = "d6d4add703b0ce45"

[[equation]]
tag = 12
class = "standard"
title = "Acoustic Intensity"
gloss = "The intensity of an acoustic wave is its mean square pressure over the characteristic impedance of the medium."
cite = ["book_kinsler"]
digest = "d9cb47162800a817"

[[equation]]
tag = 13
class = "standard"
title = "Decay of Acoustic Energy Along the Ray"
gloss = "Combining the far-field exponents gives an energy per unit length that falls as the minus one-quarter power of distance, the energy that the shocks dissipate."
cite = []
digest = "4ca478eabf7696c1"

[[equation]]
tag = 14
class = "standard"
title = "Speed of Sound in a Perfect Gas"
gloss = "The local speed of sound follows from the temperature at each altitude."
cite = ["ref_us_standard_atmosphere", "book_anderson"]
digest = "6a395b1d76b05124"

[[equation]]
tag = 15
class = "standard"
title = "Temperature Profile of the Standard Atmosphere"
gloss = "The temperature falls linearly in the troposphere and is constant in the isothermal layer above the tropopause."
cite = ["ref_us_standard_atmosphere"]
digest = "238659f087bf128e"

[[equation]]
tag = 16
class = "standard"
title = "Pressure and Density in the Isothermal Layer"
gloss = "In the isothermal layer the pressure decays exponentially from its tropopause value and the density follows from the gas law."
cite = ["ref_us_standard_atmosphere", "ref_icao_atmosphere"]
digest = "1ad917e79f0f4a75"

[[equation]]
tag = 17
class = "standard"
title = "Dynamic Pressure at the Design Cruise"
gloss = "At the standard atmosphere density for 55,000 feet and a speed of Mach 1.4 the dynamic pressure is 12,512 pascals."
cite = []
digest = "4651d3707df4ddd8"

[[equation]]
tag = 18
class = "standard"
title = "Ray Invariant in a Stratified Atmosphere"
gloss = "In a horizontally stratified medium the cosine of the ray elevation over the local sound speed is conserved, a form of Snell's law."
cite = ["book_pierce"]
digest = "73fd9080d0ddb1cb"

[[equation]]
tag = 19
class = "standard"
title = "Mach Cutoff Number"
gloss = "The boom reaches the ground only above the Mach number equal to the ratio of the sound speed at the ground to that at cruise altitude."
cite = ["book_maglieri"]
digest = "abb16017561d6a22"

[[equation]]
tag = 20
class = "standard"
title = "Cutoff Mach Number at the Design Altitude"
gloss = "In the standard atmosphere the cutoff Mach number from 55,000 feet is 1.153, well below the design Mach number of 1.4."
cite = ["ref_us_standard_atmosphere"]
digest = "365b90cbcf6a4215"

[[equation]]
tag = 21
class = "standard"
title = "Horizontal Slowness of an Azimuthal Ray"
gloss = "For a wave normal at azimuth $\\phi$ around the Mach cone, the magnitude of the horizontal slowness is invariant along the ray."
cite = ["book_pierce", "research_haefelirc_hayeswd_1969"]
digest = "e89c0ff574329843"

[[equation]]
tag = 22
class = "standard"
title = "Lateral Cutoff Azimuth"
gloss = "A ray reaches the ground only while its slowness admits a real vertical direction there, which at the design condition requires an azimuth of at least 45.4 degrees."
cite = ["research_haefelirc_hayeswd_1969"]
digest = "6035b2d5a04dca4a"

[[equation]]
tag = 23
class = "standard"
title = "Lateral Ray Path"
gloss = "The lateral offset of a ray follows from integrating the slope that the invariant fixes from cruise altitude to the ground."
cite = ["book_pierce"]
digest = "ff4d3ca15c5cc672"

[[equation]]
tag = 24
class = "standard"
title = "Boom Carpet Half-Width and Width"
gloss = "Integrating the ray path numerically through the standard atmosphere places the widest-arriving ray 29.6 kilometres to the side, a carpet of 59.2 kilometres."
cite = []
digest = "c077b04876b900f0"

[[equation]]
tag = 25
class = "standard"
title = "Check of the Ray Tracer Against the Published Rule of Thumb"
gloss = "The same tracer at Mach 2 falls 3.9 percent short of the published one mile per thousand feet, and the Mach 1.4 carpet is 69.6 percent of the Mach 2 carpet."
cite = ["ref_nasa_fs016"]
digest = "47497f340caf9eba"

[[equation]]
tag = 26
class = "standard"
title = "Design Cruise Speed"
gloss = "The design Mach number times the speed of sound at cruise altitude gives 413.1 metres per second, which reproduces the published 925 miles per hour."
cite = ["ref_nasa_quesst_aircraft"]
digest = "f9b12cf940d9d3bf"

[[equation]]
tag = 27
class = "standard"
title = "Sound Pressure Level"
gloss = "An overpressure becomes a level as twenty times the base-ten logarithm of its ratio to the reference pressure."
cite = ["book_kinsler"]
digest = "44b9423522d79442"

[[equation]]
tag = 28
class = "standard"
title = "Ground Reflection Factor"
gloss = "The overpressure at the ground is the incident overpressure times a reflection factor close to two."
cite = []
digest = "117bb975dbece7ab"

[[equation]]
tag = 29
class = "bespoke"
title = "Bespoke Ground Impedance Implied by a Reflection Factor of 1.9"
gloss = "For a locally reacting surface at normal incidence, the reflection factor of 1.9 that the article adopts from inside the measured range of 1.8 to 2.0 corresponds to a normalised ground impedance of 19."
cite = ["research_carlsonhw_1978"]
digest = "403a5bcb0afb6d8f"

[[equation]]
tag = 30
class = "standard"
title = "Taylor Thickness of a Weak Shock"
gloss = "The steady thickness of a weak shock in a viscous, heat-conducting gas is inversely proportional to its strength, and its rise time is that thickness over the sound speed."
cite = ["book_hamilton_blackstock"]
digest = "97a964e3a8a733d0"

[[equation]]
tag = 31
class = "standard"
title = "Diffusivity of Sound"
gloss = "The diffusivity of sound gathers the shear and bulk viscosities and the thermal conduction term."
