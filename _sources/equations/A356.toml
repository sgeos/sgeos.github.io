digest = "c0552503c8c26d55"

[[equation]]
tag = 34
class = "standard"
title = "Steepening Distance and Least Unshocked Rise Time"
gloss = "A compression of rise time $\\tau$ steepens into a shock after a distance that falls with its amplitude, and inverting it over the propagation distance gives the least rise time that arrives unshocked."
