# Equation classification for A260. Read by `python3 _lib/equations.py`.

caution = "Every quantity is dimensionless or measured in the arbitrary units of a reward function, the symbol $J$ denotes an expected return to be maximised except in the two horizon bounds where it is read as an expected cost, and the symbol $\\beta$ means the strength of a constraint against a reference policy in the preference objectives but a pessimism coefficient in the lower confidence bound."

[[equation]]
tag = 1
class = "standard"
title = "Demonstration Dataset"
gloss = "A demonstration dataset is a finite set of trajectories, each an alternating sequence of states and actions generated by the expert policy."
cite = []
digest = "f200cc7b63283759"

[[equation]]
tag = 2
class = "standard"
title = "Pairwise Preference Dataset"
gloss = "A preference dataset is a finite set of trajectory pairs, each labelled with a binary indicator that records which of the two a judge preferred."
cite = []
digest = "78811fe5dee6f6bb"

[[equation]]
tag = 3
class = "standard"
title = "Transition Kernel Under a Joint Action"
gloss = "From the standpoint of one learner the next state depends on its own action and the actions of every other agent, which together form the joint action of the multi-agent transition kernel."
cite = []
digest = "37cefcf549b8cb39"

[[equation]]
tag = 4
class = "standard"
title = "Behaviour Cloning Loss"
gloss = "Behaviour cloning fits the policy by maximum likelihood, minimising the negative log probability that it assigns to each demonstrated action in its state."
cite = []
digest = "be99a9da53cd8aeb"

[[equation]]
tag = 5
class = "standard"
title = "Dataset Aggregation Step"
gloss = "Dataset Aggregation, known as DAgger, adds to the training set the expert's labels on states visited by the current learner policy."
cite = ["research_ross_gordon_bagnell_2011"]
digest = "802b3624345d9790"

[[equation]]
tag = 6
class = "standard"
title = "Dataset Aggregation Policy Update"
gloss = "The next policy minimises the expected per-step imitation loss over the aggregated dataset."
cite = ["research_ross_gordon_bagnell_2011"]
digest = "c89fd21c901eac2e"

[[equation]]
tag = 7
class = "standard"
title = "Demonstration Augmented Policy Gradient"
gloss = "Demonstration Augmented Policy Gradient adds to the ordinary policy gradient an advantage-weighted likelihood term on demonstrated pairs whose weight decays over training."
cite = ["research_rajeswaran_et_al_2018_dapg"]
digest = "7bd234e904b75882"

[[equation]]
tag = 8
class = "standard"
title = "Inverse Dynamics Model"
gloss = "Behavioural Cloning from Observation infers the action taken between two consecutive states with a learned inverse dynamics model."
cite = ["research_torabi_warnell_stone_2018_bco"]
digest = "ae2c1c784f7d2141"

[[equation]]
tag = 9
class = "standard"
title = "Soft Q Imitation Learning Reward"
gloss = "Soft Q Imitation Learning assigns a reward of one to every demonstrated state and action pair and a reward of zero to every other pair."
cite = ["research_reddy_dragan_levine_2020_sqil"]
digest = "c51e53629dd9d4a4"

[[equation]]
tag = 10
class = "standard"
title = "Feature Expectation Matching"
gloss = "Apprenticeship learning seeks weights of a linear reward under which the optimal policy matches the expert's expected features to within a tolerance $\\epsilon$."
cite = ["research_abbeel_ng_2004_apprenticeship"]
digest = "e000caa68951ac4b"

[[equation]]
tag = 11
class = "standard"
title = "Maximum Entropy Trajectory Distribution"
gloss = "Maximum entropy inverse reinforcement learning models a trajectory's probability as proportional to the exponential of its cumulative reward, normalised by a partition function."
cite = ["research_ziebart_et_al_2008_maxent"]
digest = "7b3a88a134f52b89"

[[equation]]
tag = 12
class = "standard"
title = "Adversarial Inverse Reinforcement Learning Discriminator"
gloss = "Adversarial Inverse Reinforcement Learning sets the discriminator as the exponentiated learned function divided by itself plus the policy probability, so that the function separates into a reward and a shaping term."
cite = ["research_fu_luo_levine_2018_airl"]
digest = "bc01d417bda92955"

[[equation]]
tag = 13
class = "standard"
title = "Bayesian Posterior over Rewards"
gloss = "Bayesian inverse reinforcement learning applies Bayes' rule to obtain a posterior over reward functions from the likelihood of the demonstrations and a prior."
cite = ["research_ramachandran_amir_2007_bayesian_irl"]
digest = "395bdeba8b14b4d8"

[[equation]]
tag = 14
class = "standard"
title = "Generative Adversarial Imitation Learning Objective"
gloss = "Generative Adversarial Imitation Learning plays a minimax game in which a discriminator separates expert from learner occupancy and the policy tries to make the two indistinguishable."
cite = ["research_ho_ermon_2016_gail"]
digest = "c1dff2de3df4b958"

[[equation]]
tag = 15
class = "standard"
title = "Discriminator Actor Critic Reward"
gloss = "Discriminator Actor Critic converts the discriminator output into an off-policy reward equal to its log odds."
cite = ["research_kostrikov_chiba_fergus_2020_dac"]
digest = "1982aa551a2633a5"

[[equation]]
tag = 16
class = "standard"
title = "Divergence Minimisation Objective for Imitation"
gloss = "The f-divergence form of adversarial imitation minimises any chosen f-divergence between the learner's and the expert's occupancy distributions."
cite = ["research_ke_et_al_2021_fgail"]
digest = "839ec3b3f9c3e531"

[[equation]]
tag = 17
class = "standard"
title = "Bradley Terry Reward Model Loss"
gloss = "The reward model is fitted by minimising the cross entropy of the Bradley-Terry model, in which the probability of a preference is the logistic sigmoid of the difference in trajectory rewards."
cite = ["research_christiano_et_al_2017_rlhf"]
digest = "c14f91a4278e917a"

[[equation]]
tag = 18
class = "standard"
title = "Information Maximising Preference Query"
gloss = "Active preference elicitation chooses the trajectory pair whose answer carries the greatest mutual information about the reward parameters."
cite = ["research_sadigh_et_al_2017_active"]
digest = "30d8edaf30da52ed"

[[equation]]
tag = 19
class = "standard"
title = "Direct Preference Optimisation Loss"
gloss = "Direct Preference Optimisation fits the policy to preference pairs through a logistic loss on the difference of scaled log ratios against the reference policy, with no explicit reward model."
cite = ["research_rafailov_et_al_2023_dpo"]
digest = "3e909d460edf80d9"

[[equation]]
tag = 20
class = "standard"
title = "Constrained Reward Maximisation"
gloss = "The derivation of the preference loss starts from maximising expected reward less a penalty on the Kullback-Leibler divergence from the reference policy."
cite = ["research_rafailov_et_al_2023_dpo"]
digest = "bbe06f8a80892792"

[[equation]]
tag = 21
class = "standard"
title = "Kahneman Tversky Optimisation Loss"
gloss = "Kahneman-Tversky Optimisation scores single labelled responses through a loss-averse value function of the scaled log ratio, with distinct slopes for desirable and undesirable outputs."
cite = ["research_ethayarajh_et_al_2024_kto"]
digest = "c7a66ffff9d78a4e"

[[equation]]
tag = 22
class = "standard"
title = "Identity Preference Optimisation Loss"
gloss = "Identity Preference Optimisation regresses the log ratio difference between preferred and dispreferred responses onto a fixed target of one over twice $\\beta$ under a squared loss."
cite = ["research_azar_et_al_2024_ipo"]
digest = "ed3c492185cee86f"

[[equation]]
tag = 23
class = "bespoke"
title = "Bespoke Statement of Reward Overoptimisation"
gloss = "The article writes overoptimisation as a schematic inequality in which the learned reward greatly exceeds the true reward on outputs outside the training distribution of the reward model."
cite = ["research_gao_schulman_hilton_2023"]
digest = "7803252d95fcc62e"

[[equation]]
tag = 24
class = "standard"
title = "Ensemble Lower Confidence Bound Reward"
gloss = "The pessimistic reward is the ensemble mean less a multiple of the ensemble standard deviation, a lower confidence bound on the reward."
cite = ["research_coste_et_al_2024_ensembles"]
digest = "924c52ef4e4d2f5f"

[[equation]]
tag = 25
class = "standard"
title = "Training an Agent Manually via Evaluative Reinforcement Policy"
gloss = "Training an Agent Manually via Evaluative Reinforcement, known as TAMER, acts greedily with respect to a learned model of the human's evaluative signal."
cite = ["research_knox_stone_2009_tamer"]
digest = "88eaa16dadbb76d3"

[[equation]]
tag = 26
class = "standard"
title = "Time Contrastive Triplet Loss"
gloss = "Time-Contrastive Networks apply a hinged triplet loss that draws an anchor towards a simultaneous frame from another view and pushes it from a frame at another time by at least a margin."
cite = ["research_sermanet_et_al_2018_tcn"]
digest = "8f43929572fc7310"

[[equation]]
tag = 27
class = "standard"
title = "Markov Game Transition and Reward"
gloss = "A Markov game draws the next state and each agent's reward from functions of the current state and the joint action of all agents."
cite = ["research_littman_1994_markov_games"]
digest = "35baab3f8c04d7d3"

[[equation]]
tag = 28
class = "standard"
title = "Centralised Critic"
gloss = "Multi-Agent Deep Deterministic Policy Gradient gives each agent a critic conditioned on the global state and the joint action while its actor sees only local observations."
cite = ["research_lowe_et_al_2017_maddpg"]
digest = "4222b537419f1333"

[[equation]]
tag = 29
class = "standard"
title = "Monotonic Value Mixing"
gloss = "QMIX combines per-agent values into a joint value through a state-conditioned mixing network constrained to be monotonic in each agent's value."
cite = ["research_rashid_et_al_2018_qmix"]
digest = "b94fbe1d5d1c759f"

[[equation]]
tag = 30
class = "standard"
title = "Additive Value Decomposition"
gloss = "Value-Decomposition Networks write the joint value as the sum of the per-agent values."
cite = ["research_sunehag_et_al_2018_vdn"]
digest = "c6f80cd95312827b"

[[equation]]
tag = 31
class = "standard"
title = "Individual Global Max Condition"
gloss = "The individual global max condition requires that the joint greedy action equal the tuple of each agent's own greedy action."
cite = ["research_son_et_al_2019_qtran"]
digest = "7310243d9e1723e5"

[[equation]]
tag = 32
class = "standard"
title = "Counterfactual Advantage"
gloss = "Counterfactual Multi-Agent Policy Gradients credit an agent with the joint value less a baseline that marginalises its own action under its policy while the other agents' actions stay fixed."
cite = ["research_foerster_et_al_2018_coma"]
digest = "ca535129d28de488"

[[equation]]
tag = 33
class = "standard"
title = "Opponent Learning Awareness Update"
gloss = "Learning with Opponent-Learning Awareness ascends each agent's return evaluated after the anticipated learning steps of every agent."
cite = ["research_foerster_et_al_2018_lola"]
digest = "75cc967bb3ed63d2"

[[equation]]
tag = 34
class = "standard"
title = "AlphaGo Zero Training Loss"
gloss = "AlphaGo Zero trains its network on the squared error of the value against the game outcome, the cross entropy of the policy against the search distribution, and an $L_2$ penalty."
cite = ["research_silver_et_al_2017_alphago_zero"]
digest = "9fcbff359660454c"

[[equation]]
tag = 35
class = "standard"
title = "Cooperative Inverse Reinforcement Learning Value"
gloss = "Cooperative Inverse Reinforcement Learning has the human and the robot jointly maximise the discounted return of a reward whose parameter only the human knows."
cite = ["research_hadfield_menell_et_al_2016_cirl"]
digest = "c5021a73d631b619"

[[equation]]
tag = 36
class = "standard"
title = "Inverse Reward Design Posterior"
gloss = "Inverse Reward Design treats the specified proxy reward as evidence about the true reward in the training environment and forms a posterior by Bayes' rule."
cite = ["research_hadfield_menell_et_al_2017_ird"]
digest = "697721e440f45857"

[[equation]]
tag = 37
class = "standard"
title = "Demonstration Conditioned Policy"
gloss = "One-shot imitation conditions the policy on a single demonstration drawn for the task alongside the current state."
cite = ["research_duan_et_al_2017_one_shot"]
digest = "9be1b962a0c22fb0"

[[equation]]
tag = 38
class = "standard"
title = "Meta Imitation Objective"
gloss = "Meta-imitation learning chooses an initialisation that minimises the behaviour cloning loss after one inner gradient step on that loss, averaged over tasks."
cite = ["research_finn_et_al_2017_meta_imitation"]
digest = "260ca8a96305c5d0"

[[equation]]
tag = 39
class = "standard"
title = "Quadratic Horizon Bound for Behaviour Cloning"
gloss = "With per-state error probability $\\epsilon$ and horizon $T$ the expected cost of a cloned policy exceeds the expert's by at most $T^2 \\epsilon$."
cite = ["research_ross_bagnell_2010_efficient"]
digest = "38395f2f72fb5480"

[[equation]]
tag = 40
class = "standard"
title = "Linear Horizon Bound for Interactive Imitation"
gloss = "Interactive methods such as Dataset Aggregation reduce the excess cost over the expert to a bound linear in the horizon."
cite = ["research_ross_gordon_bagnell_2011"]
digest = "19219fe3509db447"

[[equation]]
tag = 41
class = "bespoke"
title = "Bespoke Schematic Bound for Preference Learning"
gloss = "The article states the suboptimality of a policy learned from preferences in a generic form that scales with the square root of reward class complexity times the cube of the horizon over the number of queries, a horizon dependence it does not derive."
cite = ["research_zhu_jiao_jordan_2023"]
digest = "3c4272f167eb1f1a"

[[equation]]
tag = 42
class = "standard"
title = "Transitive and Cyclic Decomposition of a Zero Sum Game"
gloss = "The payoff of a two-player zero-sum game separates into a transitive part that ranks strategies and a cyclic part that produces non-transitive dominance."
cite = ["research_balduzzi_et_al_2019_open_ended"]
digest = "17280c7666ab8927"

