[[symbol]]
tex = '\omega_{i,j}'
meaning = "the Synaptic Intelligence importance of parameter $j$ for task $i$"

[[symbol]]
tex = '\Omega_{i,j}'
meaning = "the Memory-Aware Synapses importance of parameter $j$ for task $i$"

[[symbol]]
tex = 'f_\theta'
