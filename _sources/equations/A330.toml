caution = "Vehicle masses and thrusts are quoted in pounds while the structural, thermal and propulsion relations are evaluated in the International System, and many letters are reused between sections, so $r$ is an orbital radius and then the mixture ratio, $R$ is a tank radius except in the gas relations, where it is the universal gas constant, $h$ is the envelope height and then the sandwich core thickness, $\\gamma$ is the buckling knockdown factor in the shell relations and the ratio of specific heats in the nozzle relations, $\\alpha$ is a lobe half angle and then a thermal expansion coefficient, $\\rho_c$ is the core density in the sandwich relations and the condensate density in the cryopumping relations, $\\varepsilon$ is the nozzle area ratio while $\\varepsilon_2$ is a strain, and $f$ is a fill fraction and then a share of the structural allowance."

[[equation]]
tag = 1
class = "standard"
title = "Demanded Reduction in Cost to Orbit"
gloss = "The stated goal of reducing launch cost from about ten thousand to one thousand dollars a pound is a factor of ten."
cite = ["ref_gao_x33"]
digest = "0232e886cdd3af26"

[[equation]]
tag = 2
class = "standard"
title = "Growth of the Industry Contribution"
gloss = "The industry contribution grew from 211.6 to 286.6 million dollars, an increase of 35.4 percent of the original figure."
cite = ["ref_gao_x33"]
digest = "01c50545ffd9b445"

[[equation]]
tag = 3
class = "bespoke"
title = "Bespoke Gross Mass Ratio of VentureStar to the X-33"
gloss = "The ratio takes the VentureStar gross mass as 2,184,000 pounds, a value the article chooses within the roughly 2.2 million reported, against the X-33's 285,000."
