cite = ["ref_rocketeq", "book_rocket_propulsion_elements"]
digest = "2a9951c1644ba2bf"

[[equation]]
tag = 6
class = "standard"
title = "Required Mass Ratio"
gloss = "Inverting the rocket equation gives the mass ratio as the exponential of the velocity increment over the effective exhaust velocity."
cite = ["ref_rocketeq", "book_rocket_propulsion_elements"]
digest = "87ce30d136abb744"

[[equation]]
tag = 7
class = "standard"
title = "Propellant Mass Fraction"
gloss = "The propellant mass fraction is one minus the reciprocal of the mass ratio."
digest = "c0ffb57dd652ab21"

[[equation]]
tag = 8
class = "standard"
title = "Circular Orbit Force Balance"
gloss = "In a circular orbit gravity supplies exactly the centripetal acceleration."
digest = "ce9c8fb4c2a06a48"

[[equation]]
tag = 9
class = "standard"
title = "Circular Orbital Velocity"
gloss = "The circular orbital velocity is the square root of the gravitational parameter over the orbital radius."
digest = "274e4d23133e957f"

[[equation]]
tag = 10
class = "bespoke"
title = "Bespoke Orbital Velocity at Two Hundred Kilometres"
gloss = "The circular velocity is evaluated at an altitude of two hundred kilometres, the reference orbit the article takes."
digest = "5483b12ec47db62e"

[[equation]]
tag = 11
class = "bespoke"
title = "Bespoke Ascent Losses"
gloss = "The losses are the difference between a velocity budget of 9,300 metres per second, which the article takes as the cost of low Earth orbit, and the circular velocity at two hundred kilometres."
digest = "d34096a0a4bfad6e"

[[equation]]
tag = 12
class = "bespoke"
title = "Bespoke Effective Exhaust Velocity"
gloss = "The effective exhaust velocity uses a trajectory-effective specific impulse of 430 seconds that the article takes as representative of a hydrogen-oxygen engine."
digest = "2bae4baefaa4c408"

[[equation]]
tag = 13
class = "bespoke"
title = "Bespoke Required Mass Ratio to Orbit"
gloss = "The representative budget of 9,300 metres per second and specific impulse of 430 seconds give a required mass ratio of about nine."
digest = "2d85e0b9c9c82db9"

[[equation]]
tag = 14
class = "bespoke"
title = "Bespoke Required Propellant Fraction to Orbit"
gloss = "The required propellant fraction under the representative budget and specific impulse is 0.89, leaving eleven percent of gross mass for everything else."
