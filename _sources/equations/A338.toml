# Equation classification for A338. Read by `python3 _lib/equations.py`.

caution = "Mach numbers in this article are a fixed speed scale of 295 metres per second rather than local Mach numbers, ranges are quoted in both kilometres and nautical miles, and the letter $R$ alone is a glide range while $R_{e}$ is the radius of the Earth and $R_{n}$ the leading-edge radius."

[[equation]]
tag = 1
class = "standard"
title = "Half Great Circle of the Earth"
gloss = "The farthest point on Earth from any launch site is half a great circle away, 20,015 kilometres or 10,807 nautical miles on the mean radius."
cite = []
digest = "ac7bb9eba147036b"

[[equation]]
tag = 2
class = "standard"
title = "Planned Range Against the Cruise Vehicle's Figure"
gloss = "The published planned range of 17,000 kilometres stands within two percent of the cruise vehicle's 9,000 nautical miles."
cite = ["ref_acton_2015", "ref_falcon"]
digest = "48915eda4c1cf0c7"

[[equation]]
tag = 3
class = "standard"
title = "Circular Speed at the Surface"
gloss = "The speed at which a body would orbit at the surface is the square root of gravity times the Earth radius, 7,904 metres per second."
cite = []
digest = "c4119f932c3c3294"

[[equation]]
tag = 4
class = "standard"
title = "Equilibrium Glide Lift"
gloss = "The lift a steady glide requires is the weight less the centrifugal relief of the curved path."
cite = []
digest = "db225fc621549e2e"

[[equation]]
tag = 5
class = "standard"
title = "Equilibrium Glide Range of Eggers"
gloss = "Integrating the equilibrium glide from an initial speed to rest gives a range linear in the lift to drag ratio and logarithmic in the speed term."
cite = ["research_eggers_1955", "research_eggers_1958"]
digest = "d8545a94541a384f"

[[equation]]
tag = 6
class = "standard"
title = "Sensitivity of Range to Lift to Drag Ratio"
gloss = "Since range is linear in the lift to drag ratio, a fractional loss of the ratio is the same fractional loss of range."
cite = []
digest = "9f5d6a69d5cdf023"

[[equation]]
tag = 7
class = "standard"
title = "Lift to Drag Ratio Required for a Range"
gloss = "Solving the equilibrium glide range for the ratio gives the demand that a fixed distance places on the shape."
cite = []
digest = "b0de3463201e91d4"

[[equation]]
tag = 8
class = "bespoke"
title = "Bespoke Fixed Speed Scale for Mach Numbers"
gloss = "Speeds are converted from Mach numbers on a fixed scale of 295 metres per second, the isothermal-layer speed of sound of the standard atmosphere, which the article adopts as a convention rather than a local value."
cite = ["ref_usa76"]
digest = "87ddac5c32d26bf8"

[[equation]]
tag = 9
class = "standard"
title = "Küchemann Barrier for Hypersonic Lift to Drag Ratio"
gloss = "Küchemann's correlation gives the attainable maximum lift to drag ratio of a hypersonic configuration as four times the Mach number plus three, over the Mach number."
cite = ["research_kuchemann_1965"]
digest = "9e965f6c649e1261"

[[equation]]
tag = 10
class = "bespoke"
title = "Bespoke Mach Number Where Demand Meets the Barrier"
gloss = "Equating the ratio required for a range of 9,000 nautical miles, which the article takes as the glider's requirement, to the Küchemann ceiling on the fixed speed scale defines the minimum entry speed."
cite = []
digest = "08c9e31c890d1af0"

[[equation]]
tag = 11
class = "bespoke"
title = "Bespoke Minimum Entry Speed"
gloss = "The numerical root on the fixed speed scale and the attributed range requirement is Mach 22.2, or 83 percent of orbital speed."
cite = []
digest = "21b3eee8f983cac0"

[[equation]]
tag = 12
class = "bespoke"
title = "Bespoke Effect of Using the Local Speed of Sound"
gloss = "Replacing the fixed 295 metres per second scale with the local speed of sound at 40 kilometres raises the Küchemann ceiling at Mach 20 by about one percent."
cite = []
digest = "1a1e48dfd021e668"

[[equation]]
tag = 13
class = "standard"
title = "Planned Glide Duration and Distance"
gloss = "The published reconstruction of the trajectory gives a planned glide of 1,178 seconds covering 4,800 kilometres."
cite = ["ref_acton_2015"]
digest = "62a09b6c06cf00eb"

[[equation]]
tag = 14
class = "standard"
title = "Equilibrium Glide Range Between Two Speeds"
gloss = "The range between two speeds is the difference of the two ranges to rest."
cite = []
digest = "c923b527204341e9"

[[equation]]
tag = 15
class = "bespoke"
title = "Bespoke Range of the Planned Glide"
gloss = "The range between the reconstructed initial speed and a final speed of 2,250 metres per second, the midpoint of the reconstructed range, at the published ratio of 2.6 is 4,783 kilometres."
