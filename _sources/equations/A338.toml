[[equation]]
tag = 28
class = "standard"
title = "Stagnation Heating Coefficient From the Sutton and Graves Constant"
gloss = "Taking the stagnation pressure as the density times the speed squared and the enthalpy difference as half the speed squared, the usual hypersonic approximations, converts the published coefficient to 1.748 times ten to the minus four."
