# Equation classification for A311. Read by `python3 _lib/equations.py`.

caution = "Control power CP is an angular acceleration in radians per second squared, the forces and weights are mostly in pounds while the disturbance and multirotor relations are in newtons and metres, $T_{0}$ is the total temperature of the bleed air in the nozzle relations but the uninstalled thrust in the bleed and margin relations, $\\beta$ is a fraction of thrust in the opening bound and a bled fraction of airflow thereafter, and $\\delta$, $A$ and $R$ each carry more than one meaning."

[[equation]]
