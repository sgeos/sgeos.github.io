gloss = "The article bounds the symmetric differential of each rotor by the smaller of the upward headroom and the downward reserve at the hover thrust $mg/n$."
cite = []
digest = "69bc639ca06cd119"

[[equation]]
tag = 93
class = "bespoke"
title = "Bespoke Multirotor Control Moment"
gloss = "Summing the bounded differentials with a geometry factor $c_{g}$ at rotor radius $R$ gives a moment in which the rotor count cancels."
cite = []
digest = "7641c6cc26bbdec2"

[[equation]]
tag = 94
class = "bespoke"
title = "Bespoke Multirotor Control Power"
gloss = "Dividing the moment by the inertia written with a radius of gyration $k$ gives a control power in which the mass cancels."
cite = []
digest = "6510aefd9692f721"

[[equation]]
tag = 95
class = "bespoke"
title = "Bespoke Inverse-Span Law for a Multirotor"
gloss = "Putting the radius of gyration at a fraction $\\kappa$ of span and the rotor radius at half the span makes multirotor control power inversely proportional to span."
cite = []
digest = "038e5b08e5da685a"

[[equation]]
tag = 96
class = "standard"
title = "Zero-Sum Differential Thrust"
gloss = "A pure moment command on a multirotor raises some rotors exactly as much as it lowers others, so the thrust changes sum to zero."
cite = []
digest = "fe205d0742abef05"

[[equation]]
tag = 97
class = "bespoke"
title = "Bespoke Span at Which a Multirotor Falls to the X-14A Maximum"
gloss = "Setting the multirotor relation equal to 2.0 radians per second squared gives the span at which a vehicle of given margin falls to the X-14A maximum."
cite = []
digest = "c295a4de43e0d7dd"

[[equation]]
tag = 98
class = "standard"
title = "First-Order Lag Response"
gloss = "For a first-order lag of time constant $\\tau_{c}$ the fraction of a commanded moment present after a time $t$ is $1 - e^{-t/\\tau_{c}}$."
cite = []
digest = "cdd93328fa05402f"

[[equation]]
tag = 99
class = "standard"
title = "Moment Fraction at 0.2 Seconds"
gloss = "At 0.2 seconds the open-loop fan, the closed-loop fan and the reaction nozzles deliver 29.2, 44.5 and 91.8 percent of the commanded moment."
cite = ["research_rolls_gerdes_1969"]
digest = "b2240b49e7a64e7b"

[[equation]]
tag = 100
class = "standard"
title = "Angular Acceleration of a Sinusoidal Attitude"
gloss = "Tracking an attitude oscillation of amplitude $A$ at frequency $\\omega$ requires a peak angular acceleration of $A \\omega^{2}$."
cite = []
digest = "7dd8748e47e45957"

[[equation]]
tag = 101
class = "standard"
title = "Bandwidth Cap at the Available Control Power"
gloss = "Saturation at the available control power caps the trackable frequency at the square root of the control power over the amplitude."
cite = []
digest = "72052b6f9004052e"

[[equation]]
tag = 102
class = "standard"
title = "Bandwidth Caps at Five Degrees of Amplitude"
gloss = "At five degrees of amplitude control powers of 0.8 and 2.0 support 3.03 and 4.79 radians per second."
cite = []
digest = "5fd03de5382635ed"

[[equation]]
tag = 103
class = "standard"
title = "Amplitude Cap at Two Radians per Second"
gloss = "A control power of 0.8 sustains two radians per second up to an amplitude of 0.2 radians."
cite = []
digest = "03a3842977da0c16"

[[equation]]
tag = 104
class = "standard"
title = "Attitude Dynamics Without Gravity"
gloss = "The angular acceleration is the moment over the inertia and contains no gravitational term."
cite = []
digest = "a174e0672d35e620"

[[equation]]
tag = 105
class = "standard"
title = "Horizontal Acceleration of a Tilted Hover"
gloss = "A vehicle holding height and tilted by $\\theta$ accelerates horizontally at $g \\tan\\theta$."
cite = []
digest = "ae72a3cbdb1ebb21"

[[equation]]
tag = 106
class = "standard"
title = "Ratio of Terrestrial to Lunar Gravity"
gloss = "Terrestrial gravity is 6.05 times lunar gravity."
cite = []
digest = "0afb4ed12f3a34c8"

[[equation]]
tag = 107
class = "standard"
title = "Lunar Translation Timescale Ratio"
gloss = "Because distance under constant acceleration goes as the square of time, the lunar translation timescale is longer by the square root of the gravity ratio, 2.46."
cite = []
digest = "e84dd3e74ed10110"

[[equation]]
tag = 108
class = "standard"
title = "Terrestrial Drift at Five Degrees for Five Seconds"
gloss = "Five degrees of tilt held for five seconds moves a vehicle 10.7 metres on Earth."
cite = []
digest = "bc34efe548754d73"

[[equation]]
tag = 109
class = "standard"
title = "Lunar Drift at Five Degrees for Five Seconds"
gloss = "The same tilt and time move a vehicle 1.8 metres on the Moon."
cite = []
digest = "554a61d795e2bf63"

[[equation]]
tag = 110
class = "standard"
title = "Lunar to Terrestrial Hover Thrust"
gloss = "A vehicle hovering on the Moon needs the gravity ratio, 0.165, of the thrust it needs on Earth."
cite = []
digest = "98a49d1dfe9ee6f9"

[[equation]]
tag = 111
class = "standard"
title = "Equal Horizontal Acceleration Under Two Gravities"
gloss = "Equal horizontal acceleration requires the tangent of the lunar tilt to be 6.05 times that of the terrestrial tilt."
cite = []
digest = "7071412fc4ff3749"

[[equation]]
tag = 112
class = "standard"
title = "Lunar Tilt Equivalent to Five Degrees on Earth"
gloss = "Five degrees of terrestrial tilt corresponds to 27.9 degrees on the Moon."
cite = []
digest = "361ae9828f109f83"

[[equation]]
tag = 113
class = "standard"
title = "Weight Fraction Carried by the Lunar Landing Research Vehicle Jet"
gloss = "Cancelling five sixths of the weight leaves the jet carrying 83.5 percent of the vehicle."
cite = ["ref_llrv"]
digest = "2c182a28020e1f2a"

[[equation]]
tag = 114
class = "bespoke"
title = "Bespoke Time for a Hover Position Correction"
gloss = "The article models a correction as two symmetric accelerate-and-arrest attitude changes at full control power plus a constant-tilt translation over a distance $d$."
cite = []
digest = "03d35b4818f8ed73"

[[equation]]
tag = 115
class = "bespoke"
title = "Bespoke Stationarity Condition for the Correction Time"
gloss = "Differentiating the small-angle form of the correction time with respect to tilt and setting it to zero gives the stationarity condition."
cite = []
digest = "b6c0b2eaa92c8336"

[[equation]]
tag = 116
class = "bespoke"
title = "Bespoke Optimal Correction Tilt"
gloss = "The stationarity condition of the correction model solves to an optimal tilt of half the square root of the control power times the distance over gravity."
cite = []
digest = "0ebda5a9921f3a37"

[[equation]]
tag = 117
class = "bespoke"
title = "Bespoke Equal Split of the Correction Time"
gloss = "At the optimal tilt of the correction model the attitude term and the translation term are equal."
cite = []
digest = "88e6f35185908b61"

[[equation]]
tag = 118
class = "bespoke"
title = "Bespoke Elasticity of Correction Time to Control Power"
gloss = "Across the tested range the correction model gives a local exponent of about minus a quarter for the time with respect to control power."
cite = []
digest = "747264e510072d09"

