digest = "5cffa49aff3336ee"

[[equation]]
tag = 13
class = "standard"
title = "Equivalent Skin-Friction Coefficient"
gloss = "The equivalent skin-friction coefficient is the minimum drag coefficient referred to wetted area rather than to a reference area."
cite = []
digest = "c73da47b73548fa5"

[[equation]]
tag = 14
class = "standard"
title = "Forebody Drag Referred to the Base Area"
