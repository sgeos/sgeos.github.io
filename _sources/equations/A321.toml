# Equation classification for A321. Read by `python3 _lib/equations.py`.

caution = "Quantities are in United States customary units, with lengths in feet, speeds in feet per second, miles an hour or knots as each line states and weights in pounds, drag coefficients are referred to wetted area, reference area or base area as each line states, and the efficiency factor of 0.6, the approach speed of 300 miles an hour and the maximum lift coefficient of 0.7 are values the article assumes."

[[equation]]
tag = 1
class = "standard"
title = "Cost of the Rebuild Relative to a New Vehicle"
