[[equation]]
tag = 7
class = "standard"
title = "Full-Scale Value of the Hoerner Coefficient"
gloss = "Flight measurements on the X-15, the M2-F3 and the Space Shuttle require a coefficient of 0.090 to 0.100 in the Hoerner correlation."
cite = ["research_saltzman_2007"]
digest = "57e33977fdb80f46"

[[equation]]
tag = 8
class = "standard"
title = "Ratio of Full-Scale to Model Hoerner Coefficients"
gloss = "The full-scale coefficient of 0.100 is about three and a half times the model-scale value of 0.029."
cite = []
digest = "4d71786a5f96dfae"

[[equation]]
tag = 9
class = "standard"
title = "Reynolds Number"
gloss = "The Reynolds number is the product of speed and length divided by the kinematic viscosity."
cite = []
digest = "6856105c3bb5f936"

[[equation]]
tag = 10
class = "bespoke"
title = "Bespoke Reynolds Number Ratio of Flight to a Small Model"
gloss = "The approach Reynolds number of the X-24B is about forty times that of a model the article takes as one-twentieth scale in a tunnel at 200 feet per second."
cite = []
digest = "31c6faa79ca2d2dd"

[[equation]]
tag = 11
class = "bespoke"
title = "Bespoke True Airspeed at the Middle of the Approach Band"
