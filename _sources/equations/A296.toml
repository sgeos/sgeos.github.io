# Equation classification for A296. Read by `python3 _lib/equations.py`.

caution = "Sizes are counted in bytes and rates in bytes per second, every hit rate, escape probability and compression factor is a dimensionless proportion, and the cost models are first approximations that ignore effects the article names but does not quantify."

[[equation]]
tag = 1
class = "bespoke"
title = "Bespoke Effective Header Size under a Table Hit Rate"
gloss = "The article models HPACK header compression as a choice between a hit that costs only an index and a miss that costs the full header, which ignores literal encoding and table maintenance."
cite = []
digest = "fd53b239d12afe70"

[[equation]]
tag = 2
class = "bespoke"
title = "Bespoke Total Bytes with an Inline Schema"
gloss = "The article charges every one of $N$ messages the same data and inline metadata sizes, a uniform-message assumption that makes the total linear in the message count."
cite = []
digest = "f5a2bb6f6bb4dd8c"

[[equation]]
tag = 3
class = "bespoke"
title = "Bespoke Total Bytes with an Out-of-Band Schema"
gloss = "Under the same uniform-message assumption, the schema is paid once and each message then carries only its data."
cite = []
digest = "5de0bb618b00195d"

[[equation]]
tag = 4
class = "bespoke"
title = "Bespoke Break-Even Message Count for an External Schema"
gloss = "Comparing the two cost models gives the number of messages beyond which distributing the schema separately is cheaper, a threshold that inherits the uniform-message assumption."
cite = []
digest = "37a3913cc50c67e5"

[[equation]]
tag = 5
class = "standard"
title = "Bound on a Declared Length"
gloss = "A reader checks the declared length against a bound it chooses independently of the sender before allocating, the standard defence against a length prefix used for resource exhaustion."
cite = []
digest = "73111cb1c7dd4bb8"

[[equation]]
tag = 6
class = "bespoke"
title = "Bespoke Expected Payload Size after Delimiter Escaping"
gloss = "The article assumes the delimiter occurs independently with probability $q$ per byte and that each occurrence expands to two bytes, so the expected size grows by the factor $1 + q$."
cite = []
digest = "25c28d10b5773206"

[[equation]]
tag = 7
class = "standard"
title = "Backward Compatibility as a Round Trip"
gloss = "Backward compatibility is the requirement that a reader at schema $R$ recovers every value written at any older or equal schema $W$, with forward compatibility the same condition for newer writers."
cite = []
digest = "54a3c60418b7cf17"

[[equation]]
tag = 8
class = "standard"
title = "Canonical Encoding"
gloss = "A format is canonical when every value has exactly one permitted byte representation, a condition strictly stronger than unambiguity."
cite = []
digest = "1878df1915a83a65"

[[equation]]
tag = 9
class = "bespoke"
title = "Bespoke Transfer and Decode Time"
gloss = "The article treats transfer and decoding as serial stages that do not overlap, so the total time is the sum of the time on the link and the time in the decoder."
cite = []
digest = "24ca865953e2e37c"

[[equation]]
tag = 10
class = "bespoke"
title = "Bespoke Condition for Compression to Pay"
gloss = "Under the serial time model, compression that shrinks the message by $\\alpha$ and slows decoding by $\\beta$ helps only when the compressed time per byte of original message falls below the uncompressed time."
cite = []
digest = "e75b67ef4542739c"

[[equation]]
tag = 11
class = "standard"
title = "Alignment Padding"
gloss = "The padding that brings a field up to the next multiple of its alignment boundary is zero for an aligned field and at most one byte less than the boundary otherwise."
cite = ["ref_rfc4506"]
digest = "6c6e385f4254e67b"

[[equation]]
tag = 12
class = "bespoke"
title = "Bespoke Bounds on the Version Testing Burden"
gloss = "The article measures the testing burden by the version pairs that negotiation can reach, bounded below by the $k$ outcomes of highest-common-version negotiation and above by all $k^2$ ordered pairs."
cite = []
digest = "72785b53f0c645a5"

