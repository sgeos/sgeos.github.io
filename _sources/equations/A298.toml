[[equation]]
tag = 94
class = "standard"
title = "Combined Standard Uncertainty"
gloss = "For uncorrelated inputs the variance of a derived quantity is the sum of squared sensitivities times the input variances."
cite = ["book_taylor_1997_error_analysis", "book_bevington_robinson_2002"]
digest = "c4cd5d76a8ed80ce"

[[equation]]
tag = 95
class = "standard"
title = "Drag from Accelerating Flight"
gloss = "Drag is thrust less the product of instantaneous mass and measured axial acceleration."
cite = ["research_beeler_1956"]
digest = "2677b734dc45e497"

[[equation]]
tag = 96
class = "standard"
title = "Nyquist Sampling Criterion"
gloss = "A signal containing frequencies up to $f_{\\max}$ must be sampled at more than twice that frequency."
