# Equation classification for A298. Read by `python3 _lib/equations.py`.

caution = "Each equation uses the units of the International System stated in its section, with the test condition of 14 October 1947 at Mach 1.06 and 13,115 metres as the reference point, and several letters change meaning between sections, so $b$, $e$, $k$, $S$, $T$ and $\\gamma$ are read from the nearest prose."

[[equation]]
tag = 1
class = "standard"
title = "Prandtl-Glauert Compressibility Correction"
gloss = "The small-disturbance compressible pressure coefficient is the incompressible value divided by the square root of one minus the square of the Mach number, which diverges as the Mach number approaches one."
cite = ["ref_prandtl_glauert", "research_glauert_1928"]
digest = "0993b592ffc53880"

[[equation]]
tag = 2
