digest = "ed638b5ecc60fd38"

[[equation]]
tag = 39
class = "standard"
title = "Haversine Great-Circle Distance"
gloss = "The haversine formula gives the great-circle distance between Vandenberg Air Force Base and the recovery area near Kwajalein as about 7,790 kilometres."
