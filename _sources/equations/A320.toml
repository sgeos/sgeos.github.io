digest = "85463d07b422e061"

[[equation]]
tag = 40
class = "standard"
title = "Downrange Rate per Unit Speed"
gloss = "Dividing the along-path rate by the deceleration gives the downrange accumulated per unit speed in the equilibrium glide."
cite = []
digest = "6ae6ae475be77086"

[[equation]]
tag = 41
class = "standard"
title = "Downrange Increment in the Squared Speed Fraction"
