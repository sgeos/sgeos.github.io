# Equation classification for A320. Read by `python3 _lib/equations.py`.

caution = "Mechanics are in International System units, with distances in metres or kilometres and speeds in metres per second, while the record quotes feet, statute miles, nautical miles and British thermal units, so each conversion is stated where it is made, and the entry speed of 25,200 feet per second, the working weight of 894 pounds and the derived reference area of 1.386 square metres are values the article assumes."

[[equation]]
tag = 1
class = "standard"
title = "Lift-to-Drag Ratio"
gloss = "The lift-to-drag ratio is the ratio of lift to drag, equal to the ratio of the lift and drag coefficients."
cite = ["ref_lift_to_drag"]
digest = "c7930d4e42d6233c"

[[equation]]
tag = 2
class = "standard"
title = "Cost of PRIME Relative to the X-20"
gloss = "The documented 70 million dollars of the Precision Recovery Including Maneuvering Entry programme against the 458 million dollars of the cancelled X-20 is a ratio of about one seventh."
cite = ["research_r_dale_reed_1997", "research_hallion_1998"]
digest = "2bb7f72e7ec2d8f4"

[[equation]]
tag = 3
class = "bespoke"
title = "Bespoke Departure of the Working Weight from the Lift-Off Weight"
gloss = "The working weight of 894 pounds that the article chooses among conflicting figures differs from the first vehicle's documented lift-off weight of 895 pounds by about one tenth of a percent."
cite = []
digest = "af51e74b5a818b89"

[[equation]]
tag = 4
class = "bespoke"
title = "Bespoke Planform Fill Ratio of the X-24A"
gloss = "The article defines the ratio of planform area to the product of length and span and evaluates it on the X-24A at about 0.58."
cite = ["research_saltzman_2002"]
digest = "821ccca8380a9c28"

[[equation]]
tag = 5
class = "bespoke"
title = "Bespoke Reference Area of the SV-5D"
gloss = "Applying the X-24A planform fill ratio to the length and span of the SV-5D assumes that the two shapes fill their bounding boxes alike and gives about 1.39 square metres."
cite = []
digest = "555cf85a2df3880a"

[[equation]]
tag = 6
class = "bespoke"
title = "Bespoke Planform Fill Ratio from an Alternative Source"
gloss = "The same fill ratio evaluated on the alternative X-24A dimensions is about 0.58, which makes the derived area 1.1 percent smaller."
cite = ["research_john_g_mctigue_1970"]
digest = "35e889da4d844278"

[[equation]]
tag = 7
class = "standard"
title = "Linear Scale Ratio of the SV-5D to the X-24A"
gloss = "The ratio of the documented lengths of the two vehicles is about 0.27."
cite = []
digest = "48cb9f28a076d8a8"

[[equation]]
tag = 8
class = "standard"
title = "Weight Ratios of the SV-5D to the X-24A"
gloss = "The documented SV-5D weight is 7.5 percent of the X-24A launch weight and 16 percent of its empty weight."
cite = ["research_r_dale_reed_1997", "research_john_cochrane_kenneth_graham_1971"]
digest = "743820f551dc1800"

[[equation]]
tag = 9
class = "standard"
title = "Radial Force Balance in a Gliding Entry"
gloss = "In the radial direction the vertical component of the rolled lift and the centrifugal force of the curved path together support the weight."
cite = []
digest = "967c398c55db7784"

[[equation]]
tag = 10
class = "standard"
title = "Equilibrium Glide Lift Requirement"
gloss = "With the centrifugal term written through the speed as a fraction of circular speed, the lift a gliding vehicle needs is its weight less the part its speed already carries."
cite = []
digest = "72e29792166952dc"

[[equation]]
tag = 11
class = "standard"
title = "Lift Required at Three Quarters of Circular Speed"
gloss = "At three quarters of circular speed the equilibrium glide needs a vertical lift of 0.44 of the weight."
cite = []
digest = "9361d5d0b5b4f9cc"

[[equation]]
tag = 12
class = "standard"
title = "Circular Satellite Speed at the Surface"
gloss = "Equating gravitational and centripetal acceleration at the mean Earth radius with standard gravity gives a circular speed of about 7,900 metres per second."
cite = []
digest = "cf89bf461012c08f"

[[equation]]
tag = 13
class = "standard"
title = "Equations of Motion Along and Across the Path"
gloss = "Drag decelerates the vehicle along its path and the sideways component of the rolled lift turns its heading."
cite = []
digest = "2d0ab270b26260c2"

[[equation]]
tag = 14
class = "standard"
title = "Heading Change per Unit Speed"
gloss = "Dividing the turning equation by the deceleration and substituting the force balance leaves a heading rate per unit speed that depends on the vehicle only through its lift-to-drag ratio."
cite = ["book_vinh_1981", "book_regan_anandakrishnan_1993"]
digest = "9d5151bb35baaa1b"

[[equation]]
tag = 15
class = "standard"
title = "Heading Change in an Equilibrium Glide"
gloss = "Integrating from the entry speed gives a heading change proportional to the logarithm of the speed ratio at constant bank and lift-to-drag ratio."
cite = ["book_vinh_1981", "book_regan_anandakrishnan_1993"]
digest = "3661f5e9ac7f226f"

[[equation]]
tag = 16
class = "standard"
title = "Heading Change from Circular to Quarter Circular Speed"
gloss = "At Martin's design lift-to-drag ratio of 1.2 and a bank of 45 degrees, slowing to a quarter of circular speed turns the vehicle through about 67 degrees."
cite = []
digest = "23d9e629128962e2"

[[equation]]
tag = 17
class = "standard"
title = "Crossrange Rate per Unit Speed in the Small-Angle Form"
gloss = "Dividing the lateral rate by the deceleration with the heading taken as small, the step the period literature took, gives the crossrange accumulated per unit speed."
cite = []
digest = "eae558d491f80110"

[[equation]]
tag = 18
class = "standard"
title = "Substitution in the Squared Speed Fraction"
gloss = "Writing the speed through the squared speed fraction $u$ and gravity through the circular speed prepares every factor of circular speed to cancel."
cite = []
digest = "6cc0581fc2b7aa48"

[[equation]]
tag = 19
class = "standard"
title = "Crossrange Increment in the Squared Speed Fraction"
gloss = "After the substitution the crossrange increment depends on the Earth radius, the lift-to-drag ratio, the bank and the heading alone."
cite = []
digest = "217413e91a215cfe"

[[equation]]
tag = 20
class = "standard"
title = "Closed Crossrange Integral"
gloss = "Substituting the logarithmic heading solution turns the accumulated crossrange into the Earth radius times the squared lift-to-drag ratio, a bank factor and a single integral in the entry speed fraction."
cite = []
digest = "5250fefd12952de5"

[[equation]]
tag = 21
class = "standard"
title = "Geometric Series Expansion"
gloss = "The reciprocal of one minus $u$ expands as a geometric series that converges for $u$ below one."
cite = []
digest = "6c7fd019d3e5a49d"

[[equation]]
tag = 22
class = "standard"
title = "Logarithmic Moment Integral"
gloss = "Each term of the expanded integrand integrates to the reciprocal square of one more than its power."
cite = []
digest = "7376ef473b839b8e"

[[equation]]
tag = 23
class = "standard"
title = "Crossrange Integral at Circular Entry as the Basel Sum"
gloss = "For entry at circular speed the integral is the sum of reciprocal squares, which equals $\\pi^2/6$."
cite = []
digest = "2f7f61bb5eb31768"

[[equation]]
tag = 24
class = "standard"
title = "Double-Angle Identity for the Bank Factor"
gloss = "The product of the sine and cosine of the bank angle is half the sine of twice the angle."
cite = []
digest = "8bb0c79e26d7ad56"

[[equation]]
tag = 25
class = "standard"
title = "Stationarity Condition of the Bank Factor"
gloss = "The first derivative of the bank factor vanishes where the cosine of twice the bank is zero and the second derivative there is negative, so the point is a maximum."
cite = []
digest = "8e60f220a6cc8f6e"

[[equation]]
tag = 26
class = "standard"
title = "Optimum Bank Angle for Crossrange"
gloss = "Crossrange is maximised at a bank of 45 degrees, where the bank factor is one half, independent of the vehicle."
cite = []
digest = "19be66c7bb73124f"

[[equation]]
tag = 27
class = "standard"
title = "Maximum Crossrange of an Equilibrium Glide"
gloss = "Combining the optimum bank with the circular-entry integral gives a maximum crossrange equal to $\\pi^2/48$ of the Earth radius times the square of the lift-to-drag ratio."
cite = []
digest = "3255857049819822"

[[equation]]
tag = 28
class = "standard"
title = "Maximum Crossrange at a Lift-to-Drag Ratio of 1.2"
gloss = "At Martin's design ratio of 1.2 the closed form gives about 1,890 kilometres of crossrange from circular entry."
cite = []
digest = "8b7c27de38bc8cad"

[[equation]]
tag = 29
class = "bespoke"
title = "Bespoke Final Heading at the End of the Glide"
gloss = "Evaluating the heading solution at a glide end taken by the article as one percent of circular speed shows the heading passing half a turn for ratios near one."
cite = []
digest = "8263c62714abba22"

[[equation]]
tag = 30
class = "standard"
title = "Speed at Which the Heading Reaches Half a Turn"
gloss = "Lateral displacement stops accumulating where the sine of the heading returns to zero, which the logarithmic heading solution places at a speed exponentially small in the reciprocal of the ratio times the bank sine."
cite = []
digest = "b5b515af4e083fe9"

[[equation]]
tag = 31
class = "standard"
title = "Sidereal Rotation Rate of the Earth"
gloss = "The rotation rate relative to the fixed stars is two pi radians per sidereal day of 86,164 seconds."
cite = []
digest = "8b7734f345dff17d"

[[equation]]
tag = 32
class = "bespoke"
title = "Bespoke Ground Track Spacing in Longitude"
gloss = "The Earth turns through about 22.6 degrees in one orbit for a period the article takes as a nominal 90 minutes."
cite = []
digest = "bf4ca90d028fa3c8"

[[equation]]
tag = 33
class = "bespoke"
title = "Bespoke Ground Track Spacing at the Equator"
gloss = "The longitude spacing of the nominal 90 minute orbit becomes about 2,510 kilometres of ground distance at the equator."
cite = []
digest = "84c5b0c0ea6f292d"

[[equation]]
tag = 34
class = "bespoke"
title = "Bespoke Once-per-Orbit Crossrange Requirement"
gloss = "The article requires that any site be reached on one pass or the next, which sets the crossrange at half the equatorial track spacing of the nominal 90 minute orbit."
cite = []
digest = "31bc0ce96be8ce86"

[[equation]]
tag = 35
class = "bespoke"
title = "Bespoke Required Lift-to-Drag Ratio in Closed Form"
