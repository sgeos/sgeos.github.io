[[equation]]
tag = 38
class = "standard"
title = "Crossrange Ratio between the Disputed Lift-to-Drag Ratios"
gloss = "Because crossrange goes as the square of the ratio, the twenty percent difference between 1.2 and 1.0 becomes a forty-four percent difference in crossrange."
