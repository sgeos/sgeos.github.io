# Equation classification for A253. Read by `python3 _lib/equations.py`.

caution = "Losses and objectives are expectations over sampled transitions or trajectories, returns and values carry the units of the reward signal, and coefficients such as the discount factor, the clipping range and the entropy temperature are dimensionless hyperparameters whose values differ between the papers cited."

[[equation]]
tag = 1
class = "standard"
title = "Deep Q-Network Loss"
gloss = "The deep Q-network minimises the squared difference between its action value and a bootstrapped target computed with a slowly updated target network over transitions drawn from a replay buffer."
cite = ["research_mnih_et_al_2015"]
digest = "f051a13ab3ab38a1"

[[equation]]
tag = 2
class = "standard"
title = "Double Deep Q-Network Target"
gloss = "The online network selects the next action and the target network evaluates it, which reduces overestimation bias."
cite = ["research_van_hasselt_guez_silver_2016"]
digest = "d5cba59be1c22fd7"

[[equation]]
tag = 3
class = "standard"
title = "Dueling Network Aggregation"
gloss = "The action value is assembled from a state value stream and an advantage stream whose mean is subtracted so that the two are identifiable."
cite = ["research_wang_et_al_2016"]
digest = "46760014b63af5b7"

[[equation]]
tag = 4
class = "standard"
title = "Prioritised Replay Sampling Probability"
gloss = "A transition is sampled with probability proportional to its priority raised to an exponent that sets the strength of prioritisation."
cite = ["research_schaul_et_al_2016"]
digest = "f2c020d9579a0136"

[[equation]]
tag = 5
class = "standard"
title = "Prioritised Replay Importance Weights"
gloss = "Each sampled transition's gradient is weighted by the inverse of its sampling probability relative to uniform, raised to an annealed exponent."
cite = ["research_schaul_et_al_2016"]
digest = "e9f687e85c528471"

[[equation]]
tag = 6
class = "standard"
title = "Noisy Linear Layer"
gloss = "Each weight and bias is a learned mean plus a learned scale times sampled noise, which gives state-dependent exploration."
cite = ["research_fortunato_et_al_2018"]
digest = "aafad20b7cfbd786"

[[equation]]
tag = 7
class = "standard"
title = "Categorical Distributional Loss"
gloss = "The categorical algorithm minimises the Kullback-Leibler divergence from the projected distributional Bellman target to the predicted return distribution."
cite = ["research_bellemare_dabney_munos_2017"]
digest = "590cb615b67d13f2"

[[equation]]
tag = 8
class = "standard"
title = "Quantile Regression Loss"
gloss = "Quantile regression fits each output to its quantile level by an asymmetric loss summed over pairs of predicted and target quantiles."
cite = ["research_dabney_rowland_bellemare_munos_2018"]
digest = "3c546a11a23c7301"

[[equation]]
tag = 9
class = "standard"
title = "Implicit Quantile Function"
gloss = "Implicit quantile networks output the return quantile at any sampled level from a state encoding combined with an embedding of that level."
cite = ["research_dabney_ostrovski_silver_munos_2018"]
digest = "f46211ad49754002"

[[equation]]
tag = 10
class = "standard"
title = "Belief State"
gloss = "The belief state is the posterior probability of each hidden state given the history of observations and actions."
cite = []
digest = "aa0116f4272fe102"

[[equation]]
tag = 11
class = "standard"
title = "Self-Predictive Representation Loss"
gloss = "The encoder and a latent transition model are trained to predict projected future latent states, with gradients stopped through the target."
cite = ["research_schwarzer_et_al_2021"]
digest = "c64342162a53db10"

[[equation]]
tag = 12
class = "standard"
title = "Trust-Region Policy Optimisation Problem"
gloss = "Trust-region policy optimisation maximises an importance-weighted advantage surrogate subject to a bound on the mean Kullback-Leibler divergence from the old policy."
cite = ["research_schulman_levine_moritz_jordan_abbeel_2015"]
digest = "4b7c376829a3b06e"

[[equation]]
tag = 13
class = "standard"
title = "Clipped Surrogate Objective"
gloss = "Proximal policy optimisation takes the smaller of the ratio-weighted advantage and its clipped counterpart, which removes the incentive to move the ratio outside a band around one."
cite = ["research_schulman_wolski_dhariwal_radford_klimov_2017"]
digest = "bc29310397b0e7a6"

[[equation]]
tag = 14
class = "standard"
title = "Combined Proximal Policy Optimisation Objective"
gloss = "The full objective adds a value regression penalty and an entropy bonus to the clipped surrogate."
cite = ["research_schulman_wolski_dhariwal_radford_klimov_2017"]
digest = "417f6765c7c48cee"

[[equation]]
tag = 15
class = "standard"
title = "V-Trace Target"
gloss = "V-trace corrects the value estimate by temporal-difference errors weighted with truncated importance ratios, which tolerates lag between actor and learner policies."
cite = ["research_espeholt_et_al_2018"]
digest = "7ca54ec48ca9977b"

[[equation]]
tag = 16
class = "standard"
title = "Deep Deterministic Policy Gradient"
gloss = "The actor is updated by chaining its Jacobian with the action gradient of the learned critic at the action it outputs."
cite = ["research_lillicrap_et_al_2016"]
digest = "598ee85cb37dc079"

[[equation]]
tag = 17
class = "standard"
title = "Twin Delayed Target with Policy Smoothing"
gloss = "The target takes the minimum of two target critics evaluated at a target action perturbed by clipped Gaussian noise."
cite = ["research_fujimoto_hoof_meger_2018"]
digest = "f6990f4bd1d035ce"

[[equation]]
tag = 18
class = "standard"
title = "Maximum-Entropy Objective"
gloss = "Soft actor-critic maximises the discounted sum of reward plus a temperature times the entropy of the policy at each state."
cite = ["research_haarnoja_zhou_abbeel_levine_2018"]
digest = "a00d5d47eb6c79c9"

[[equation]]
tag = 19
class = "standard"
title = "Soft State Value"
gloss = "The soft state value is the expected action value less the temperature times the log probability of the action."
cite = ["research_haarnoja_zhou_abbeel_levine_2018"]
digest = "33360812c6dcc641"

[[equation]]
tag = 20
class = "standard"
title = "Soft Bellman Equation for Action Values"
gloss = "The soft action value is the expected reward plus the discounted soft value of the successor state."
cite = ["research_haarnoja_zhou_abbeel_levine_2018"]
digest = "5963abf5e6d04d0a"

[[equation]]
tag = 21
class = "standard"
title = "Reparameterised Gaussian Action"
gloss = "The action is a deterministic function of the state and independent standard normal noise, so gradients can pass through the sample."
cite = []
digest = "1bfce3d6b6ba465c"

[[equation]]
tag = 22
class = "standard"
title = "Automatic Entropy Temperature Loss"
gloss = "The temperature is adjusted by gradient descent so that the policy entropy is driven toward a target value."
cite = []
digest = "1ee89d9d2f552ef6"

[[equation]]
tag = 23
class = "standard"
title = "Soft Polyak Target Network Update"
gloss = "The target network parameters move a small fraction $\\tau$ of the way toward the online parameters at each step."
cite = []
digest = "c7c2b0d42d519fd1"

[[equation]]
tag = 24
class = "standard"
title = "Decision Transformer Factorisation"
gloss = "Decision Transformer models each action autoregressively given a recent window of states, actions and returns-to-go."
cite = ["research_chen_et_al_2021"]
digest = "3a59099f4d2dccd1"

[[equation]]
tag = 25
class = "standard"
title = "Predictor Upper Confidence Tree Selection Rule"
gloss = "Tree search selects the action maximising the mean value plus a bonus proportional to the network prior and to the square root of the parent visit count over one plus the action visit count."
cite = ["research_silver_et_al_2017"]
digest = "bdeea6d70a06a89e"

[[equation]]
tag = 26
class = "standard"
title = "AlphaGo Zero Training Loss"
gloss = "The dual-head network minimises the squared error of its value against the game outcome, the cross-entropy of its policy against the search policy and a weight penalty."
cite = ["research_silver_et_al_2017"]
digest = "4f71d236320687ed"

[[equation]]
tag = 27
class = "standard"
title = "MuZero Training Loss"
gloss = "MuZero sums over unrolled model steps the reward, value and policy errors of its learned model, plus a weight penalty."
cite = ["research_schrittwieser_et_al_2020"]
digest = "61f207cb76b2ea13"

[[equation]]
tag = 28
class = "standard"
title = "Monotonic Value Mixing"
gloss = "QMIX writes the joint action value as a state-conditioned mixing of the per-agent utilities with non-negative weights."
cite = ["research_rashid_et_al_2018"]
digest = "f024a28234387be4"

[[equation]]
tag = 29
class = "standard"
title = "Individual-Global Maximum Consistency"
gloss = "Monotonic mixing guarantees that the joint greedy action is the tuple of each agent's individually greedy action."
cite = ["research_rashid_et_al_2018"]
digest = "7b2361a8c68bfbbd"

[[equation]]
tag = 30
class = "standard"
title = "Bradley-Terry Preference Model"
gloss = "The probability that one completion is preferred to another is the logistic function of the difference in their learned rewards."
cite = []
digest = "af8f61a508d78f83"

[[equation]]
tag = 31
class = "standard"
title = "Reward Model Loss"
gloss = "The reward model minimises the negative log likelihood of the observed preferences under the Bradley-Terry model."
cite = []
digest = "5a9b47ae7dd707b8"

[[equation]]
tag = 32
class = "standard"
title = "Kullback-Leibler Regularised Fine-Tuning Objective"
gloss = "Reinforcement learning from human feedback, abbreviated RLHF, maximises the learned reward less a multiple of the divergence from the supervised reference model."
cite = []
digest = "659a3f251d8a3af2"

[[equation]]
tag = 33
class = "standard"
title = "Direct Preference Optimisation Loss"
gloss = "Direct preference optimisation fits the Bradley-Terry model with the reward replaced by the scaled log ratio of policy to reference probabilities."
cite = ["research_rafailov_et_al_2023"]
digest = "b349e64f73ab715d"

[[equation]]
tag = 34
class = "bespoke"
title = "Bespoke Saturating Power Law of Score Against Compute"
gloss = "The article summarises reinforcement learning compute scaling as a score approaching a ceiling with a power-law deficit in compute, a form it states as approximate and whose constants depend on the domain."
cite = ["research_hilton_et_al_2023"]
digest = "8ae1ffb0cff48851"

