tex = '\theta^{-}'
meaning = "the target network parameters"

[[symbol]]
tex = '\mathcal{D}'
meaning = "the experience replay buffer or preference dataset"

[[symbol]]
tex = 'Q_\theta(s, a)'
meaning = "the action value estimated by the online network"

[[symbol]]
tex = 'p_i'
meaning = "the replay priority of transition $i$, its absolute temporal-difference error plus a small constant"

[[symbol]]
tex = '\beta'
meaning = "the importance-weight annealing exponent in equation 5, the divergence penalty coefficient in equations 32 and 33 and a fitted exponent in equation 34"

[[symbol]]
tex = '\alpha'
meaning = "the prioritisation exponent in equation 4, the entropy temperature in equations 18 to 22 and a fitted constant in equation 34"

[[symbol]]
tex = '\rho_{\tau_i}'
meaning = "the quantile regression loss at level $\\tau_i$"

[[symbol]]
tex = 'b_t(s)'
meaning = "the belief state, a probability distribution over hidden states at step $t$"

[[symbol]]
tex = 'r_t(\theta)'
meaning = "the ratio of new to old policy probability for the action taken"

[[symbol]]
tex = '\hat{A}_t'
meaning = "the advantage estimate at step $t$"

[[symbol]]
tex = 'c_j'
meaning = "a truncated importance ratio in V-trace, with $\\rho_k$ the other"

[[symbol]]
tex = '\mu_\theta(s)'
meaning = "the deterministic actor or the mean of the Gaussian policy"

[[symbol]]
tex = '\bar{H}'
meaning = "the target entropy"

[[symbol]]
tex = '\hat{R}_{t-K:t}'
meaning = "the returns-to-go over the context window"

[[symbol]]
tex = 'c_{\text{puct}}'
meaning = "the exploration constant of tree search"

[[symbol]]
tex = '\boldsymbol{\pi}'
meaning = "the search policy derived from visit counts"

[[symbol]]
tex = 'Q_{\text{tot}}'
meaning = "the joint action value of all agents"

[[symbol]]
tex = 'R_\phi(x, y_w)'
meaning = "the learned reward of the preferred completion to a prompt"

[[symbol]]
tex = '\pi_{\text{SFT}}'
meaning = "the supervised fine-tuned reference model"

[[symbol]]
tex = 'C'
meaning = "the compute budget in equation 34"
