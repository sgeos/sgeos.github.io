[[equation]]
tag = 25
class = "bespoke"
title = "Bespoke Admissible Depth of Discharge for the Sixth Mission"
gloss = "The power law is anchored at an assumed reference of 30,000 cycles at 30 percent and evaluated at the extreme exponents of 1.5 and 3."
cite = []
digest = "f9dd1dfd763e4f1b"

[[equation]]
tag = 26
class = "standard"
title = "Drag Deceleration"
gloss = "The drag deceleration is the dynamic pressure times the drag coefficient and reference area over the mass."
