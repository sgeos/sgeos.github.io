# Equation classification for A334. Read by `python3 _lib/equations.py`.

caution = "All relations are evaluated in the International System, with altitudes and orbital radii quoted in kilometres and heat fluxes in watts per square centimetre in the tables, and the article's own notation table resolves the colliding symbols, so $\\mathcal{E}$ is the specific orbital energy while $\\varepsilon$ is the emissivity, $a$ is the semi-major axis, $\\delta$ is the depth of discharge while $\\delta_{\\odot}$ is the solar declination, $T$ is the orbital period while every temperature carries a subscript, and $N_{\\text{orb}}$ and $N_{\\text{cyc}}$ are counted separately though shown to coincide."

[[equation]]
tag = 1
class = "standard"
title = "Specific Energy of a Keplerian Orbit"
gloss = "The specific orbital energy is the kinetic less the potential energy per unit mass and depends only on the semi-major axis."
cite = []
digest = "71d2680d7450bb3c"

[[equation]]
tag = 2
class = "standard"
title = "Reciprocals of the Published Scale Factors"
gloss = "The reciprocal of the 80 percent figure is 1.25 and that of the 120 percent figure is 0.833, so the two published ratios are not reciprocals of each other."
cite = ["ref_x37"]
digest = "607d53094ea4a5de"

[[equation]]
tag = 3
class = "standard"
title = "Period of a Circular Orbit"
gloss = "The period of a circular orbit is two pi times the square root of the cube of the radius over the gravitational parameter."
cite = ["ref_orbital_period"]
digest = "809a8c2464f1f036"

[[equation]]
tag = 4
class = "standard"
title = "Circular Orbital Speed"
gloss = "The circular speed is the square root of the gravitational parameter over the radius."
cite = ["ref_orbital_period"]
digest = "dce458f629828ced"

[[equation]]
tag = 5
class = "standard"
title = "Eclipse Fraction of a Circular Orbit in a Cylindrical Shadow"
gloss = "Treating the shadow as a cylinder, which neglects the penumbra, the fraction of the orbit in eclipse follows from the radius, the Earth radius and the beta angle."
cite = ["ref_beta_angle"]
digest = "f9ba540742d7d817"

[[equation]]
tag = 6
class = "standard"
title = "Beta Angle Above Which Eclipse Vanishes"
gloss = "The eclipse vanishes when the beta angle exceeds the inverse sine of the Earth radius over the orbital radius."
cite = ["ref_beta_angle"]
digest = "ade60dcb847c4f11"

[[equation]]
tag = 7
class = "standard"
title = "Largest Reachable Beta Angle"
gloss = "The largest beta angle at an inclination is the inclination plus the obliquity of the ecliptic, which for the catalogued inclinations stays below the full-sun threshold."
cite = ["ref_gcat"]
digest = "c93e5dc22bdaf7d5"

[[equation]]
tag = 8
class = "bespoke"
title = "Bespoke Mean Eclipse Fraction Over Node and Season"
gloss = "The eclipse fraction is averaged over a uniform grid of 720 node positions and 60 solar longitudes, a sampling the article constructs."
cite = []
digest = "f4130a8299b079af"

[[equation]]
tag = 9
class = "standard"
title = "Nodal Regression Due to the Second Zonal Harmonic"
gloss = "The dominant secular effect of the Earth's oblateness regresses the ascending node of a near-circular orbit at a rate set by the second zonal harmonic, the radius and the inclination."
cite = []
digest = "d5741ce23a53ee4a"

[[equation]]
tag = 10
class = "standard"
title = "Beta Angle From the Sun Vector and Orbit Normal"
gloss = "The sine of the beta angle follows from the solar declination and right ascension, the inclination and the node."
cite = []
digest = "bd9339b2abe75a9d"

[[equation]]
tag = 11
class = "standard"
title = "Beat Period of the Beta Angle"
gloss = "The beta angle geometry repeats at the beat between the nodal regression and the Sun's annual motion."
cite = []
digest = "b6e97f9046f700f2"

[[equation]]
tag = 12
class = "bespoke"
title = "Bespoke Orbit Count of the Sixth Mission"
gloss = "The published mission duration over the period of a circular orbit at 400 kilometres, the representative altitude the article takes for the catalogued orbit, gives 14,140 orbits."
cite = []
digest = "c4911d76816ff9d5"

[[equation]]
tag = 13
class = "standard"
title = "Planform Area of the Payload Bay"
gloss = "The published bay dimensions of 2.1 by 1.2 metres give 2.52 square metres."
cite = ["ref_x37"]
digest = "00963115acf5c7f0"

[[equation]]
tag = 14
class = "standard"
title = "Power of a Sun-Pointed Array"
gloss = "A sun-pointed array generates the solar constant times its area times the cell efficiency times the packing factor."
cite = []
digest = "010e0a1bf990245e"

[[equation]]
tag = 15
class = "standard"
title = "Array to Load Power Ratio With Eclipse Recharge"
gloss = "An array carrying a continuous load must also recharge the battery in sunlight, so its power exceeds the load by a term in the eclipse fraction and the charge and discharge efficiencies."
cite = []
digest = "0b319d787b6ef1bf"

[[equation]]
tag = 16
class = "bespoke"
title = "Bespoke Continuous Load Supported by a Six Square Metre Array"
gloss = "The load is evaluated for an assumed array of six square metres, cell efficiency of 0.30, packing factor of 0.85 and charge and discharge efficiencies of 0.90."
cite = []
digest = "015a0ca156389090"

[[equation]]
tag = 17
class = "standard"
title = "Net Radiative Flux From a Radiator"
gloss = "A radiator rejects its emissivity times the Stefan-Boltzmann constant times the difference of the fourth powers of its temperature and the sink temperature."
