cite = []
digest = "d448b51de0fb81ec"

[[equation]]
tag = 20
class = "bespoke"
title = "Bespoke Heat Rejected by the Payload Bay Doors"
gloss = "The door rejection uses an assumed emissivity of 0.85, a sink temperature from an assumed view factor of one half, and assumed radiator temperatures of 20 and 40 degrees Celsius."
cite = []
digest = "539b78513ddf966c"

[[equation]]
tag = 21
class = "standard"
title = "Battery Energy Drawn in One Eclipse"
gloss = "The energy drawn from the battery is the load times the eclipse duration over the discharge efficiency."
cite = []
digest = "e354578e30ae6eb2"

[[equation]]
tag = 22
class = "standard"
title = "Installed Capacity and Battery Mass"
gloss = "The installed capacity is the energy drawn over the depth of discharge, and the mass is that capacity over the cell specific energy."
cite = []
digest = "910c365b8fb0dff0"

[[equation]]
tag = 23
class = "standard"
title = "Inverse Power Law of Cycle Life"
gloss = "The standard empirical form for a secondary cell in low Earth orbit makes cycle life inversely proportional to a power of the depth of discharge."
