digest = "fa80c8ee32ca3943"

[[equation]]
tag = 18
class = "standard"
title = "Effective Sink Temperature Near the Earth"
gloss = "The sink temperature follows from the balance of emitted radiation against absorbed outgoing longwave flux and reflected sunlight over the view factor to the Earth."
cite = ["ref_stefan_boltzmann"]
digest = "418869903faa52e8"

[[equation]]
tag = 19
class = "standard"
title = "Radiator Area for a Given Dissipation"
