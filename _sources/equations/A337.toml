digest = "fe41a4a212908bed"

[[equation]]
tag = 61
class = "standard"
title = "Mean Rollout Deceleration"
gloss = "The published rollout of about 7,000 feet gives the mean deceleration as the touchdown speed squared over 14,000 feet."
