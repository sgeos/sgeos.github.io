# Equation classification for A337. Read by `python3 _lib/equations.py`.

caution = "The flight relations are evaluated in customary units, with lengths in feet, weights in pounds, masses in slugs and speeds in feet per second, subscripts $m$ and $f$ mark the X-40A model and the full-scale X-37, and several letters are reused, so $\\mu$ is the dynamic viscosity in the Reynolds number but the relative density from the similarity parameter onward, $\\theta$ is a pitch angle in the angular acceleration relation and the angle subtended by the landing error after it, and $s$ is a gear stroke and then a rollout distance."

[[equation]]
tag = 1
class = "standard"
title = "Weight Ratio of the X-40A to the Ballasted Orbiter"
gloss = "The published X-40A weight over the approximately 150,000 pounds of the ballasted orbiter gives a ratio below one fiftieth."
cite = ["ref_boeing_1998", "research_alt_final_1978"]
digest = "ed4edb72b4e45e99"

[[equation]]
tag = 2
class = "standard"
title = "Froude Number"
gloss = "The Froude number compares inertial to gravitational force."
cite = ["research_chambers_2010"]
digest = "fd9d18eda5c8e064"

[[equation]]
tag = 3
class = "standard"
title = "Reynolds Number"
gloss = "The Reynolds number compares inertial to viscous force and governs the boundary layer."
cite = []
digest = "8f8b27a65283cbfd"

[[equation]]
tag = 4
class = "standard"
title = "Froude Similarity Requirement"
gloss = "Similarity requires the model and the full-scale vehicle to share a Froude number."
cite = []
digest = "44965c0c94371aa3"

[[equation]]
tag = 5
class = "standard"
title = "Speed Ratio Under Froude Similarity"
gloss = "Since gravity is common to both, the speed ratio is the square root of the length ratio."
cite = []
digest = "ef1a4556baa360f7"

[[equation]]
tag = 6
class = "standard"
title = "Time Ratio Under Froude Similarity"
gloss = "A length divided by a speed is a time, so the time ratio is also the square root of the length ratio."
cite = []
digest = "ccf8a252507687fd"

[[equation]]
tag = 7
class = "standard"
title = "Angular Rate Ratio Under Froude Similarity"
gloss = "Angular rates scale as the inverse square root of the length ratio and therefore rise in the model."
cite = []
digest = "85709bd6639803ae"

[[equation]]
tag = 8
class = "standard"
title = "Reynolds Number Ratio in Common Air"
gloss = "Substituting the Froude-matched speed into the Reynolds number with density and viscosity common gives the product of the speed and length ratios."
cite = []
digest = "ad0fc5ca21d217ef"

[[equation]]
tag = 9
class = "standard"
title = "Reynolds Number Ratio as a Power of Scale"
gloss = "The Reynolds number ratio under Froude similarity in common air is the length ratio to the three-halves power."
cite = []
digest = "cb3d6fbde852cc6c"

[[equation]]
tag = 10
class = "standard"
title = "Mach Number Ratio Under Froude Similarity"
gloss = "With the speed of sound common the Mach number ratio equals the speed ratio."
cite = []
digest = "2295781dd23c585d"

[[equation]]
tag = 11
class = "standard"
title = "Dynamic Pressure Ratio Under Froude Similarity"
gloss = "With density common the dynamic pressure scales linearly with the length ratio."
cite = []
digest = "32dfd0bcb4e54c38"

[[equation]]
tag = 12
class = "standard"
title = "Weight Ratio Under Froude Similarity"
gloss = "Equal relative density requires the model weight to scale as the cube of the length ratio."
cite = []
digest = "43daee961ca8f389"

[[equation]]
tag = 13
class = "standard"
title = "Wing Loading Ratio Under Froude Similarity"
gloss = "Weight scaling as the cube and area as the square of the length ratio make the wing loading scale linearly."
cite = []
digest = "fa8bd929b3dabc6c"

[[equation]]
tag = 14
class = "standard"
title = "Inertia Ratio Under Mass Similarity"
gloss = "A moment of inertia is a mass times a length squared, so under mass similarity it scales as the fifth power of the length ratio."
cite = []
digest = "331a55e7c72fefe0"

[[equation]]
tag = 15
class = "standard"
title = "Relative Density"
gloss = "The relative density compares the vehicle's mass to the mass of air in a volume defined by its reference area and length."
cite = ["research_chambers_2010"]
digest = "b6d32f57b510ab9d"

[[equation]]
tag = 16
class = "standard"
title = "Relative Density Similarity Condition"
gloss = "Dynamic similarity of a free-flight model holds when the relative densities of model and full-scale vehicle match."
cite = ["research_chambers_2010"]
digest = "fbe613e0527ef694"

[[equation]]
tag = 17
class = "standard"
title = "Length Ratio From the Published Lengths"
gloss = "The published lengths of the X-40A and X-37B give a length ratio of 0.752."
cite = ["ref_boeing_1998", "ref_x37"]
digest = "8c37fb8a8bcc464d"

[[equation]]
tag = 18
class = "standard"
title = "Span Ratio From the Published Spans"
gloss = "The published spans give a span ratio of 0.804."
cite = ["ref_boeing_1998", "ref_x37"]
digest = "9349c1c5b294d4ef"

[[equation]]
tag = 19
class = "bespoke"
title = "Bespoke Reciprocal of the Mean Scale Ratio"
gloss = "The scale ratio is taken as 0.778, the mean of the length and span ratios, and its reciprocal is checked against the published figure of about 120 percent."
cite = ["ref_x37"]
digest = "3287c6391e8041da"

[[equation]]
tag = 20
class = "bespoke"
title = "Bespoke Dynamically Similar Model Weight"
