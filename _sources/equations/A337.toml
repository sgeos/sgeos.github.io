digest = "8b75ab1b12c26d1b"

[[equation]]
tag = 64
class = "standard"
title = "Ratio of Release Energies"
gloss = "With release from a hover the energies of the 2001 and 1998 releases stand in the ratio of their published altitudes, 1.672."
