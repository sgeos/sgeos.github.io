cite = []
digest = "ec1ae8826d2e0c4b"

[[equation]]
tag = 29
class = "standard"
title = "Reynolds Number Ratio of a 22 Percent Drop Model"
gloss = "At the published 22 percent scale of the F/A-18E/F drop model the same relation gives about a tenth of full scale."
cite = ["research_croom_2000"]
digest = "a039f5a808224a25"

[[equation]]
tag = 30
class = "bespoke"
title = "Bespoke Absolute Reynolds Number of the X-40A"
