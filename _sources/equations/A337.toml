digest = "3037dc6460d7490c"

[[equation]]
tag = 59
class = "standard"
title = "Mean Deceleration Over a Stroke"
gloss = "A sink rate arrested over a gear stroke imposes a mean deceleration of the sink rate squared over twice the stroke."
