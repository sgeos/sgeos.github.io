cite = ["ref_boeing_1998", "ref_x37"]
digest = "c99a50e40c6ac6f2"

[[equation]]
tag = 22
class = "bespoke"
title = "Bespoke Wing Loadings of Model and Full-Scale Vehicle"
gloss = "The wing loadings use an estimated X-40A reference area of 100 square feet and its scaling by the square of the mean scale ratio to 165 square feet."
cite = []
digest = "6ece747b6a2a95db"

[[equation]]
tag = 23
class = "bespoke"
title = "Bespoke Wing Loading Ratio Against the Requirement"
