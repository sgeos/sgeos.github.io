digest = "0be78e827c41a1d4"

[[equation]]
tag = 60
class = "bespoke"
title = "Bespoke Gear Deceleration at Touchdown"
gloss = "A representative touchdown sink rate of three feet per second into an assumed six inch stroke gives about 0.28 times standard gravity."
