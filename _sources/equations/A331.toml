cite = []
digest = "84d5ba49b6517b51"

[[equation]]
tag = 20
class = "standard"
title = "Specific Impulse as Thrust Coefficient Times Characteristic Velocity"
gloss = "The specific impulse factors into the thrust coefficient, which describes the nozzle, and the characteristic velocity, which describes the chamber, divided by standard gravity."
cite = []
digest = "a7c7ff39b80347a4"

[[equation]]
tag = 21
class = "standard"
title = "Exit Area From the Area Ratio"
