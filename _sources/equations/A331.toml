# Equation classification for A331. Read by `python3 _lib/equations.py`.

caution = "Weights are quoted in pounds and evaluated in kilograms, every relation is worked in the International System with specific impulse in seconds, and several letters are reused, so $m_f$ is the burnout mass in the rocket equation but the fuel mass in the mixture ratio relation, $t$ is a wall thickness while $t_b$ is the burn time, $e$ is a specific energy, $\\mu$ is the gas viscosity in the Bartz correlation, and $\\varepsilon$ is the nozzle area ratio."

[[equation]]
tag = 1
class = "standard"
title = "Definition of Specific Impulse"
gloss = "The specific impulse is the thrust divided by the propellant mass flow and standard gravity."
cite = ["ref_isp", "book_rocket_propulsion_elements"]
digest = "7142d9531f756342"

[[equation]]
tag = 2
class = "standard"
title = "Specific Impulse Implied by the Usually Quoted Figures"
gloss = "Putting the usually quoted thrust and mass flow through the definition gives 296.14 seconds, 5.69 percent below the quoted 314."
cite = ["ref_fastrac"]
digest = "1f0acf779ce64de2"

[[equation]]
tag = 3
class = "standard"
title = "Total Engine Mass Flow"
gloss = "The main chamber and gas generator flows published in the engine schematic sum to 202.6 pounds per second, which is the quoted 91.90 kilograms per second."
cite = ["research_ballardrichardo_olivetim_2000"]
digest = "ba5a93fcb7f680da"

[[equation]]
tag = 4
class = "standard"
title = "Specific Impulse of Each Nozzle on Its Own Thrust"
gloss = "Each nozzle's published thrust over the total flow closes on its own published impulse to within half a percent, so the quoted set paired the ground nozzle's thrust with the flight nozzle's impulse."
cite = ["research_ballardrichardo_olivetim_2000"]
digest = "e163c2c27e964433"

[[equation]]
tag = 5
class = "standard"
title = "Gas Generator Share of the Flow"
gloss = "The published gas generator flow is 3.50 percent of the total, inside the range of three to seven percent that the cycle typically spends."
cite = ["research_ballardrichardo_olivetim_2000", "book_design_of_liquid_propellant_rocket_eng"]
digest = "a6f8fe76e6d5a46f"

[[equation]]
tag = 6
class = "bespoke"
title = "Bespoke Chamber Specific Impulse With No Turbine Thrust"
gloss = "The flight thrust is divided by the chamber flow alone on the assumption that the turbine exhaust contributes no thrust."
cite = ["book_design_of_liquid_propellant_rocket_eng"]
digest = "c264119bd0da238d"

[[equation]]
tag = 7
class = "bespoke"
title = "Bespoke Impulse Cost of the Gas Generator Cycle"
gloss = "The difference between the chamber and engine impulses rests on the same assumption of a thrustless turbine exhaust and is therefore an upper bound."
cite = []
digest = "7f112de29c6466cd"

[[equation]]
tag = 8
class = "standard"
title = "Burn Time of the Propellant Load"
gloss = "The published propellant load divided by the engine flow gives a burn time of 148.0 seconds."
cite = []
digest = "452afa3c2143a0ea"

[[equation]]
tag = 9
class = "standard"
title = "Margin of the Longest Test Over the Mission Burn"
gloss = "The longest recorded hot fire of 159.03 seconds exceeds the mission burn by about seven and a half percent."
cite = ["research_ballardrichardo_olivetim_2000"]
digest = "a9bde76d5c85723f"

[[equation]]
tag = 10
class = "standard"
title = "Effective Exhaust Velocity"
gloss = "The published flight impulse times standard gravity gives an effective exhaust velocity of 3,079.3 metres per second."
cite = []
digest = "16d8679683a292e8"

[[equation]]
tag = 11
class = "standard"
title = "Mass Ratio From the Published Masses"
gloss = "The release mass over the empty mass taken as the burnout mass gives a mass ratio of 2.6585."
cite = []
digest = "d415bd1af8ade7d8"

[[equation]]
tag = 12
class = "standard"
title = "Tsiolkovsky Rocket Equation Evaluated for the X-34"
gloss = "The effective exhaust velocity times the logarithm of the mass ratio gives an ideal velocity increment of 3,010.9 metres per second."
cite = []
digest = "69c16d8d9ed29719"

[[equation]]
tag = 13
class = "bespoke"
title = "Bespoke Allowance Left for Losses"
