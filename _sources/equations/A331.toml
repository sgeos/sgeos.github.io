[[equation]]
tag = 22
class = "standard"
title = "Bartz Correlation for Gas-Side Heat Transfer"
gloss = "The Bartz correlation gives the gas-side heat transfer coefficient at the throat from the gas properties, the chamber pressure, the characteristic velocity and the throat geometry."
