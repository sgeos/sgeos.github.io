digest = "555144fcc5872d69"

[[equation]]
tag = 23
class = "bespoke"
title = "Bespoke Throat Heat Flux"
gloss = "The convective flux is evaluated with a coefficient from typical kerosene and oxygen gas properties and a throat curvature radius equal to its diameter, a recovery temperature of 3,150 kelvin and an ablating surface at 1,900 kelvin, all values the article assumes."
