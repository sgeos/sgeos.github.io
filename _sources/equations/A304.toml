digest = "f1edbc99d9f6117c"

[[equation]]
tag = 40
class = "standard"
title = "Exhaust Speed Ratio and Specific Thrust of an Ideal Ramjet"
gloss = "For an ideal ramjet with fully expanded flow and negligible fuel mass the exhaust speed exceeds the flight speed by the square root of the combustor temperature ratio, which fixes the thrust per unit of air."
