[[equation]]
tag = 38
class = "bespoke"
title = "Bespoke Time Constant of the X-7 Skin"
gloss = "The time constant is evaluated for a 1.5 millimetre steel skin and a convective coefficient of 300 watts per square metre kelvin, values the article assumes for the vehicle."
cite = []
digest = "bbd4cab1fedac297"

[[equation]]
tag = 39
class = "bespoke"
title = "Bespoke Temperature Rise Available to the Combustor"
gloss = "The combustion temperature rise is the difference between a combustor limit of 2000 kelvin, taken as representative of materials of the period, and the inlet stagnation temperature."
