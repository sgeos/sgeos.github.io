class = "standard"
title = "Isolator Length Scaling"
gloss = "The length an isolator needs to contain a shock train scales with the pressure rise it must hold and inversely with the square root of the incoming momentum thickness ratio."
cite = []
digest = "3aa459c8048bf7dc"

[[equation]]
tag = 92
class = "bespoke"
title = "Bespoke Residence Time in a Scramjet Combustor"
gloss = "The residence time is a combustor length of one metre divided by a supersonic combustor speed of 1500 metres per second, values the article assumes."
cite = []
digest = "1c490e202c7e53ec"

[[equation]]
tag = 93
class = "bespoke"
title = "Bespoke Handover Condition of a Combined Cycle"
gloss = "The article defines the handover Mach number of a combined-cycle engine as the speed at which the low-speed cycle and the ramjet deliver equal thrust."
cite = []
digest = "5f9df01b1e38e18f"

[[equation]]
tag = 94
class = "bespoke"
title = "Bespoke Thrust Pinch at Handover"
gloss = "The article argues that the total thrust passes through a local minimum at the handover, where both cycles are weak, which is the pinch a combined-cycle vehicle must design around."
cite = []
digest = "e47c3d76f715c85f"

