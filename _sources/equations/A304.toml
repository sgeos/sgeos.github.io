digest = "e30934cf28e66898"

[[equation]]
tag = 37
class = "standard"
title = "Thermal Time Constant of a Thin Skin"
gloss = "The time constant of the lumped skin is its heat capacity per unit area divided by the convective heat transfer coefficient."
