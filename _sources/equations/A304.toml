# Equation classification for A304. Read by `python3 _lib/equations.py`.

caution = "Speeds are in metres per second, temperatures in kelvin and pressures in pascals unless a line states otherwise, the ratio of specific heats is 1.4 for air throughout, and several symbols carry two meanings in different sections, so $\\gamma$, $\\beta$, $f$, $R$ and $\\lambda$ must be read against the notation key below."

[[equation]]
tag = 1
class = "standard"
title = "Variance of a Regression Prediction"
gloss = "The variance of a least-squares prediction at a point $x^{*}$ is the process variance times a term that is smallest at the centroid of the data and grows with the square of the distance beyond it."
cite = []
digest = "6ec5a569b8da2f07"

[[equation]]
tag = 2
class = "standard"
title = "Prediction Interval for a Future Observation"
gloss = "The interval for a single future observation adds the process variance to the variance of the fitted value and scales the result by the Student t quantile with $n - 2$ degrees of freedom."
cite = []
digest = "8d1ecaa65c730966"

[[equation]]
tag = 3
class = "bespoke"
title = "Bespoke Standard Error at a Sample Size Set by Budget"
gloss = "The standard error of a mean falls as the inverse square root of the sample, and the article sets the sample by dividing a fixed programme budget by the unit cost of a vehicle."
cite = []
digest = "b3b62213d80b82bd"

[[equation]]
tag = 4
class = "bespoke"
title = "Bespoke Precision Ratio of Expendable and Crewed Programmes"
gloss = "Under equal budgets an expendable vehicle costing a fraction $k$ of a crewed one buys proportionally more flights, so its standard error is smaller by the square root of that fraction."
cite = []
digest = "fc6709ba1dc8761c"

[[equation]]
tag = 5
class = "standard"
title = "Fisher Information About a Regression Slope"
gloss = "The information a sample carries about the slope of a linear model is the sum of squared distances of the sampled points from their centroid divided by the process variance."
cite = []
digest = "64af376e9ee5042d"

[[equation]]
tag = 6
class = "bespoke"
title = "Bespoke Expected Cost of a Test Point"
gloss = "The article models the expected cost of a test point as a fixed flight cost plus the vehicle cost weighted by a loss probability that rises toward the boundary."
cite = []
digest = "15d958ddc77bacea"

[[equation]]
tag = 7
class = "bespoke"
title = "Bespoke Stopping Condition for Approaching a Limit"
gloss = "A programme is taken to advance toward the boundary until the marginal information gained equals a price $\\lambda$ times the marginal expected loss of the vehicle, a balance the article constructs to show why a crewed programme stops short."
cite = []
digest = "04bb2a2a6e1d2cae"

[[equation]]
tag = 8
class = "standard"
title = "Fineness Ratio of the X-7A-1"
gloss = "The length divided by the body diameter of the published configuration gives a fineness ratio near twenty."
cite = ["ref_lockheed_x7"]
digest = "f680fbf1c239faeb"

[[equation]]
tag = 9
class = "standard"
title = "Frontal Reference Area"
gloss = "The frontal area of the circular body follows from its published diameter."
cite = ["ref_lockheed_x7"]
digest = "bfd8221facd997a9"

[[equation]]
tag = 10
class = "bespoke"
title = "Bespoke Ballistic Coefficient of the Launch Configuration"
gloss = "The launch mass divided by the drag area gives the ballistic coefficient under a drag coefficient of 0.4 that the article assumes for the body."
cite = ["ref_lockheed_x7"]
digest = "3aeb22771ef31981"

[[equation]]
tag = 11
class = "standard"
title = "Isentropic Stagnation Pressure and Temperature Ratios"
gloss = "Decelerating a perfect gas isentropically to rest raises its pressure and temperature by ratios that depend on the Mach number and the ratio of specific heats alone."
cite = ["ref_isentropic"]
digest = "012d840e6bdec2e2"

[[equation]]
tag = 12
class = "standard"
title = "Ram Pressure Ratio at Mach 0, 2 and 4"
gloss = "Evaluating the isentropic pressure ratio for air shows that a ramjet has no compression at rest and a compression of about one hundred and fifty to one at Mach 4."
cite = ["ref_isentropic"]
digest = "fef435397a3527af"

[[equation]]
tag = 13
class = "standard"
title = "Ideal Brayton Efficiency of a Ramjet"
gloss = "The thermal efficiency of an ideal Brayton cycle depends only on the temperature ratio of its compression, which for a ramjet is the stagnation temperature ratio of the flight Mach number."
cite = []
digest = "157fff21fb7df2a4"

[[equation]]
tag = 14
class = "bespoke"
title = "Bespoke Release Mach Number from the Carrier"
gloss = "The release Mach number divides an assumed carrier speed of 134 metres per second by the speed of sound near 10 kilometres."
cite = []
digest = "b9a87db0460b66d3"

[[equation]]
tag = 15
class = "standard"
title = "Total Impulse of the Booster"
gloss = "The total impulse of the solid booster is its published thrust multiplied by its published burn time."
cite = ["ref_ds_aqm60"]
digest = "6de2fd176c60b379"

[[equation]]
tag = 16
class = "bespoke"
title = "Bespoke Booster Velocity Increment at a Mean Mass"
gloss = "The increment is estimated as the total impulse divided by a mean vehicle mass of 3250 kilogrammes, an approximation the article uses in place of the rocket equation."
cite = []
digest = "d9ef59d6f498b238"

[[equation]]
tag = 17
class = "standard"
title = "Gravity Loss During a Boost"
gloss = "The component of gravity along a path inclined at a constant angle $\\gamma$ to the horizontal removes speed at a steady rate over the burn."
cite = []
digest = "a880bc85f5a30206"

[[equation]]
tag = 18
class = "standard"
title = "Dynamic Pressure at Burnout"
gloss = "Half the air density times the square of the speed gives the dynamic pressure at 10 kilometres and about 710 metres per second."
cite = []
digest = "452b889961b20f22"

[[equation]]
tag = 19
class = "standard"
title = "Drag at Burnout"
gloss = "The drag is the dynamic pressure times the drag area of the body."
cite = []
digest = "4f4ceb32920627df"

[[equation]]
tag = 20
class = "bespoke"
title = "Bespoke Upper Bound on the Drag Loss"
gloss = "Applying the burnout drag to the launch mass for the whole burn bounds the speed lost to drag from above, a deliberately pessimistic construction the article adopts."
cite = []
digest = "98c51f4056262c4d"

[[equation]]
tag = 21
class = "standard"
title = "Mach Number at Booster Burnout"
gloss = "The release speed plus the booster increment divided by the local speed of sound gives the Mach number at which the ramjet takes over."
cite = []
digest = "79b3e660ce4835b7"

[[equation]]
tag = 22
class = "standard"
title = "Acceleration Under Booster Thrust"
gloss = "Newton's second law applied to the booster thrust and the launch mass gives an acceleration of about thirteen times gravity."
cite = []
digest = "c3e8ebd256d6b52f"

[[equation]]
tag = 23
class = "standard"
title = "Acceleration in Terms of Impulse and Burn Time"
gloss = "At constant thrust the acceleration equals the total impulse divided by the mass and the burn time, so a fixed impulse delivered more slowly gives a smaller acceleration."
cite = []
digest = "01e01eb4db5e41bf"

[[equation]]
tag = 24
class = "bespoke"
title = "Bespoke Minimum Burn Time for a Crewed Vehicle"
gloss = "The booster impulse delivered at no more than 6 g, a sustained tolerance the article assumes for a seated and restrained pilot, fixes the shortest acceptable burn."
cite = []
digest = "436118dcef68ad49"

[[equation]]
tag = 25
class = "standard"
title = "Total Pressure Ratio Across a Normal Shock"
gloss = "The Rankine and Hugoniot relations give the fraction of total pressure that survives a normal shock as a function of the upstream Mach number."
cite = ["ref_normal_shock"]
digest = "b018ac818410dcdf"

[[equation]]
tag = 26
class = "standard"
title = "Normal Shock Recovery at Mach 2, 3 and 4.31"
gloss = "Evaluating the normal shock relation for air shows that a single normal shock at Mach 4.31 keeps about a tenth of the total pressure."
cite = ["ref_normal_shock"]
digest = "9ba164d92b774afe"

[[equation]]
tag = 27
class = "standard"
title = "Normal Component of an Oblique Shock"
gloss = "An oblique shock acts on the component of the upstream Mach number perpendicular to the wave, which is the Mach number times the sine of the wave angle."
cite = ["ref_oblique_shock"]
digest = "85418836780d39a0"

[[equation]]
tag = 28
class = "standard"
title = "Theta Beta Mach Relation"
gloss = "The flow deflection behind an oblique shock is fixed by the wave angle, the upstream Mach number and the ratio of specific heats."
cite = ["ref_oblique_shock"]
digest = "9bd85b9e838bafc8"

[[equation]]
tag = 29
class = "standard"
title = "Mach Number Behind an Oblique Shock"
gloss = "The downstream Mach number follows from the normal shock relation applied to the normal component and the turn of the flow through the wave."
cite = ["ref_oblique_shock"]
digest = "33ad7e558109497f"

[[equation]]
tag = 30
class = "standard"
title = "Total Pressure Recovery of a Shock System"
gloss = "The total pressure recovery of a sequence of shocks is the product of the recoveries across each of them."
cite = []
digest = "9969d208cde12ec5"

[[equation]]
tag = 31
class = "standard"
title = "Recovery of One Oblique and One Normal Shock"
gloss = "At Mach 4.31 a 20 degree oblique shock followed by a normal shock recovers about a quarter of the total pressure."
cite = []
digest = "7355fc37b0f67dff"

[[equation]]
tag = 32
class = "standard"
title = "Recovery of Two Oblique Shocks and a Normal Shock"
gloss = "At Mach 4.31 two 16 degree oblique shocks followed by a terminal normal shock recover about forty percent of the total pressure."
cite = []
digest = "b6707d06cb4cf59f"

[[equation]]
tag = 33
class = "standard"
title = "Stagnation Temperature at Mach 4.31"
gloss = "The stagnation temperature relation evaluated in the isothermal layer of the standard atmosphere near 18 kilometres gives about 1022 kelvin."
cite = ["ref_isa"]
digest = "84a5b1abfd3a7fb3"

[[equation]]
tag = 34
class = "standard"
title = "Recovery Temperature Under a Turbulent Boundary Layer"
gloss = "A turbulent boundary layer recovers a fraction of the stagnation temperature rise equal to the recovery factor, which is about the cube root of the Prandtl number."
cite = ["research_stalder_1950", "research_tucker_1951", "research_esgar_1951"]
digest = "9ed55408d72d27d6"

[[equation]]
tag = 35
class = "standard"
title = "Skin Recovery Temperature at Mach 4.31"
gloss = "The turbulent recovery temperature at the record condition is about 933 kelvin, which rules out aluminium."
cite = []
digest = "08f042379d96545c"

[[equation]]
tag = 36
class = "standard"
title = "Lumped Heat Balance of a Thin Skin"
gloss = "A skin thin enough to have a uniform temperature stores the convective heat it receives from the boundary layer, so its temperature approaches the recovery temperature at a rate proportional to the difference."
