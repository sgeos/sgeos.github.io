digest = "cdd492a02eda1e49"

[[equation]]
tag = 41
class = "standard"
title = "Specific Thrust at Mach 2, 3 and 4"
gloss = "Evaluating the ideal specific thrust at the 2000 kelvin limit shows the thrust per unit of air falling by about two thirds across the range."
