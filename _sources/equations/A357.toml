# Equation classification for A357. Read by `python3 _lib/equations.py`.

caution = "Pressures are in pascals except where the published dynamic pressure is quoted in pounds per square foot, speeds are in metres per second, masses in kilograms, thrusts in newtons and costs in dollars, altitudes are geometric or geopotential as the symbol table distinguishes, and every figure taken from the integrated ascent rests on a commanded pitch programme, an interpolated drag coefficient and an assumed specific impulse rather than on a published trajectory."

[[equation]]
tag = 1
class = "standard"
title = "Inlet Air Mass Flow"
gloss = "The mass flow an inlet of given capture area swallows is the density times the speed times the area, or twice the dynamic pressure over the speed times the area."
cite = []
digest = "2547e2669ac23a3b"

[[equation]]
tag = 2
class = "bespoke"
title = "Bespoke Captured Mass Flux at Mach 6 Mid-Band"
gloss = "The mass flux per unit capture area is evaluated at 1,500 pounds per square foot, the midpoint the article takes of the one to two thousand band, with the Mach 6 speed scaled from the Mach 5 corridor speed."
cite = []
digest = "06c8fca76419015d"

[[equation]]
tag = 3
class = "standard"
title = "Transition Reynolds Number"
gloss = "Boundary-layer transition depends on a Reynolds number based on the distance from the leading edge."
cite = []
digest = "9db50bd94b3216e0"

[[equation]]
tag = 4
class = "standard"
title = "Wall-to-Recovery Temperature Ratio"
gloss = "Transition also depends on the ratio of the wall temperature to the temperature an insulated wall would reach."
cite = []
digest = "251e2364b39f4669"

[[equation]]
tag = 5
class = "standard"
title = "Dynamic Pressure"
gloss = "The dynamic pressure is half the density times the square of the true airspeed."
cite = []
digest = "8bed29c3ff1db806"

[[equation]]
tag = 6
class = "standard"
title = "Perfect Gas Law"
gloss = "For a perfect gas the density is the pressure over the gas constant times the temperature."
cite = []
digest = "6af362043e249315"

[[equation]]
tag = 7
class = "standard"
title = "Speed of Sound and True Airspeed"
gloss = "The speed of sound depends on temperature alone, and the true airspeed is the Mach number times that speed."
cite = []
digest = "dae04dddd847a99f"

[[equation]]
tag = 8
class = "standard"
title = "Dynamic Pressure in Terms of Pressure and Mach Number"
gloss = "Substituting the gas law and the speed of sound cancels the temperature, leaving half the ratio of specific heats times the pressure times the square of the Mach number."
cite = []
digest = "875d6924edc2fb96"

[[equation]]
tag = 9
class = "standard"
title = "Working Form of Dynamic Pressure for Air"
gloss = "With a ratio of specific heats of 1.4 the dynamic pressure is 0.7 times the pressure times the square of the Mach number."
cite = []
digest = "b5de82aa92c12b12"

[[equation]]
tag = 10
class = "standard"
title = "Pressure From Dynamic Pressure and Mach Number"
gloss = "Inverting the working form gives the ambient pressure that a dynamic pressure and a Mach number fix."
cite = []
digest = "6dafaf770bd733e6"

[[equation]]
tag = 11
class = "standard"
title = "Dynamic Pressure of the Published Test Condition"
gloss = "Mach 5 at the published altitude of seventy thousand feet, where the standard atmosphere gives 4,512.9 pascals, corresponds to a dynamic pressure of about 1,649 pounds per square foot."
cite = ["book_heiser_pratt", "book_anderson_hypersonic"]
digest = "4efce422c38c79d0"

[[equation]]
tag = 12
class = "standard"
title = "Hydrostatic Equation"
gloss = "The pressure gradient with altitude is minus the gravity times the density, or with the gas law minus the gravity times the pressure over the gas constant times the temperature."
cite = ["ref_us_standard_atmosphere"]
digest = "d74fefbe33079d20"

[[equation]]
tag = 13
class = "standard"
title = "Geopotential Altitude"
gloss = "Geopotential altitude folds the variation of gravity into the altitude coordinate through the effective Earth radius."
cite = ["ref_us_standard_atmosphere"]
digest = "fad7fb9800367bfe"

[[equation]]
tag = 14
class = "standard"
title = "Piecewise Linear Temperature Profile"
gloss = "In the standard atmosphere the temperature is linear in geopotential altitude within each layer."
cite = []
digest = "573715ea0d83d720"

[[equation]]
tag = 15
class = "standard"
title = "Pressure in a Layer With Nonzero Lapse Rate"
gloss = "Integrating the hydrostatic equation through a layer with a nonzero lapse rate gives a power law in the temperature ratio."
cite = []
digest = "d207d665856c1490"

[[equation]]
tag = 16
class = "standard"
title = "Pressure in an Isothermal Layer"
