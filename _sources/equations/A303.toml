digest = "46aef668eacfa6f3"

[[equation]]
tag = 2
class = "standard"
title = "Energy per Fission and Specific Energy of Uranium-235"
gloss = "About 200 megaelectronvolts per fission times the Avogadro constant over the molar mass gives the specific energy of fission."
cite = []
digest = "6c849f385562ab31"

[[equation]]
tag = 3
class = "standard"
title = "Ratio of Fission to Chemical Specific Energy"
gloss = "Fission releases about two million times the energy of combustion per unit mass."
cite = []
digest = "bc7674a8b9fa98e7"

[[equation]]
