[[equation]]
tag = 1
class = "standard"
title = "Specific Energy of Fission and of Kerosene"
gloss = "Complete fission of uranium-235 releases about $8.2 \\times 10^{13}$ joules per kilogram against about $4.3 \\times 10^{7}$ for kerosene."
