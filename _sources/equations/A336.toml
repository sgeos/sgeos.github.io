# Equation classification for A336. Read by `python3 _lib/equations.py`.

caution = "The relations carry no physical units, every quantity being either a set of design numbers within one basic mission or a calendar time, and the rule that the sequence never returns to a number it has passed is an empirical description of the designating office that the formal definition does not entail."

[[equation]]
tag = 1
class = "bespoke"
title = "Bespoke Set of Unavailable Design Numbers"
gloss = "The article formalises the register by taking the unavailable numbers at a time as the union of those already allocated and those reserved but not yet allocated."
cite = []
digest = "c375bac977f6a1cb"

[[equation]]
tag = 2
class = "bespoke"
title = "Bespoke Next Design Number to Be Issued"
gloss = "The instruction to issue the next available consecutive number is written as the smallest natural number outside the unavailable set."
cite = ["ref_afi_16_401_2005"]
digest = "1954416940bfa6ab"

[[equation]]
tag = 3
class = "bespoke"
title = "Bespoke Time at Which the Sequence Passes a Number"
gloss = "The passage time of a design number is defined as the first time the next issue exceeds it, a construction that relies on the documented practice that the sequence does not return to a number it has passed."
cite = ["ref_mds_allocation"]
digest = "406c8d0b9222fe70"

[[equation]]
tag = 4
class = "bespoke"
title = "Bespoke Recovery Condition for a Reserved Number"
gloss = "A reserved number is recoverable exactly when its original requester cancels the reservation before the sequence passes it, which restates the published allocation rule in one line."
cite = ["ref_mds_allocation"]
digest = "9428323f1e107a2d"

[[equation]]
tag = 5
class = "bespoke"
title = "Bespoke Monotonic Growth of the Reserved Set"
gloss = "Because the instruction prescribes no procedure for removing a reservation, the article takes the reserved set to only grow in the absence of an informal cancellation."
cite = []
digest = "0a6244cfd7b0d3f0"

[[equation]]
tag = 6
class = "bespoke"
title = "Bespoke Set of Permanent Gaps"
gloss = "The permanent gaps are defined as the reserved numbers below the next issue, a set that inherits the monotonic growth of the reserved set."
cite = []
digest = "2678bbc8b202566f"

[[equation]]
tag = 7
class = "bespoke"
title = "Bespoke Instantiation for the X-39"
gloss = "With no cancellation ever filed the cancellation time of number 39 is infinite, so the recovery condition fails against any finite passage time."
cite = []
digest = "d2b61b125ececb8b"

[[equation]]
tag = 8
class = "bespoke"
title = "Bespoke Dated Bounds on the Passage and the Cut"
gloss = "The record places the passage of number 39 no later than the end of 1997 and the cut of the programme between 30 October and 17 December 1997, bounds that overlap without ordering the two events."
cite = []
digest = "e2a680b512d9906b"

[[symbol]]
tex = 'U(t)'
meaning = "the set of design numbers unavailable at time $t$"

[[symbol]]
tex = 'A(t)'
meaning = "the set of design numbers already allocated within a basic mission"

[[symbol]]
tex = 'R(t)'
meaning = "the set of design numbers reserved but not yet allocated"

[[symbol]]
tex = 'm(t)'
meaning = "the design number the authority would issue next"

[[symbol]]
tex = '\tau_r'
meaning = "the time at which the sequence passes design number $r$"

[[symbol]]
tex = 't_c(r)'
meaning = "the time at which a reservation of $r$ is cancelled, taken as infinite when no cancellation is filed"

[[symbol]]
tex = 'G(t)'
meaning = "the set of permanent gaps"

[[symbol]]
tex = 't_{\text{cut}}'
meaning = "the time at which the programme was cut"
