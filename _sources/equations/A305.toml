# Equation classification for A305. Read by `python3 _lib/equations.py`.

caution = "Quantities are in International System units unless a line states otherwise, with altitudes and scale heights inside a logarithm or a product sometimes written in kilometres and the nozzle exit area first found in square inches from pounds of thrust, and the effective exhaust velocity of 1962 metres per second is a working value the article infers rather than a measured one."

[[equation]]
tag = 1
class = "standard"
title = "Beer and Lambert Attenuation"
gloss = "Radiation crossing an absorbing medium falls exponentially with the optical depth accumulated along its path."
cite = ["book_banks_kockarts_1973"]
digest = "4ef268cf8bc78821"

[[equation]]
tag = 2
class = "standard"
title = "Optical Depth of the Overhead Column"
gloss = "The optical depth above an altitude is the absorption cross-section times the column of absorbers overhead for a path at the zenith."
cite = ["book_banks_kockarts_1973"]
digest = "585791457df7748b"

[[equation]]
tag = 3
class = "standard"
title = "Scale Height of an Isothermal Atmosphere"
gloss = "The scale height is the thermal energy per molecule divided by the weight of a molecule, the distance over which an isothermal atmosphere thins by a factor of $e$."
cite = ["book_banks_kockarts_1973"]
digest = "9973da0dd52c0cb5"

[[equation]]
tag = 4
class = "standard"
title = "Scale Height at 250 Kelvin"
gloss = "Evaluating the scale height for air of mean molecular mass 28.9 atomic mass units at 250 kelvin and a gravity of 9.5 metres per second squared gives about 7.6 kilometres."
cite = []
digest = "995cc9fd4ef7f8c2"

[[equation]]
tag = 5
class = "standard"
title = "Optical Depth of an Exponential Atmosphere"
gloss = "For a density falling exponentially with the scale height the column integral collapses, so the optical depth is the cross-section times the local density times the scale height."
cite = ["research_chapman_1931"]
digest = "96adc92bdf28e39c"

[[equation]]
tag = 6
class = "standard"
title = "Density at Unit Optical Depth"
gloss = "The atmosphere becomes transparent at the density at which the optical depth falls to one."
cite = ["research_chapman_1931"]
digest = "0ff4659d09a47341"

[[equation]]
tag = 7
class = "standard"
title = "Altitude of Unit Optical Depth"
gloss = "The altitude at which the overhead column reaches unit optical depth is the scale height times the logarithm of the sea-level density over the critical density, so it depends only logarithmically on the cross-section."
cite = ["research_chapman_1931"]
digest = "bd6a7e45795e04fe"

[[equation]]
tag = 8
class = "standard"
title = "Critical Density for Lyman-Alpha Absorption by Oxygen"
gloss = "Molecular oxygen at 21 percent of the air with a cross-section near $10^{-24}$ square metres reaches unit optical depth at a total density of about $6.3 \\times 10^{20}$ per cubic metre."
