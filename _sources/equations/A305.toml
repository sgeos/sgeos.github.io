[[equation]]
tag = 182
class = "standard"
title = "Snell Invariant for an Acoustic Ray"
gloss = "A ray in an atmosphere stratified in sound speed keeps the cosine of its elevation over the local sound speed constant."
cite = ["research_cox_1948"]
digest = "59d00edacde503c7"

[[equation]]
tag = 183
class = "standard"
title = "Turning Altitude of an Acoustic Ray"
gloss = "The ray turns back at the altitude where the sound speed equals the ground sound speed over the cosine of the launch elevation."
cite = ["research_cox_1948"]
digest = "cc0d8daa8e8ecb42"

[[equation]]
tag = 184
class = "standard"
title = "Rayleigh Scattering Cross-Section"
gloss = "The scattering cross-section of a molecule varies as the inverse fourth power of wavelength and depends on the refractive index of the gas and its number density at standard conditions."
cite = []
digest = "1ae5c69818b23bf0"

[[equation]]
tag = 185
class = "standard"
title = "Searchlight Return from a Range"
gloss = "The scattered signal from a range is proportional to the local number density and falls as the inverse square of the range, so density follows from the signal times the square of the range."
cite = []
digest = "4c7f198f64ac56a8"

[[equation]]
tag = 186
class = "standard"
title = "Speed of Sound in an Ideal Gas"
gloss = "The speed of sound is the square root of the ratio of specific heats times the universal gas constant times the temperature over the molar mass."
cite = ["research_nordberg_1964"]
digest = "43e62cb555148b5f"

[[equation]]
tag = 187
class = "standard"
title = "Temperature from a Measured Sound Speed"
gloss = "Inverting the sound speed relation gives the temperature from a measured sound speed."
cite = ["research_nordberg_1964"]
digest = "891e12e47e80fe9b"

[[equation]]
tag = 188
class = "standard"
title = "Density from a Falling Sphere"
gloss = "Inverting the drag relation for a tracked sphere of known drag coefficient gives the local density."
cite = []
digest = "9cdee74c38468e7d"

[[equation]]
tag = 189
class = "standard"
title = "Local Absorber Density from the Optical Depth Profile"
gloss = "Differentiating the measured optical depth with respect to altitude and dividing by the cross-section gives the local number density."
cite = []
digest = "a51b29823bb1b08e"

[[equation]]
tag = 190
class = "standard"
title = "Slant Path Optical Depth"
gloss = "For a solar zenith angle below about seventy degrees the slant optical depth is the vertical value times the secant of that angle."
cite = ["research_chapman_1931_2"]
digest = "5afc66217b5ca76f"

[[equation]]
tag = 191
class = "standard"
title = "Rise of the Transparency Altitude at Sixty Degrees"
gloss = "A slant factor of two raises the unit optical depth altitude by the scale height times the natural logarithm of two, about 5.3 kilometres."
cite = []
digest = "51e6d14c86e1628b"

[[equation]]
tag = 192
class = "standard"
title = "Poisson Significance of a Source Excess"
gloss = "Source counts over a Poisson background give a significance that grows as the square root of the exposure time."
cite = []
digest = "0e4b313b7c7770a3"

[[equation]]
tag = 193
class = "standard"
title = "Exposure Time for a Detection"
gloss = "The exposure needed for a detection at $k$ standard deviations is $k^{2}$ times the total count rate over the square of the source rate."
cite = []
digest = "212e86df639701ca"

[[equation]]
tag = 194
class = "standard"
title = "Exposure for a Five-Sigma Detection"
gloss = "A source of one count per second against a background of five reaches five standard deviations in 150 seconds."
cite = []
digest = "87a79e5fa33e90ce"

[[equation]]
tag = 195
class = "standard"
title = "Electron Plasma Frequency"
gloss = "The plasma frequency depends only on the electron number density, about 8.98 times its square root in hertz."
cite = []
digest = "4845bee8a8fb6a81"

[[equation]]
tag = 196
class = "standard"
title = "Refractive Index of a Cold Plasma"
gloss = "A radio wave above the plasma frequency propagates with a refractive index below one that depends on the electron density and the wave frequency."
cite = []
digest = "fb72acc7fc9727eb"

[[equation]]
tag = 197
class = "standard"
title = "Dispersive Doppler Difference of Two Frequencies"
gloss = "Differencing the Doppler shifts of two harmonically related frequencies removes the common vehicle motion and leaves a term proportional to the rate of change of the electron content along the path."
cite = ["research_seddon_1953"]
digest = "b76cd1d5b7a00744"

[[equation]]
tag = 198
class = "standard"
title = "Molecular Diffusion Coefficient"
gloss = "The molecular diffusion coefficient varies inversely with number density."
cite = []
digest = "6ac2c7a18ca99bda"

[[equation]]
tag = 199
class = "standard"
title = "Turbopause Density"
gloss = "Equating the molecular diffusion coefficient to the eddy diffusivity gives the density at which the atmosphere stops being well mixed."
cite = []
digest = "88ab57bc76d4cc49"

[[equation]]
tag = 200
class = "bespoke"
title = "Bespoke Turbopause Density Estimate"
gloss = "The criterion is evaluated with a sea-level molecular diffusivity of $2 \\times 10^{-5}$ and an eddy diffusivity of 100 square metres per second, values the article assumes."
cite = []
digest = "577da23b931dc030"

