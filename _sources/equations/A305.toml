[[equation]]
tag = 9
class = "standard"
title = "Altitude at Which Lyman-Alpha Becomes Observable"
gloss = "The unit optical depth altitude for the Lyman-alpha critical density is about 80 kilometres."
cite = []
digest = "7c2e502dd2594aed"

[[equation]]
tag = 10
class = "standard"
title = "Altitude at Which Soft X-Rays Become Observable"
