# Equation classification for A279. Read by `python3 _lib/equations.py`.

caution = "Rates are per unit time on the platform in question, damages and costs are in United States dollars, the indicator equations take the value zero or one, and several letters are reused, with $\\alpha$ a self-excitation gain, a phase rate, a co-occurrence coefficient and a platform amplification gain, $\\gamma$ a decay or recovery rate and also a residual self-effect, and $T$ a target, a litigation duration in months and a test statistic."

