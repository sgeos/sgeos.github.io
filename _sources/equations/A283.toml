# Equation classification for A283. Read by `python3 _lib/equations.py`.

caution = "Contract values and prices are nominal United States dollars, written in millions or billions as each equation states, shares and reliabilities are dimensionless fractions, and the value, capability and coordination terms are abstract indices without units."

[[equation]]
tag = 1
class = "bespoke"
title = "Bespoke Anchor-Demand Condition"
gloss = "The article requires the share of revenue from anchor customers to stay at or above a threshold during the phase before commercial spinoff revenue matures."
cite = []
digest = "8cb90dc1e8e4a27e"

[[equation]]
tag = 2
class = "bespoke"
title = "Bespoke Anchor Demand as a Sum of Programmes"
gloss = "Anchor demand is written as a sum of programme demands, each switched on by an indicator over the activation window of the programme."
cite = []
digest = "2fbd3e42c26c38aa"

[[equation]]
tag = 3
class = "standard"
title = "Variance of a Sum of Programme Demands"
gloss = "The variance of a sum equals the sum of the programme variances plus twice the sum of their pairwise covariances."
cite = []
digest = "45b1095a2a05cf69"

[[equation]]
tag = 4
class = "bespoke"
title = "Bespoke Anchor-Demand Counterfactual"
gloss = "The anchor-demand contribution is defined as observed capability less the capability of a counterfactual trajectory without anchor demand."
cite = []
digest = "7bce7a79fe2db17f"

[[equation]]
tag = 5
class = "standard"
title = "Instrumental Variable Estimator"
gloss = "The instrumental variable estimator divides the covariance of the outcome with the instrument by the covariance of anchor demand with the instrument, under the condition that the instrument is uncorrelated with the residual."
cite = []
digest = "b97009f15b351491"

[[equation]]
tag = 6
class = "bespoke"
title = "Bespoke Anchor-Share Requirement over the Pre-Spinoff Phase"
gloss = "The article requires the anchor share of revenue to stay at or above the threshold from founding until spinoff revenue matures."
cite = []
digest = "a378d9e975424593"

[[equation]]
tag = 7
class = "bespoke"
title = "Bespoke Exponential Decay of Anchor Share"
gloss = "The article models the anchor share as an initial share decaying exponentially towards a steady floor."
cite = []
digest = "423415346d32f236"

[[equation]]
tag = 8
class = "bespoke"
title = "Bespoke Anchor Value Channels"
gloss = "The article divides anchor value into revenue, credential, standard transfer, redundancy and option channels."
cite = []
digest = "7a9362f6206590d1"

[[equation]]
tag = 9
class = "standard"
title = "Anchor Break-Even Condition"
gloss = "Anchor revenue must exceed the fixed capability cost plus the marginal cost of the anchor missions for the anchor alone to cover the capability."
cite = []
digest = "563fef29d9a5e9b1"

[[equation]]
tag = 10
class = "bespoke"
title = "Bespoke Reliability Transfer to Commercial Customers"
gloss = "The article sets the reliability commercial customers receive equal to the anchor reliability less a small degradation for commercial mission profiles."
cite = []
digest = "ba0b111c4501f2d3"

[[equation]]
tag = 11
class = "bespoke"
title = "Bespoke Commercial Surplus from Reliability Spillover"
gloss = "The article measures the surplus commercial customers gain from anchor-funded reliability as the integral of their marginal willingness to pay for reliability between their requirement and the anchor level."
cite = []
digest = "2c0ff214d3d3e38e"

[[equation]]
tag = 12
class = "standard"
title = "Present Value of Milestone Payments"
gloss = "The present value of a milestone contract sums each payment discounted to its achievement time."
cite = []
digest = "69e2932ed6e6d312"

[[equation]]
tag = 13
class = "bespoke"
title = "Bespoke Single-Anchor Dependency Ratio"
gloss = "The article measures dependence on one anchor customer as its demand divided by the combined demand of all other anchors."
cite = ["book_williamson_1985"]
digest = "3da1884dc941bc08"

[[equation]]
tag = 14
class = "standard"
title = "Profit under a Fixed-Price Contract"
gloss = "Under a fixed-price contract the provider keeps the difference between the contract price and the realised cost."
cite = []
digest = "b4489ce84bd1a902"

[[equation]]
tag = 15
class = "standard"
title = "Profit under a Cost-Plus Contract"
gloss = "Under a cost-plus contract the provider earns the negotiated margin on realised cost, which rewards higher cost."
cite = []
digest = "bcd6ef5d1c393867"

[[equation]]
tag = 16
class = "bespoke"
title = "Bespoke Mission-Directed Capability Increment"
