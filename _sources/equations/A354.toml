# Equation classification for A354. Read by `python3 _lib/equations.py`.

caution = "Areas are in square metres, speeds inside the equations in metres per second although the stall speeds are quoted in knots, powers in kilowatts, energies in kilowatt hours, specific energies in watt hours per kilogram, ranges in kilometres and torque in newton metres, and $e$ is the span efficiency while $e_b$ and $e_f$ are the specific energies of the battery and the fuel, with Roman numerals marking the Mod I to Mod IV configurations."

[[equation]]
tag = 1
class = "standard"
title = "Ratio of Mod III to Original Wing Area"
gloss = "The reported wing areas give a Mod III wing of 42 percent of the area of the wing it replaced."
cite = ["research_x57_flight_performance_estimates"]
digest = "7f17c9138076d0a9"

[[equation]]
tag = 2
class = "standard"
title = "Wing Loading"
gloss = "The wing loading is the weight a wing must carry per unit of its own area."
cite = []
digest = "c284364bb8bd640b"

[[equation]]
tag = 3
class = "standard"
title = "Ratio of Wing Loadings at Equal Mass"
gloss = "At the same mass the wing loading rises by the reciprocal of the area ratio, a factor of 2.38."
cite = []
digest = "fc5078515a404130"

[[equation]]
tag = 4
class = "standard"
title = "Lift Equation"
gloss = "Lift is the dynamic pressure times the wing area times the lift coefficient."
cite = ["ref_lift_coefficient"]
digest = "f1fb54e9c1a68315"

[[equation]]
tag = 5
class = "standard"
title = "Stall Speed"
gloss = "The stall speed is set by the wing loading, the air density and the maximum lift coefficient."
cite = ["ref_wing_loading", "ref_stall_speed", "ref_lift_coefficient"]
digest = "c27eb7b8b350aadb"

[[equation]]
tag = 6
class = "standard"
title = "Dynamic Pressure in a Propeller Slipstream"
gloss = "A propeller ahead of a wing adds a velocity increment that raises the local dynamic pressure above the free-stream value."
cite = ["ref_dynamic_pressure"]
digest = "abff2fc8f820be9a"

[[equation]]
tag = 7
class = "bespoke"
title = "Bespoke Blown Span Fraction"
