caution = "All lengths are dimensionless and measured in the unit grid of N-dimensional simplex noise, in which the simplex edge length depends on the dimension N."

[[equation]]
tag = 1
class = "standard"
title = "Kernel Summation Radius of Simplex Noise"
gloss = "The height of a regular N-simplex is its edge length multiplied by $\\sqrt{(N+1)/2N}$, so with the simplex noise edge length $\\sqrt{N/(N+1)}$ the dimension cancels and the kernel radius is $\\sqrt{1/2}$ for every $N$."
