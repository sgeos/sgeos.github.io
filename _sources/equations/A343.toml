[[symbol]]
tex = '\zeta_{\text{req}}'
meaning = "the empty-weight fraction the requirement targets"

[[symbol]]
tex = '\Delta_{\text{deck}}'
meaning = "the weight that carrier suitability adds, as a fraction of gross weight"

[[symbol]]
tex = '\Delta_{\text{crew}}'
