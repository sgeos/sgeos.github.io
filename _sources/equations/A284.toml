# Equation classification for A284. Read by `python3 _lib/equations.py`.

caution = "Prices and revenues are nominal United States dollars, prices per kilogram are dollars per kilogram to low Earth orbit unless another orbit is named, latency is in milliseconds, altitude is in kilometres, and capture ratios and shares are dimensionless fractions between zero and one."

[[equation]]
tag = 1
class = "bespoke"
title = "Bespoke Value-Capture Condition"
gloss = "The article defines the capture ratio as retained value over created value and requires it to stay at or above a threshold."
cite = []
digest = "1fadff434c5759ba"

[[equation]]
tag = 2
class = "bespoke"
title = "Bespoke Value Transfer Fraction"
gloss = "The transfer fraction is the complement of the capture ratio, the share of created value that passes to unaffiliated firms."
cite = []
digest = "ae0df1dd51463d7d"

[[equation]]
tag = 3
class = "standard"
title = "Variance of Created Value"
gloss = "The variance of a sum of retained and transferred value is the sum of their variances plus twice their covariance."
cite = []
digest = "729fb0d4df03517a"

[[equation]]
tag = 4
class = "bespoke"
title = "Bespoke Vertical Integration Counterfactual"
gloss = "The capture contribution is defined as observed retained value less the retained value of a counterfactual without vertical integration."
cite = []
digest = "c9c024baa66670f3"

[[equation]]
tag = 5
class = "bespoke"
title = "Bespoke Capture Ratio over the Horizon"
gloss = "The article requires the capture ratio to stay at or above the threshold from the start of value realisation to the horizon."
cite = []
digest = "691a53d2881a23ec"

[[equation]]
tag = 6
class = "bespoke"
title = "Bespoke Retained Value Channels"
gloss = "The article divides retained value into launch markup, Starlink subscription, Starlink hardware, Starshield defence and capability channels."
cite = []
digest = "1f80bb71848b44bc"

[[equation]]
tag = 7
