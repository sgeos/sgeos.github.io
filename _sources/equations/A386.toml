# Equation classification for A386. Read by `python3 _lib/equations.py`.

caution = "Each equation takes the units its section states. Distances are in kilometres unless the section says otherwise, the worked numbers are rounded to the precision of their inputs, and several letters are reused, each defined where it appears. The letter a is a semi-major axis in Equations 2 and 3 and an acceleration in Equation 35, R is the radius of a planet in Equations 4, 5 and 19 and a range in Equations 6 and 40, T is a sidereal day in Equation 17 and a temperature in Equations 21 and 34, the Greek letter tau is a time constant in Equations 7 and 8 and a torque in Equation 30, the Greek letter rho is a ratio of spending to income in Equation 13 and the density of air in Equations 31 to 33, and the capital Greek letter phi is a step function in Equation 29 and a gravitational potential in Equation 36."

[[equation]]
tag = 1
class = "standard"
title = "Bohr Energy Levels of Hydrogen"
gloss = "The energy of each permitted level in Bohr's model, which predicts the hydrogen spectrum despite a wrong picture of the electron."
cite = ["research_bohr_1913"]
digest = "194dbd7436385cfc"

[[equation]]
tag = 2
class = "standard"
title = "Laplace Sphere of Influence"
gloss = "The radius within which the patched-conic method treats a smaller body's gravity as the only gravity."
cite = ["book_curtis_2020_interplanetary"]
digest = "eb8dddbc76ec6878"

[[equation]]
tag = 3
class = "standard"
title = "Hill Radius"
gloss = "The approximate distance of a body's first and second Lagrange points, which lie outside its sphere of influence."
cite = ["research_kane_2017"]
digest = "0ced3629673c63bd"

[[equation]]
tag = 4
class = "standard"
title = "Circular Orbital Speed at the Surface"
gloss = "The speed of a circular orbit just above a body's surface in terms of its surface gravity and radius, which falls as the body shrinks at fixed gravity."
cite = ["agency_nasa_flight_to_orbit", "community_ksp_wiki_kerbin"]
digest = "beb73d12ec6708f0"

[[equation]]
tag = 5
class = "standard"
title = "Mean Density of a Sphere"
gloss = "The mean density of a body from its mass and radius, which shows what a small planet with Earth-like gravity must be made of."
cite = ["community_ksp_wiki_kerbin"]
digest = "dabcd00c7b80284b"

[[equation]]
tag = 6
class = "bespoke"
title = "Bespoke Engagement Time of a Straight Pass"
gloss = "The time two craft spend within weapon range on a straight pass at constant relative speed, an order-of-magnitude model of the article's."
cite = []
digest = "80a72e488b038902"

[[equation]]
tag = 7
class = "standard"
title = "EVE Online Velocity Law"
gloss = "The speed a ship reaches under full propulsion in EVE Online, the law of a body in a viscous fluid, as the community guide gives it."
cite = ["community_eve_uni_acceleration"]
digest = "08c0843527645204"

[[equation]]
tag = 8
class = "standard"
title = "EVE Online Alignment Time"
gloss = "The time a ship takes to reach three quarters of its top speed under the velocity law, which the developer-hosted documentation also gives."
cite = ["dev_ccp_useful_formulae"]
digest = "e5ab67c66889b917"

[[equation]]
tag = 9
class = "standard"
title = "EVE Online Industry Job Cost"
gloss = "The cost of installing an industry job in EVE Online, as the developer states it, with the system cost index scaled by the facility's bonuses."
cite = ["dev_ccp_viridian_2023"]
digest = "fcda9b53c518ac59"

[[equation]]
tag = 10
class = "bespoke"
title = "Bespoke Proportional Form of the 2014 System Cost Index"
gloss = "The square-root growth of EVE Online's cost index with a system's share of production, written from the developer's description of 2014 as a proportionality, since the exact current form is not published in text."
cite = ["dev_ccp_industry_2014"]
digest = "22b6cc4b1d9419bb"

[[equation]]
tag = 11
class = "bespoke"
title = "Bespoke Material Requirement from EVE Online's Stated Rules"
