digest = "525a4c088a7898e2"

[[equation]]
tag = 92
class = "bespoke"
title = "Bespoke Bearing for a Horizontal Hovering Aircraft"
gloss = "A pilot looking forward and down at a target directly below is taken to see it at a bearing of order 45 degrees, a representative figure rather than a measured one."
cite = []
digest = "7af3ecc657491113"

[[equation]]
tag = 93
class = "standard"
title = "Jet Hover Endurance Restated"
gloss = "A jet in the hover obeys an endurance equal to the fuel fraction over the specific fuel consumption."
cite = []
digest = "4e58d822068d144a"

[[equation]]
tag = 94
class = "standard"
title = "Rotor Power per Unit Thrust and Induced Velocity"
gloss = "Momentum theory gives the power per unit thrust as the induced velocity over the figure of merit $\\eta$, with the induced velocity set by the disc loading."
cite = []
digest = "8bab5bd62c73b11c"

[[equation]]
tag = 95
class = "standard"
title = "Rotor Hover Endurance"
gloss = "A rotor's hover endurance is the stored energy per unit mass times the energy fraction and the figure of merit, divided by standard gravity times the induced velocity."
cite = []
digest = "c96323da98c8e713"

[[equation]]
tag = 96
class = "bespoke"
title = "Bespoke Electric Tail-Sitter Hover Endurance"
gloss = "The rotor endurance is evaluated with the energy fraction set equal to the X-13 fuel fraction, a battery of 250 watt hours per kilogramme, an assumed figure of merit of 0.70 and an induced velocity of 14.1 metres per second, giving 15.8 minutes."
cite = []
digest = "4fbb41354e00ea18"

[[equation]]
tag = 97
class = "bespoke"
title = "Bespoke Effective Specific Consumption of a Rotor"
gloss = "The article defines an effective specific consumption for a rotor by matching its endurance relation to the jet form $t = \\zeta / c$."
cite = []
digest = "68fd0a3571b9af78"

[[equation]]
tag = 98
class = "standard"
title = "Weighted Least-Squares Control Allocation"
gloss = "The weighted minimum-norm solution of the allocation equation gives the actuator commands that produce the desired moment at least weighted cost."
cite = []
digest = "2d0ba26ac77bdce0"

[[equation]]
tag = 99
class = "standard"
title = "Slipstream Dynamic Pressure Equals Disc Loading"
gloss = "The dynamic pressure of the fully developed slipstream equals the disc loading."
cite = []
digest = "26a92332d5913fef"

[[equation]]
tag = 100
class = "bespoke"
title = "Bespoke Sensitivity of Crossover Speed to Elevon Effectiveness"
gloss = "Because the crossover speed is defined by an assumed moment increment, it varies as the inverse square root of that increment."
cite = []
digest = "7021e3624d71d6e6"

