class = "standard"
title = "Climb Gradient"
gloss = "The sine of the climb angle is the thrust-to-weight ratio less the reciprocal of the lift-to-drag ratio."
cite = []
digest = "0b2fd0266fdabeca"

[[equation]]
tag = 93
class = "bespoke"
title = "Bespoke Climb Gradient After Lift-Off"
gloss = "A subsonic lift-to-drag ratio near 8 that the article assumes at climb lift coefficient leaves a gradient of 0.315 with a thrust-to-weight ratio of 0.44."
cite = []
digest = "9446cf45864c1f58"

[[equation]]
tag = 94
class = "standard"
title = "Landing Gear Vertical Kinetic Energy"
gloss = "The landing gear absorbs the kinetic energy of the sink rate at touchdown."
cite = []
digest = "2a8bebffef4039b0"

[[equation]]
tag = 95
class = "standard"
title = "Landing Distance at Constant Braking Deceleration"
gloss = "The landing roll is the square of touchdown speed over twice the mean braking deceleration."
cite = []
digest = "7743e8b529d21ef8"

[[equation]]
tag = 96
class = "standard"
title = "Brake Energy"
gloss = "The brakes absorb the kinetic energy at touchdown less the work done by aerodynamic drag during the roll."
cite = []
digest = "9ff3db2dd76e10c1"

[[equation]]
tag = 97
class = "standard"
title = "Tire Ground Speed Limit"
gloss = "The touchdown ground speed, which is airspeed less headwind, must not exceed the tire speed rating."
cite = []
digest = "3f7958b6055ecf59"

[[equation]]
tag = 98
class = "standard"
title = "Landing Gear Stroke for a Load Factor Limit"
gloss = "The stroke needed to absorb a sink rate at a chosen gear load factor follows from uniform deceleration."
cite = []
digest = "53bee0baab427020"

[[equation]]
tag = 99
class = "standard"
title = "Vane Corrections for Body Rotation"
gloss = "Angle of attack and sideslip measured by boom vanes are corrected for the flow induced by pitch and yaw rates at the boom length."
cite = []
digest = "8d5acaa0f1d77383"

[[equation]]
tag = 100
class = "standard"
title = "Law of Propagation of Uncertainty"
gloss = "The combined variance of a derived quantity is the sum of the input variances weighted by the squared sensitivity coefficients."
cite = []
digest = "c4cd5d76a8ed80ce"

[[equation]]
tag = 101
class = "standard"
title = "Nyquist Sampling Criterion"
gloss = "The sample rate must exceed twice the highest frequency of interest."
cite = []
digest = "c3bb6d31e44d2087"

[[equation]]
tag = 102
class = "standard"
title = "Recorded Bit Budget"
gloss = "The data rate is the number of channels times the sample rate times the bits per sample."
cite = []
digest = "52a04774b450740d"

[[equation]]
tag = 103
class = "standard"
title = "Quantisation Step and Quantisation Noise"
gloss = "A converter of $b$ bits divides the full scale into steps whose uniform rounding error has a standard deviation of the step over the square root of twelve."
cite = []
digest = "619547d21e86705b"

[[equation]]
tag = 104
class = "standard"
title = "Propagation of Inertia Uncertainty into the Critical Roll Rate"
gloss = "Because the critical rate varies as the inverse square root of an inertia, its relative uncertainty is half the relative uncertainty of the inertia."
cite = []
digest = "799a1df707c9b69d"

[[equation]]
tag = 105
class = "standard"
title = "Compound Pendulum Period and the Parallel Axis Theorem"
gloss = "The swing period of a compound pendulum gives the inertia about the pivot, and the parallel axis theorem transfers it to the centre of gravity."
cite = []
digest = "b7d00a84f9d9c172"

[[equation]]
tag = 106
class = "standard"
title = "Uncertainty of an Inertia Found by Swing Test"
gloss = "Propagating period and pivot distance uncertainties through the pendulum relation amplifies them by the ratio of pivot inertia to centre of gravity inertia."
cite = []
digest = "45677b7654a6fe35"

[[equation]]
tag = 107
class = "standard"
title = "Gravity Component in a Dive"
gloss = "In a descent the weight component along the flight path acts as additional thrust."
cite = []
digest = "a9a8005fa756b2e2"

[[equation]]
tag = 108
class = "standard"
title = "Flights Required and Information Gained Under a Gaussian Model"
gloss = "For a Gaussian prior and measurement the number of flights to reach a target uncertainty and the information gained in nats follow from the precision update."
cite = ["research_lindley_1956", "research_chaloner_verdinelli_1995"]
digest = "89b182abf1690821"

[[equation]]
tag = 109
class = "bespoke"
title = "Bespoke Airframe Attrition Condition"
gloss = "The series sizes the airframe count as the smallest number for which the binomial probability of fewer losses than airframes over $n$ flights reaches the stated confidence."
cite = []
digest = "4b41cece686e99a5"

[[equation]]
tag = 110
class = "standard"
title = "Mass and Inertia Similarity Groups for a Dynamic Model"
gloss = "A dynamically scaled model must match the relative density and the nondimensional roll and pitch inertias of the full-scale aircraft."
cite = []
digest = "f6aedb96cec2b7b0"

[[equation]]
tag = 111
class = "standard"
title = "Reduced Frequency"
gloss = "The reduced frequency is the circular frequency of the motion multiplied by the time the flow takes to cross half the span."
cite = []
digest = "6ff7b32f61928006"

[[equation]]
tag = 112
class = "standard"
title = "Inertia Scaling of a Dynamically Similar Model"
gloss = "A model at geometric scale $1/k_g$ must have its inertias reduced by the fifth power of the scale and the ratio of air densities."
cite = []
digest = "09422b985de3b1dd"

[[equation]]
tag = 113
class = "standard"
title = "Posterior Uncertainty After Two Departures"
gloss = "Averaging two independent measurements reduces the uncertainty by the square root of two."
cite = []
digest = "4f791cf0f3f98502"

[[equation]]
tag = 114
class = "standard"
title = "Gear Energy and Touchdown Speed Scaling"
gloss = "The gear energy grows with the square of sink rate, and touchdown speed scales as the square root of wing loading over maximum lift coefficient."
cite = []
digest = "7db6ec3bff278377"

