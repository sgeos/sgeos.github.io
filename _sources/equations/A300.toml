# Equation classification for A300. Read by `python3 _lib/equations.py`.

caution = "Quantities are in units of the International System after conversion from the pounds, slug square feet and miles per hour of the sources, angles enter the aerodynamic relations in radians, and several letters change meaning between sections, so $\\gamma$ is the ratio of specific heats in the gas dynamics and the flight path angle in the trajectory relations, $q$ is dynamic pressure except in the body-axis equations where it is the pitch rate, and $p$ is static pressure, roll rate or a loss probability according to context."

[[equation]]
