# Equation classification for A258. Read by `python3 _lib/equations.py`.

caution = "Every quantity is a dimensionless parameter, probability or loss, or a return in the units of the reward, and the step sizes and weights $\\alpha$, $\\beta$ and $\\eta$ are reused with different meanings in different sections, so each is read in the section where it appears."

[[equation]]
tag = 1
class = "standard"
title = "Learning Algorithm as a Map from Data to Hypothesis"
gloss = "A conventional learning algorithm fixed by human design maps a training dataset to a hypothesis."
cite = []
digest = "01dfdaff0e3a0b93"

[[equation]]
tag = 2
class = "standard"
title = "Meta-Learning Objective over a Task Distribution"
gloss = "Meta-learning chooses the meta-parameters of the learning algorithm by optimising the expected task loss of the hypotheses it produces across a distribution of tasks."
cite = ["research_hospedales_et_al_2022"]
digest = "721ae09c24a1ea23"

[[equation]]
tag = 3
class = "standard"
title = "Meta-Reinforcement Learning Algorithm as a Map from Experience to Policy"
gloss = "In meta-reinforcement learning the parameterised algorithm maps the transitions collected during inner-loop adaptation to a policy."
cite = []
digest = "17009b1dddc24cfe"

[[equation]]
tag = 4
class = "bespoke"
title = "Bespoke Progressive Re-Adaptation Schedule at Meta-Test Time"
gloss = "The article writes the meta-test rollout as a sequence in which the policy is re-derived from the meta-algorithm after every transition, a schedule it chose to illustrate progressive adaptation."
cite = []
digest = "eb9bb2f561bc8578"

[[equation]]
tag = 5
class = "standard"
title = "Meta-Reinforcement Learning Training Objective"
gloss = "The meta-training objective is the expected return, over tasks drawn from the task distribution, of the policy the meta-algorithm produces after the adaptation horizon."
cite = []
digest = "4735f526d998d4e7"

[[equation]]
tag = 6
class = "standard"
title = "Expected Discounted Return of a Policy on a Task"
gloss = "The return of a policy on a task is the expected discounted sum of the task's rewards over a finite horizon from an initial state distribution."
cite = []
digest = "950a6b214c41168e"

[[equation]]
tag = 7
class = "standard"
title = "Bayes-Adaptive Optimal Policy"
gloss = "The Bayes-adaptive Markov decision process treats the task as a latent variable and seeks the policy that maximises expected return averaged over the prior on tasks."
cite = ["book_duff_2002"]
digest = "54451f4603ace022"

[[equation]]
tag = 8
class = "standard"
title = "RL-Squared Recurrent Meta-Policy"
gloss = "The policy of reinforcement learning squared, written RL-squared, conditions on a recurrent hidden state updated from the current observation, the previous action, the previous reward and the previous hidden state."
cite = ["research_duan_et_al_2016_rl2"]
digest = "d2bbf8a1fed2bca3"

[[equation]]
tag = 9
class = "standard"
title = "Model-Agnostic Meta-Learning Objective"
gloss = "Model-Agnostic Meta-Learning, known as MAML, seeks initial parameters whose loss after one inner gradient step is minimal in expectation over tasks."
cite = ["research_finn_abbeel_levine_2017"]
digest = "d35503325b89ba3f"

[[equation]]
tag = 10
class = "standard"
title = "MAML Inner-Loop Adaptation Step"
gloss = "The task parameters are obtained from the meta-parameters by one gradient step on the task's training loss with the inner step size."
cite = ["research_finn_abbeel_levine_2017"]
digest = "82a81379c37c1308"

[[equation]]
tag = 11
class = "standard"
title = "Multi-Step MAML Inner Loop"
gloss = "The multi-step extension repeats the inner gradient step $k$ times starting from the meta-parameters."
cite = ["research_finn_abbeel_levine_2017"]
digest = "626f68f7c7c9b4db"

[[equation]]
tag = 12
class = "standard"
title = "Second-Order MAML Meta-Gradient"
gloss = "Differentiating through the inner step multiplies the gradient at the adapted parameters by the identity minus the step size times the Hessian of the inner loss."
cite = ["research_finn_abbeel_levine_2017"]
digest = "fb61e0c72466234a"

[[equation]]
tag = 13
class = "standard"
title = "First-Order MAML Meta-Gradient"
gloss = "First-order MAML drops the Hessian term and uses the gradient at the adapted parameters as the meta-gradient."
cite = ["research_finn_abbeel_levine_2017"]
digest = "0fbd6ab6fd8d909b"

[[equation]]
tag = 14
class = "standard"
title = "Reptile Meta-Update"
gloss = "Reptile moves the meta-parameters a fraction $\\beta$ of the way toward the parameters reached after $k$ steps of stochastic gradient descent on a sampled task."
cite = ["research_nichol_achiam_schulman_2018"]
digest = "54a49f228b1481ce"

[[equation]]
tag = 15
class = "standard"
title = "REINFORCE Gradient of the Task Loss"
gloss = "In the reinforcement learning form of MAML the inner-loop gradient is the negated score-function estimate weighted by the return from each step."
cite = ["research_finn_abbeel_levine_2017"]
digest = "34e748320f2f7485"

[[equation]]
tag = 16
class = "standard"
title = "Contrastive Loss for Siamese Embeddings"
gloss = "The contrastive loss pulls same-class pairs together by their squared embedding distance and pushes different-class pairs apart until they are at least a margin $m$ away."
cite = []
digest = "c7ca64af9da1fd15"

[[equation]]
tag = 17
class = "standard"
title = "Matching Networks Attention Classifier"
gloss = "Matching Networks predict a query's label as an attention-weighted sum of support labels, with weights given by a softmax over cosine similarities of embeddings."
cite = ["research_vinyals_et_al_2016_matching"]
digest = "37cf33782c5f9be7"

[[equation]]
tag = 18
class = "standard"
title = "Class Prototype as Mean Support Embedding"
gloss = "Prototypical Networks represent each class by the mean embedding of its support examples."
cite = ["research_snell_swersky_zemel_2017"]
digest = "e311941a3c735741"

[[equation]]
tag = 19
class = "standard"
title = "Prototypical Networks Class Probability"
gloss = "A query is classified by a softmax over the negative squared distances from its embedding to each class prototype."
cite = ["research_snell_swersky_zemel_2017"]
digest = "d6431e19a597ee9b"

[[equation]]
tag = 20
class = "standard"
title = "PEARL Gaussian Task Posterior"
gloss = "Probabilistic Embeddings for Actor-critic Reinforcement Learning, known as PEARL, infers a Gaussian posterior over a latent task variable from a set of context transitions."
cite = ["research_rakelly_et_al_2019_pearl"]
digest = "a06ce539bc932ec2"

[[equation]]
tag = 21
class = "standard"
title = "Product-of-Gaussians Context Aggregation"
gloss = "Multiplying the per-transition Gaussian factors gives a precision-weighted mean and a precision equal to the sum of the factor precisions, which is invariant to the order of the transitions."
cite = ["research_rakelly_et_al_2019_pearl"]
digest = "b1c519cef4e93c82"

[[equation]]
tag = 22
class = "standard"
title = "Task-Conditioned Actor and Critic"
gloss = "In PEARL both the policy and the action-value function take the inferred latent task variable as an additional input."
cite = ["research_rakelly_et_al_2019_pearl"]
digest = "aa5dd6e6ef45169c"

[[equation]]
tag = 23
class = "standard"
title = "PEARL Meta-Training Objective"
gloss = "The PEARL objective combines the soft actor-critic objective with a weighted penalty on the Kullback-Leibler divergence, abbreviated KL, that pulls the task posterior toward a prior."
cite = ["research_rakelly_et_al_2019_pearl"]
digest = "726aea5875425dc5"

[[equation]]
tag = 24
class = "standard"
title = "Belief over Task Identity"
gloss = "The belief is the posterior probability of each task given the observations and actions so far, updated by Bayes rule at each step."
cite = ["book_duff_2002"]
digest = "5d45d82e54f5a2ff"

[[equation]]
tag = 25
class = "standard"
title = "VariBAD Recurrent Task Posterior"
gloss = "Variational Bayes-Adaptive Deep reinforcement learning, known as VariBAD, encodes the trajectory so far into a Gaussian posterior over a time-indexed latent task variable."
cite = ["research_zintgraf_et_al_2020_varibad"]
digest = "db577753487b219e"

[[equation]]
tag = 26
class = "standard"
title = "VariBAD Variational Objective"
gloss = "The VariBAD encoder is trained by a negative evidence lower bound that combines the log-likelihood of observations and rewards with a weighted KL regulariser on the latent posterior."
cite = ["research_zintgraf_et_al_2020_varibad"]
digest = "c9e763b4c07ea6f2"

[[equation]]
tag = 27
class = "standard"
title = "Belief-Conditioned VariBAD Policy"
gloss = "The VariBAD policy conditions on the current state and on the current variational posterior over the task."
cite = ["research_zintgraf_et_al_2020_varibad"]
digest = "b9c77057db361fec"

[[equation]]
tag = 28
class = "bespoke"
title = "Bespoke Hypernetwork Meta-Learner with Task Inference"
gloss = "The article composes a task-inference network in the style of PEARL with a hypernetwork that maps the inferred task embedding directly to policy parameters."
cite = ["research_ha_dai_le_2016"]
digest = "f8d4a27b9ae6b92d"

[[equation]]
tag = 29
class = "standard"
title = "Meta-Gradient Update of the Discount Factor"
gloss = "Meta-gradient reinforcement learning adjusts the discount factor online by a gradient step on an outer meta-objective evaluated at the policy parameters the inner learner produced."
cite = ["research_xu_van_hasselt_silver_2018"]
digest = "86ea28b3bfe7522f"

[[equation]]
tag = 30
class = "standard"
title = "Chain Rule for the Meta-Gradient"
gloss = "The meta-gradient factors into the sensitivity of the outer objective to the policy parameters and the sensitivity of those parameters to the hyperparameter, the second requiring backpropagation through inner training."
cite = ["research_xu_van_hasselt_silver_2018"]
digest = "9c496c402a8ac204"

[[equation]]
tag = 31
class = "standard"
title = "LIRPG Augmented Reward"
gloss = "Learned Intrinsic Reward Policy Gradient, known as LIRPG, adds a parameterised intrinsic reward to the extrinsic reward, with the intrinsic parameters tuned by meta-gradients on extrinsic return alone."
cite = ["research_zheng_oh_singh_2018_lirpg"]
digest = "4b9b29123d6fb1ed"

[[equation]]
tag = 32
class = "standard"
title = "Learned Recurrent Optimiser Update"
gloss = "A recurrent network with meta-parameters maps the current gradient and its hidden state to a parameter update and a new hidden state."
cite = ["research_andrychowicz_et_al_2016"]
digest = "451fee4e87d2a308"

[[equation]]
tag = 33
class = "bespoke"
title = "Bespoke Primary Loss with a Meta-Learned Auxiliary Term"
gloss = "The article writes the auxiliary-loss family as the primary loss plus a weighted parameterised loss whose parameters an outer loop tunes, a generic template rather than any one published objective."
cite = []
digest = "aab21dfd4ed6f7c7"

[[equation]]
tag = 34
class = "standard"
title = "Shared Trunk with Task-Specific Heads"
gloss = "Hard parameter sharing composes a task-specific head with a shared representation trained on all tasks."
cite = []
digest = "6185e71a510ed712"

[[equation]]
tag = 35
class = "standard"
title = "Distral Task-Policy Objective"
gloss = "Distral trains each task policy to maximise return while a KL term pulls it toward the shared distilled policy and an entropy bonus keeps it stochastic."
cite = ["research_teh_et_al_2017"]
digest = "f849825598b58199"

[[equation]]
tag = 36
class = "standard"
title = "PCGrad Gradient Projection"
gloss = "Projecting Conflicting Gradients, known as PCGrad, removes from a task gradient its component along another task's gradient when the two conflict."
cite = ["research_yu_et_al_2020_pcgrad"]
digest = "5f7ca2cade3b0a87"

[[equation]]
tag = 37
class = "standard"
title = "Online Adaptation from a Meta-Learned Initialisation"
gloss = "At each online step the parameters are recomputed from the meta-learned initialisation by a gradient step on the prediction loss over a sliding window of the $k$ most recent transitions."
cite = ["research_nagabandi_et_al_2018_meta_online"]
digest = "64a2b7dec77c21f0"

[[equation]]
tag = 38
class = "standard"
title = "Learning-History Trajectory"
gloss = "Algorithm Distillation trains on the whole interleaved sequence of observations, actions and rewards that a learning agent produces over its lifetime on a task."
cite = ["research_laskin_et_al_2023"]
digest = "3f5c2b46b033d856"

[[equation]]
tag = 39
class = "standard"
title = "Algorithm Distillation Objective"
gloss = "The transformer is trained by autoregressive cross-entropy to predict each action from the learning history that precedes it."
cite = ["research_laskin_et_al_2023"]
digest = "e453421a81181c8b"

[[equation]]
tag = 40
class = "bespoke"
title = "Bespoke Schematic Meta-Generalisation Bound"
gloss = "The article states a schematic bound in which expected risk exceeds empirical meta-risk by at most a term shrinking with the product of task count and samples per task, an abstract complexity measure standing in for the specific terms of any published theorem."
cite = []
digest = "610b9762507c1cf8"

[[equation]]
tag = 41
class = "bespoke"
title = "Bespoke Task-Conditioned World Model"
gloss = "The article represents the latent-variable family of model-based meta-learning methods as a dynamics model conditioned on a task embedding inferred from a short adaptation trajectory."
cite = []
digest = "f4339367a97e8406"

[[equation]]
tag = 42
class = "bespoke"
title = "Bespoke Task-Conditioned World Model Objective"
gloss = "The article assembles a training objective for its task-conditioned world model from a transition log-likelihood under the inferred task and a weighted KL regulariser toward a prior."
cite = []
digest = "1ad9e86b7952fcc6"

[[equation]]
tag = 43
class = "standard"
title = "Domain Randomisation Objective"
gloss = "Domain randomisation seeks one policy that maximises expected return over the distribution of randomised simulated environments, with no adaptation at test time."
cite = ["research_tobin_et_al_2017_dr"]
digest = "fb446126ffc7f31a"

