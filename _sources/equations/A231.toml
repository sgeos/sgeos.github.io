# Equation classification for A231. Read by `python3 _lib/equations.py`.

caution = "Per-capita ratios are taken against the United States and are fractions of the American level, defence spending is a fraction of gross domestic product, and growth rates and premia are continuous annual rates written as percentages."

[[equation]]
tag = 1
class = "standard"
title = "West German Per-Capita Ratio against the United States"
gloss = "West German per-capita output rose from about thirty-five percent of the American level in 1950 to about eighty percent in 1990."
cite = []
