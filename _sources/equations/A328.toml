# Equation classification for A328. Read by `python3 _lib/equations.py`.

caution = "Aircraft quantities are in customary units, with weights and thrusts in pounds, dynamic pressures in pounds per square foot, lengths in feet and speeds in knots or feet per second, every calibrated airspeed is read as the equivalent airspeed that gives the same dynamic pressure at sea-level density, and several letters are reused, so $n$ is a count of scored outcomes, a load factor and a thrust-lapse exponent, $\\alpha$ is a significance level in the interval relations and the angle of attack elsewhere, $p$ and $r$ are a probability and a turn radius except in the velocity-vector roll relation, where they are body-axis roll and yaw rates, and $\\rho_i$ is a campaign ratio rather than a density."

[[equation]]
tag = 1
class = "standard"
title = "Exchange Ratio"
gloss = "The exchange ratio is the number of adversary losses divided by the number of losses of the aircraft under test, a measure of effectiveness from the operations-research literature."
cite = ["research_pugh_mayberry_1973"]
digest = "daea78821aae1e49"

[[equation]]
tag = 2
class = "standard"
title = "Arithmetic Mean of the Four Condition Ratios"
gloss = "The unweighted mean of the four published per-condition exchange ratios is 6.43, three and a half times the published overall figure."
cite = []
digest = "f284d0e0f57a23e1"

[[equation]]
tag = 3
class = "standard"
title = "Pooled Exchange Ratio as a Ratio of Sums"
gloss = "The pooled exchange ratio divides the total adversary losses by the total losses of the aircraft under test across all conditions."
cite = ["research_hauck_anderson_1986"]
digest = "79edc64840723902"

[[equation]]
tag = 4
class = "standard"
title = "Pooled Ratio as a Loss-Weighted Mean"
gloss = "Substituting each condition's losses as its ratio times the test aircraft's losses shows the pooled ratio to be the mean of the condition ratios weighted by the denominator losses."
cite = ["research_hauck_anderson_1986"]
digest = "cf1e4eaccd6e590f"

[[equation]]
tag = 5
class = "standard"
title = "Pooled Ratio in Terms of Loss Shares"
gloss = "Writing the weights as each condition's share of the test aircraft's losses expresses the pooled ratio as a convex combination of the condition ratios."
cite = []
digest = "f69ece086d15de07"

[[equation]]
tag = 6
class = "bespoke"
title = "Bespoke Minimum Losing-Condition Share"
gloss = "The article bounds the share of losses in the losing conditions from below with a two-point mixture that places all winning weight on the smaller winning ratio and all losing weight on the smaller losing ratio."
cite = []
digest = "6f7b5c1b420f58ba"

[[equation]]
tag = 7
class = "bespoke"
title = "Bespoke Maximum Losing-Condition Share"
gloss = "Pairing the two larger ratios in the same two-point construction gives the upper end of the bracket, 93.6 percent."
cite = []
digest = "bbba2f1f28210d85"

[[equation]]
tag = 8
class = "bespoke"
title = "Bespoke Losing Share That Tips the Pooled Ratio to Parity"
gloss = "Solving the two-point mixture for a pooled ratio of exactly one gives a losing share of 92.14 percent, a threshold the article shows lies inside its bracket."
cite = []
digest = "014dccca51e7083d"

[[equation]]
tag = 9
class = "bespoke"
title = "Bespoke Two-Point Bracket on the Losing Share"
gloss = "The same two-point construction is stated in general form for application to the two further published comparisons."
cite = ["ref_joyce_pdf"]
digest = "bda1027c77e50cd5"

[[equation]]
tag = 10
class = "standard"
title = "Exchange Ratio as Odds of a Bernoulli Outcome"
gloss = "If each scored outcome is a Bernoulli trial in which the adversary is lost with probability $p$, the exchange ratio is the odds $p/(1-p)$ and maps one to one onto that probability."
cite = ["book_fleiss", "book_agresti"]
digest = "7093f80e78b4c623"

[[equation]]
tag = 11
class = "standard"
title = "Clopper-Pearson Lower Endpoint"
gloss = "The lower endpoint of the Clopper-Pearson interval is the probability at which the upper binomial tail from $k$ successes equals half the significance level."
cite = ["ref_clopper"]
digest = "f3f333318d0aca80"

[[equation]]
tag = 12
class = "standard"
title = "Clopper-Pearson Upper Endpoint"
gloss = "The upper endpoint is the probability at which the lower binomial tail through $k$ successes equals half the significance level."
cite = ["ref_clopper", "research_sandelius_1952"]
digest = "107c3b6b5a086f5e"

[[equation]]
tag = 13
class = "bespoke"
title = "Bespoke Outcome Split Reconstructed From a Ratio"
gloss = "Because the counts are unpublished, the article reconstructs the adversary and test-aircraft losses from each published ratio and a stated number of scored outcomes that it sweeps."
