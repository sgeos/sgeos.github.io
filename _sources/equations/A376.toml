digest = "a41fbcb5c064a2aa"

[[equation]]
tag = 11
class = "standard"
title = "Departure of the Published Index Totals from One"
gloss = "The maximum and the median absolute deviation from one of the yearly sum of published index values measure how far the published series departs from the share invariant."
