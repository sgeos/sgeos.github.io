digest = "c43bdcef6d723687"

[[equation]]
tag = 12
class = "standard"
title = "Proportion of Years Missing the Invariant"
gloss = "The number of years whose published total misses one by more than a thousandth, divided by all years in the series, gives a proportion near nine in ten."
