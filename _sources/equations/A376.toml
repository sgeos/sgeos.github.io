# Equation classification for A376, the balance of power after a war with China.

caution = "Capability figures are dimensionless shares of a world total, and every level depends on the set of states in the denominator while a ratio of two states' shares does not, so levels are comparable only within one stated reference set. A relative change is a fraction of the earlier value, and percentages are kept distinct from differences in percentage points."

[[equation]]
tag = 1
class = "standard"
title = "Component Share of a World Total"
gloss = "Each of the six capability components held by a state is divided by the world total of that component, so the shares of all states sum to one for every component."
cite = ["data_cow_nmc_v7"]
digest = "9e9af446376d79ea"

[[equation]]
tag = 2
class = "standard"
title = "Composite Index of National Capability"
gloss = "The Composite Index of National Capability is the equally weighted mean of a state's six component shares, which bounds it between zero and one."
cite = ["data_cow_nmc_v7", "book_singer_1972_capability_distribution"]
digest = "ef4093ffbb22196d"

[[equation]]
tag = 3
class = "standard"
title = "Index Values for China and the United States in 2022"
gloss = "The 2022 values of the Composite Index of National Capability are stated with the year renormalised so that the shares of all observed states sum to one."
cite = ["data_cow_nmc_v7"]
digest = "d26b1a1974fc6f21"

[[equation]]
tag = 4
class = "standard"
title = "Ratio of Chinese to American Capability Share in 2022"
gloss = "Dividing the two renormalised index values gives China about one and nine tenths times the capability share of the United States."
cite = []
digest = "a7bfd97de3aa9155"

[[equation]]
tag = 5
class = "bespoke"
title = "Bespoke Relative Change in Share over a Constant Set of States"
gloss = "The relative change from 1990 to 2022 is computed over the one hundred and sixty states present in every year, a reference set the article chose that alters the levels though not the ratio between two states."
cite = []
digest = "5cc9830b46eb2025"

[[equation]]
tag = 6
class = "standard"
title = "Invariance of a Share Ratio to the Reference Set"
gloss = "Every convention divides both states by the same denominator, so the denominator cancels and the ratio of two shares is identical under any reference set."
cite = []
digest = "a4ab2b089122e6ef"

[[equation]]
tag = 7
class = "standard"
title = "Ratio of Military Expenditure Shares"
gloss = "The ratio of the American to the Chinese share of world military expenditure in 2022 shows the United States ahead by nearly four to one on that component."
cite = []
digest = "dea8ce6b57aa289d"

[[equation]]
tag = 8
class = "standard"
title = "Ratios of Underlying Steel Output and Military Expenditure"
gloss = "The raw 2022 values reproduce the component ratios, with China far ahead in iron and steel tonnage and the United States far ahead in military spending."
cite = []
digest = "2c35927d191a8ea1"

[[equation]]
tag = 9
class = "standard"
title = "Published Index Averaged over Recorded Components"
gloss = "The codebook averages a state's shares over only the components actually recorded for it, rather than dividing by six in every case."
cite = ["data_cow_nmc_v7"]
digest = "0925312e0270dad6"

[[equation]]
tag = 10
class = "standard"
title = "Inflation of the Published Index by Missing Components"
gloss = "Where components are missing the published value exceeds the sixfold average by the ratio of six to the number of components present."
