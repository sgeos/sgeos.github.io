[[symbol]]
tex = 'x_{c,i,t}'
meaning = "the value of capability component $c$ held by state $i$ in year $t$"

[[symbol]]
tex = 's_{c,i,t}'
meaning = "the share of state $i$ in the world total of component $c$ in year $t$"

[[symbol]]
tex = '\mathrm{CINC}_{i,t}'
meaning = "the Composite Index of National Capability of state $i$ in year $t$ on the sixfold definition"

[[symbol]]
tex = '\mathrm{CINC}^{\text{published}}_{i,t}'
meaning = "the index value as published, averaged over the recorded components only"

[[symbol]]
tex = 'A_{i,t}'
meaning = "the set of components actually recorded for state $i$ in year $t$"

[[symbol]]
tex = 'S_{i,t}'
meaning = "the share of state $i$ over the set $C$ of states present in both compared years"

[[symbol]]
tex = '\delta_{i}'
meaning = "the relative change in a belligerent's fixed-membership share from the year before the war to five or ten years after it"

[[symbol]]
tex = '\tau_{i}'
meaning = "the relative change in the same share over an equal window before the war"

[[symbol]]
tex = 't_{0}'
meaning = "the year before the war began"

[[symbol]]
tex = 't_{1}'
meaning = "the year five or ten years after the war ended"

[[symbol]]
tex = 'h'
meaning = "the length of the comparison window in years"

[[symbol]]
