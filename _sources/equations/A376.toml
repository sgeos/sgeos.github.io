digest = "076c06a7932ffb2d"

[[equation]]
tag = 13
class = "standard"
title = "Inflation of China's 1860 Index Value"
gloss = "China in 1860 is missing two components, so its published value is half again its value on the sixfold definition, as the inflation factor predicts."
