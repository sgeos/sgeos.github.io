class = "bespoke"
title = "Bespoke Platform Tilt Allowance"
gloss = "A static tilt $\\theta$ resolves gravity into the horizontal channel, and the assumed budget over 280 seconds allows 46 arcseconds."
cite = []
digest = "4bb780b48b0eb787"

[[equation]]
tag = 94
class = "bespoke"
title = "Bespoke Gyroscope Drift Allowance"
gloss = "A constant drift integrates twice into a velocity error, so the assumed budget over 280 seconds allows $1.59 \\times 10^{-6}$ radians per second."
cite = []
digest = "3319abc23c585efe"

[[equation]]
tag = 95
class = "bespoke"
title = "Bespoke Gyroscope Drift in Degrees per Hour"
gloss = "The drift allowance derived from the assumed budget is 0.329 degrees per hour."
cite = []
digest = "4c75b780b046c26b"

[[equation]]
tag = 96
class = "standard"
title = "Interferometer Fringe Spacing"
gloss = "Two antennas on a baseline $B$ receiving wavelength $\\lambda_{r}$ produce fringes spaced $\\lambda_{r} / B$ in angle."
cite = []
digest = "29f899a3fa4a3731"

[[equation]]
tag = 97
class = "standard"
title = "Two-Way Doppler Range Rate"
gloss = "A two-way Doppler shift $f_{d}$ corresponds to a range rate of half the shift times the wavelength."
cite = []
digest = "2e70ae0d433c8bdc"

[[equation]]
tag = 98
class = "bespoke"
title = "Bespoke Range-Rate Resolution at C-Band"
gloss = "A one hertz frequency resolution at a wavelength of six centimetres, taken as representative of C-band, resolves 0.030 metres per second."
cite = []
digest = "4abee78422288bef"

[[equation]]
tag = 99
class = "bespoke"
title = "Bespoke Round-Trip Delay"
gloss = "The round-trip propagation delay at an assumed slant range of 500 kilometres is 3.34 milliseconds."
cite = []
digest = "062af9a9e568aeb0"

[[equation]]
tag = 100
class = "standard"
title = "Speed Change Between Samples"
gloss = "At acceleration $a$ the speed changes by $a / f$ between updates at rate $f$."
cite = []
digest = "7699c4a7139bf337"

[[equation]]
tag = 101
class = "standard"
title = "Allen and Eggers Peak Deceleration"
gloss = "For a ballistic entry into an exponential atmosphere of scale height $H$ the peak deceleration depends on the entry speed and angle and not on the ballistic coefficient."
cite = []
digest = "0b546870a54f0d74"

[[equation]]
tag = 102
class = "bespoke"
title = "Bespoke Peak Deceleration of the Nose Cone"
gloss = "The peak deceleration is evaluated at the representative 7,193 metres per second, an entry angle of 22.5 degrees and a scale height of 7.2 kilometres."
cite = []
digest = "7a2682d1c1bfef97"

[[equation]]
tag = 103
class = "standard"
title = "Altitude of Peak Deceleration"
gloss = "In the Allen and Eggers solution the ballistic coefficient $\\beta$ sets the altitude of peak deceleration."
cite = []
digest = "d4098e0af9ab1ec2"

[[equation]]
tag = 104
class = "bespoke"
title = "Bespoke Ballistic Coefficient of the Nose Cone"
gloss = "An assumed body of 1,400 kilogrammes on a one metre base at a drag coefficient of one gives 1,783 kilogrammes per square metre and peak deceleration at 18.4 kilometres."
cite = []
digest = "7978714d607e2c2a"

[[equation]]
tag = 105
class = "bespoke"
title = "Bespoke Speed at Peak Deceleration"
gloss = "The Allen and Eggers result that speed at peak deceleration is $e^{-1/2}$ of the entry speed is evaluated at the representative entry speed."
cite = []
digest = "6b829e0ed867f3c3"

[[equation]]
tag = 106
class = "bespoke"
title = "Bespoke Stagnation-Point Heating"
gloss = "The Sutton and Graves correlation is evaluated at the estimated peak-deceleration condition for a nose radius the article chooses."
cite = []
digest = "1a98436d65c5a6d2"

[[equation]]
tag = 107
class = "standard"
title = "Plasma Frequency"
gloss = "An ionised sheath of electron density $n_{e}$ reflects radio waves below a plasma frequency of about $8.98 \\sqrt{n_{e}}$ hertz."
cite = []
digest = "08f7a897eb2e6d16"

[[equation]]
tag = 108
class = "standard"
title = "Critical Electron Density"
gloss = "Inverting the plasma frequency gives the electron density at which a link of frequency $f$ fails."
cite = []
digest = "aa8e8ffb49e4f9f2"

[[equation]]
tag = 109
class = "standard"
title = "Critical Density Ratio of Two Links"
gloss = "The critical densities of an S-band link at 2.2 gigahertz and a very high frequency link at 250 megahertz differ by the square of their frequency ratio, 77.4."
cite = []
digest = "3b1a870ad03a8e74"

[[equation]]
tag = 110
class = "standard"
title = "Range of the Full-Range Flight"
gloss = "The 6,325 statute miles flown by missile 12B are 10,179 kilometres or 5,496 nautical miles."
cite = []
digest = "7ceee41b0954e25e"

[[equation]]
tag = 111
class = "bespoke"
title = "Bespoke Burnout Speed of the Full-Range Flight"
gloss = "The burnout speed needed for 10,179 kilometres is 7,222 metres per second on the article's spherical range law."
cite = []
digest = "4bbc7190ed51f6f4"

[[equation]]
tag = 112
class = "bespoke"
title = "Bespoke Sensitivity Check on the Full-Range Flight"
gloss = "The dimensionless sensitivity at the representative range reproduces the 1.79 percent range increment from the 29 metre per second speed increment."
cite = []
digest = "eebdb9d0f7774821"

[[equation]]
tag = 113
class = "standard"
title = "Revolutions in Orbit"
gloss = "Thirty-four days at the SCORE period of 6,087 seconds is 483 revolutions."
cite = ["ref_nssdc_score"]
digest = "67525f55b43f5871"

[[equation]]
tag = 114
class = "standard"
title = "Revolutions on Battery Power"
gloss = "The twelve days of battery life cover 170 revolutions."
cite = ["ref_nssdc_score"]
digest = "f60d90675a778646"

[[equation]]
tag = 115
class = "standard"
title = "Period to Recorder Capacity Ratio"
gloss = "The orbital period is 25.4 times the four minute capacity of the recorder."
cite = ["ref_nssdc_score"]
digest = "991dc2a5bb3079f2"

[[equation]]
tag = 116
class = "standard"
title = "Nyquist Sample Count of the Recorder"
gloss = "Four minutes of audio with an upper band edge of 1,500 hertz carry 720,000 samples at the Nyquist rate."
cite = []
digest = "d23c8e9855fb36d3"

[[equation]]
tag = 117
class = "standard"
title = "Free-Space Path Loss at Apogee"
gloss = "The free-space loss at 132 megahertz over the 1,484 kilometre apogee distance is 138.3 decibels."
cite = []
digest = "e7ac4745280bbd14"

[[equation]]
tag = 118
class = "bespoke"
title = "Bespoke Received Power from SCORE"
gloss = "The received power assumes a body-mounted antenna of unity gain and a ground antenna of ten decibels with the catalogued eight watt transmitter."
cite = []
digest = "054ffe197681e484"

[[equation]]
tag = 119
class = "bespoke"
title = "Bespoke Noise Floor"
gloss = "The thermal noise power $k T_{\\text{sys}} B$ is evaluated for an assumed system temperature of 2,000 kelvin and an assumed bandwidth of six kilohertz."
cite = []
digest = "01bfd5b64e9ab42b"

[[equation]]
tag = 120
class = "standard"
title = "Area-to-Mass Ratio of the SCORE Stage"
gloss = "A three metre circular section on the catalogued 3,980 kilogrammes gives $1.83 \\times 10^{-3}$ square metres per kilogramme."
cite = ["ref_nssdc_score"]
digest = "6bb55cfe5500f037"

[[equation]]
tag = 121
class = "bespoke"
title = "Bespoke Ballistic Coefficient of the SCORE Stage"
gloss = "The ballistic coefficient uses an assumed drag coefficient of 2.2 on the catalogued mass and the stage cross-section."
cite = []
digest = "fb615871eeda39d2"

[[equation]]
tag = 122
class = "bespoke"
title = "Bespoke Energy Shed per Revolution"
gloss = "The article spreads the energy difference between the SCORE orbit and an orbit at the Earth radius evenly over 483 revolutions."
cite = []
digest = "406be57208466ca0"

[[equation]]
tag = 123
class = "standard"
title = "Standard Error of a Success Rate"
gloss = "Six successes in ten flights give a binomial success rate of 0.6 with a standard error of 0.155."
cite = []
digest = "8a03eb6f85e71420"

[[equation]]
tag = 124
class = "standard"
title = "Standard Error of a Difference in Proportions"
gloss = "The pooled standard error of the difference between the Atlas A and Atlas B success rates is 0.236 on the previous article's count of four successes in eight."
cite = []
digest = "e804b135cd03b946"

[[equation]]
tag = 125
class = "standard"
title = "Test Statistic for the Improvement"
gloss = "An improvement of 0.10 over a standard error of 0.236 gives a test statistic of 0.42."
cite = []
digest = "c4f8c428d0c7299e"

[[equation]]
tag = 126
class = "standard"
title = "Test Statistic on the Official Count"
gloss = "On the official count of three Atlas A successes in eight the test statistic rises to 0.95."
cite = ["book_neufeld_1990"]
digest = "c1d9003208cdb161"

[[equation]]
tag = 127
class = "bespoke"
title = "Bespoke Flights for a Five Point Standard Error"
gloss = "The sample size for a standard error of five percentage points at the pooled success rate, a target the article chooses, is 99 flights."
cite = []
digest = "4845f448dcfca013"

[[equation]]
tag = 128
class = "bespoke"
title = "Bespoke Mass at the First Failure"
gloss = "The mass at 43 seconds assumes a constant vacuum mass flow from the Atlas D lift-off mass."
cite = []
digest = "e814b133caa036ee"

[[equation]]
tag = 129
class = "bespoke"
title = "Bespoke Propellant Consumed by the Turbopump Failure"
gloss = "The propellant passed through the engines by 82 seconds assumes the same constant vacuum mass flow."
cite = []
digest = "d72a695885a1b648"

[[equation]]
tag = 130
class = "bespoke"
title = "Bespoke Mass and Thrust Ratio at the Thrust Loss"
gloss = "At 121 seconds the constant mass flow model leaves 36,080 kilogrammes, and the vacuum thrust is 5.38 times the weight."
cite = []
digest = "9e87bd99c3ef822c"

[[equation]]
tag = 131
class = "standard"
title = "Measurement Variance in Quadrature"
gloss = "An instrument's error adds in quadrature to the true scatter it measures."
cite = []
digest = "3aba96970c28d318"

[[equation]]
tag = 132
class = "standard"
title = "Instrument Accuracy for a Bounded Inflation"
gloss = "Holding the apparent inflation of the scatter below a fraction $\\eta$ bounds the ratio of instrument to true error by $\\sqrt{(1 + \\eta)^{2} - 1}$."
cite = []
digest = "58ae85a97926811d"

[[equation]]
tag = 133
class = "bespoke"
title = "Bespoke Gyroscope Gap"
gloss = "Period gyroscopes taken as drifting at about one degree per hour exceed the derived allowance by a factor of three."
cite = []
digest = "ceafdca93b2ef6e9"

[[equation]]
tag = 134
class = "bespoke"
title = "Bespoke Reaction Time over Flight Time"
gloss = "The required fifteen minute reaction time is 44 percent of the 34.3 minute flight time computed for the representative arc."
cite = ["book_neufeld_1990"]
digest = "4157336e9e9073b8"

[[equation]]
tag = 135
class = "bespoke"
title = "Bespoke Fuel Loading Time over Flight Time"
gloss = "Fuel loading from 12.25 minutes before launch is 36 percent of the computed flight time."
cite = ["book_neufeld_1990"]
digest = "dc343f1b8b96361b"

[[equation]]
tag = 136
class = "standard"
title = "Holding Time Against Boil-Off"
gloss = "A propellant load with an ullage margin $\\mu$ losing a fraction $\\dot{m} / m$ per unit time can be held for the margin over the loss rate."
cite = []
digest = "2dea8d61ee3291cb"

[[equation]]
tag = 137
class = "bespoke"
title = "Bespoke Five Day Holding Time"
gloss = "An assumed five percent margin against an assumed loss of one percent per day gives five days."
cite = []
digest = "d88cd9a5664e593f"

[[equation]]
tag = 138
class = "bespoke"
title = "Bespoke Accuracy Chain"
gloss = "Assuming the whole circular error probable comes from cutoff speed, the article chains it through the range sensitivity to bounds on accelerometer bias and gyroscope drift."
cite = []
digest = "96b054f46e277dd6"

[[equation]]
tag = 139
class = "bespoke"
title = "Bespoke Yield Ratio for a Modern Accuracy"
gloss = "Cube-root scaling between the assumed two nautical mile accuracy and an accuracy of 120 metres gives a yield ratio of $2.94 \\times 10^{4}$."
cite = []
digest = "55cf8a2f6a808464"

[[equation]]
tag = 140
class = "bespoke"
title = "Bespoke Speed Budget Scaling with the Assumed Accuracy"
gloss = "The speed budget scales linearly with the assumed circular error probable at the representative range sensitivity."
cite = ["book_neufeld_1990"]
digest = "f89ab6ef8afd92ea"

