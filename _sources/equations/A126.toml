# Equation classification for A126. Read by `python3 _lib/equations.py`.

caution = "The link budget is written in decibels, with powers in decibels relative to a reference and gains in decibels, and the free-space path loss constant of 32.44 holds only with distance in kilometres and frequency in megahertz, while the radio horizon takes antenna heights in metres and returns kilometres."

[[equation]]
tag = 1
class = "standard"
title = "Link Budget"
gloss = "The received power in decibels is the transmitter power plus both antenna gains less the path loss."
cite = ["ref_link_budget"]
