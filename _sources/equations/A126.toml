[[equation]]
tag = 2
class = "standard"
title = "Free-Space Path Loss in Decibels"
gloss = "The free-space path loss from the Friis transmission equation grows by twenty decibels per decade of distance and of frequency."
cite = ["ref_fspl", "ref_friis"]
digest = "bfbcd80f389fa16d"

[[equation]]
tag = 3
class = "standard"
title = "Radio Horizon"
gloss = "The line-of-sight range between two antennas is the sum of their horizon distances, with a constant slightly larger than the geometric one to allow for atmospheric refraction."
cite = ["ref_los"]
digest = "0431e500386b0fc7"

