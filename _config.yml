# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Brendan A R Sechter's Development Blog
author: Brendan Sechter
author_url: https://www.linkedin.com/in/brendan-sechter/
email: bsechter@sennue.com
description: > # this means to ignore newlines until "baseurl:"
  A personal technical notebook covering systems programming,
  systems philosophy, tooling, mathematics, and emerging software paradigms.
baseurl: "" # the subpath of your site, e.g. /blog

# Default social preview image, used for og:image and twitter:image on every
# page that does not set its own `image:` in front matter. Leave unset and both
# tags are omitted, which previews better than pointing at a missing or tiny
# image. Supply a 1200x630 asset, for example /assets/image/social-card.png,
# then set the path here.
# og_image: /assets/image/social-card.png
url: "https://sgeos.github.io" # the base hostname & protocol for your site
twitter_username: brendan_sechter
github_username:  sgeos

# Build settings
markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-archives

# jekyll-feed emits a topical Atom feed per listed category so
# readers can subscribe to a single thread rather than the full
# corpus. The list is curated to the top-N most-populated first
# categories, not exhaustive; readers can also filter by category on
# the archive pages.
feed:
  categories:
    - aerospace
    - business
    - games
    - compilers
    - programming-languages
    - freebsd
    - science
    - ai
    - rust
    - gamedev
    - phoenix
    - elixir
    - jekyll
    - hdl
    - engineering

# jekyll-archives configuration. Categories and tags are archived. Year,
# month, and day are not archived because the index already offers
# by-year browsing.
jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: archive
    tag: archive
  permalinks:
    category: '/categories/:name/'
    tag: '/tags/:name/'

# This list replaces Jekyll's default exclude, so build and tooling files
# must be listed explicitly to keep them out of the generated site.
exclude:
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - secret
  - tmp
  - README.md

excerpt_separator: ""   # Workaround for http://blog.slaks.net/2013-08-09/jekyll-tag-was-never-closed

# Use Jekyll's default future: false so posts dated after the build time are
# excluded until their date arrives. Forward-dated posts must therefore not be
# referenced via post_url tags from posts whose dates have already passed, or
# the build will fail when the back-dated side renders before the forward side
# becomes eligible. Intra-cluster post_url references between forward-dated
# posts are safe because both sides are excluded together.
future: false

# Pin permalink date arithmetic to UTC. Without this Jekyll falls back to the
# build machine's timezone, so a post stamped near midnight resolves to a
# different day locally than in CI. The 2026-03-06 01:14 +0000 post builds as
# /2026/03/06/ on the UTC runner, which is the live URL, but as /2026/03/05/ on
# a machine in Pacific time. Local verification of a URL was therefore not
# evidence about production.
#
# UTC is what the GitHub Actions runner already uses, so this changes no
# existing URL. It makes local builds agree with the deployed site.
timezone: UTC

