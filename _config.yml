# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Brendan A R Sechter's Development Blog
author: Brendan Sechter
author_url: https://www.linkedin.com/in/brendan-sechter/
email: bsechter@sennue.com
description: > # this means to ignore newlines until "baseurl:"
  I wanted a blog so I can post solutions to technical problems I find.
  This is it.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://sgeos.github.io" # the base hostname & protocol for your site
twitter_username: brendan_sechter
github_username:  sgeos

# Build settings
markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap

# This list replaces Jekyll's default exclude, so build and tooling files
# must be listed explicitly to keep them out of the generated site.
exclude:
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - secret
  - tmp
  - README.md

excerpt_separator: ""   # Workaround for http://blog.slaks.net/2013-08-09/jekyll-tag-was-never-closed

# Use Jekyll's default future: false so posts dated after the build time are
# excluded until their date arrives. Forward-dated posts must therefore not be
# referenced via post_url tags from posts whose dates have already passed, or
# the build will fail when the back-dated side renders before the forward side
# becomes eligible. Intra-cluster post_url references between forward-dated
# posts are safe because both sides are excluded together.
future: false

