# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Brendan A R Sechter's Development Blog
email: bsechter@sennue.com
description: > # this means to ignore newlines until "baseurl:"
  I wanted a blog so I can post solutions to technical problems I find.
  This is it.
baseurl: "" # the subpath of your site, e.g. /blog
url: "http://sgeos.github.io" # the base hostname & protocol for your site
twitter_username: brendan_sechter
github_username:  sgeos

# Build settings
markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap

# This list replaces Jekyll's default exclude, so build and tooling files
# must be listed explicitly to keep them out of the generated site.
exclude:
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - secret
  - tmp
  - README.md

excerpt_separator: ""   # Workaround for http://blog.slaks.net/2013-08-09/jekyll-tag-was-never-closed

# Publish posts dated in the future relative to the build time. Without this
# flag, Jekyll's default future: false silently excludes future-dated posts
# from the build, which breaks post_url cross-references to those posts and
# leaves committed work invisible until its date arrives. Setting future to
# true publishes all posts immediately regardless of date. The date in the
# front matter still controls the URL path and chronological display order.
future: true

